function norm(t){return t.replace(/[\u0591-\u05C7]/g,"").toLowerCase();}
function wordItems(){
  const src=wordsTab==="mastered"?S.mastered:S.review,q=norm((document.getElementById("wsearch")||{}).value||"").trim();
  let ids=Object.keys(src).map(Number).sort((a,b)=>src[b]-src[a]||W[a][0].localeCompare(W[b][0]));
  if(q)ids=ids.filter(id=>norm(W[id][0]).includes(q)||norm(W[id][1].join(" ")).includes(q));
  if(!ids.length)return `<p class="muted">${q?"לא נמצאו מילים.":wordsTab==="mastered"?"עוד אין כאן מילים. מילים שתענה עליהן נכון במבחן יופיעו כאן.":"אין מילים לחזרה כרגע."}</p>`;
  return `<ul class="wl">${ids.map(id=>`<li><button class="wrow" data-a="wopen" data-id="${id}" aria-expanded="${openWord===id}"><span class="mw"><bdi>${esc(W[id][0])}</bdi></span><span class="wd">${esc(W[id][1].join("; "))}</span></button>${openWord===id?`<div class="wx">${exHtml(id)}</div>`:""}</li>`).join("")}</ul>`;
}
function words(){
  return `${topBar(homeLink)}<h1>המילים שלי</h1>
  <div class="tabs"><button class="${wordsTab==="mastered"?"on":""}" data-a="tab" data-t="mastered">יודע (${count(S.mastered)})</button><button class="${wordsTab==="review"?"on":""}" data-a="tab" data-t="review">לחזרה (${count(S.review)})</button></div>
  <input id="wsearch" class="search" type="search" placeholder="${L==="en"?"חיפוש מילה באנגלית או בעברית":"חיפוש מילה או הגדרה"}">
  <div id="wlist">${wordItems()}</div>`;
}
function howto(){
  const back=S.seenHowto;
  return `${back?topBar(homeLink):topBar(`<span>${LANG[L].title}</span>`)}
  <h1>איך זה עובד</h1>
  <ol class="howto">
    <li>בכל יום מקבלים ${S.perDay} מילים חדשות, ${L==="en"?"עם התרגום לעברית ומשפט לדוגמה באנגלית עם תרגום":"עם הגדרות ומשפטים לדוגמה"}.</li>
    <li>אפשר לעבור על המילים ועל הכרטיסיות כמה שרוצים, ולגשת למבחן היומי כמה פעמים שרוצים.</li>
    <li>בכל מבחן יומי יש גם עד ${REVIEW_MAX} מילים לחזרה מימים קודמים.</li>
    <li>מילה שעונים עליה נכון בניסיון האחרון נכנסת לרשימת "יודע". מילה שלא ידעת עד סוף היום עוברת למבחן של מחר.</li>
    <li>בכל שבת, לפני המילים החדשות, יש מבחן שבועי של עד ${WEEKLY_SIZE} מילים מהשבוע שעבר. צריך 80% כדי להמשיך, ואפשר לנסות שוב עד שעוברים. אם לא נכנסת בשבת, המבחן יחכה לך בפעם הבאה.</li>
    <li>סבב חדש נפתח כל יום, וסבב שלא סיימת לא נערם.</li>
    <li>ההתקדמות נשמרת בטלפון הזה, לכל משתמש ולכל שפה בנפרד.</li>
  </ol>
  <div class="row"><button class="btn" data-a="howto-ok">${back?"חזרה לדף הבית":"הבנתי, בוא נתחיל"}</button></div>`;
}
function setup(first){
  const c=S.perDay,inProg=S.day&&S.day.stage!=="done";
  return `${first?topBar(`<button class="link" data-a="langs">החלפת שפה</button>`,LANG[L].title):topBar(homeLink)}
  <h1>כמה מילים ללמוד בכל יום?</h1>
  <p class="muted">${first?`ברשימה יש ${fmt(TOTAL)} מילים. אפשר לשנות את הבחירה בכל זמן מדף הבית.`:(inProg?"השינוי ייכנס לתוקף מהסבב הבא.":"השינוי ייכנס לתוקף מהסבב הבא.")}</p>
  <div class="choices">${OPTIONS.map(n=>`<button class="choice${n===c?" on":""}" data-a="per" data-n="${n}"><b>${n}</b><span>מילים ביום</span><small>כ-${Math.ceil((TOTAL-S.pos)/n)} ימים</small></button>`).join("")}</div>
  <div class="custom"><label for="perN">מספר אחר:</label><input id="perN" type="number" inputmode="numeric" min="1" max="100" value="${c&&!OPTIONS.includes(c)?c:""}" placeholder="למשל 12"><button class="btn" data-a="per-custom">לבחור</button></div>`;
}

function render(){
  if(!R.current||view==="welcome"){document.body.dataset.lang="";$app.innerHTML=welcome();return;}
  if(!L||view==="langs"){document.body.dataset.lang="";$app.innerHTML=langs();return;}
  autoFinalize();
  const st=S.day&&S.day.stage;
  if(["learn","daylist"].includes(view)&&!S.day)view="home";
  if(view==="quiz"&&st!=="test")view="home";
  if(view==="result"&&!(S.day&&S.day.attempts.some(a=>a.score)))view="home";
  if(view==="wquiz"&&!(S.weekly&&cur("weekly")&&!cur("weekly").score))view="home";
  if(view==="wresult"&&!(S.weekly&&cur("weekly")&&cur("weekly").score))view="home";
  if(view==="flash"&&!flash)view="home";
  if(!S.perDay&&view!=="settings"){$app.innerHTML=setup(true);return;}
  if(!S.seenHowto&&view!=="settings")view="howto";
  $app.innerHTML=({settings:()=>setup(false),howto,learn,daylist,quiz:()=>quiz("day"),result,wquiz:()=>quiz("weekly"),wresult,flash:flashView,words}[view]||home)();
}

function register(){
  const v=(document.getElementById("nameIn").value||"").trim();
  if(!v){nameErr="צריך לכתוב שם.";render();return;}
  if(R.profiles.some(p=>p.name===v)){nameErr="כבר יש משתמש בשם הזה. אפשר לבחור בו מהרשימה.";render();return;}
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:v};
  R.profiles.push(p);R.current=p.id;nameErr="";saveRoot();L=null;go("langs");
}
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  const a=b.dataset.a,d=S&&S.day;
  switch(a){
    case "register":register();break;
    case "profile":R.current=b.dataset.id;saveRoot();L=null;go("langs");break;
    case "switch-user":R.current=null;saveRoot();L=null;S=null;go("welcome");break;
    case "lang":loadLang(b.dataset.l);confirmReset=false;go("home");break;
    case "langs":L=null;S=null;go("langs");break;
    case "home":confirmReset=false;go("home");break;
    case "start":startDay();go("learn");break;
    case "learn":go("learn");break;
    case "resume":go("quiz");break;
    case "daylist":go("daylist");break;
    case "card":d.learnIdx=Number(b.dataset.k);save();go("learn");break;
    case "next":d.learnIdx=(d.learnIdx+1)%d.ids.length;save();render();break;
    case "prev":d.learnIdx=(d.learnIdx-1+d.ids.length)%d.ids.length;save();render();break;
    case "test":if(d&&d.stage!=="done"){startTest();go("quiz");}break;
    case "pick":answer(b.dataset.ctx,Number(b.dataset.id));break;
    case "nextq":nextQ(b.dataset.ctx);break;
    case "finish":if(d&&d.stage!=="done")finishDay();go("result");break;
    case "wstart":startWeeklyAttempt();go("wquiz");break;
    case "wresume":go("wquiz");break;
    case "flash":openFlash(b.dataset.deck);break;
    case "deck":flash={deck:b.dataset.deck,ids:deckIds(b.dataset.deck),i:0,flipped:false};render();break;
    case "flip":flash.flipped=!flash.flipped;render();break;
    case "fnext":if(flash.ids.length){flash.i=(flash.i+1)%flash.ids.length;flash.flipped=false;render();}break;
    case "fprev":if(flash.ids.length){flash.i=(flash.i-1+flash.ids.length)%flash.ids.length;flash.flipped=false;render();}break;
    case "fshuffle":shuffle(flash.ids);flash.i=0;flash.flipped=false;render();break;
    case "words":openWord=null;go("words");break;
    case "tab":wordsTab=b.dataset.t;openWord=null;render();break;
    case "wopen":{const id=Number(b.dataset.id);openWord=openWord===id?null:id;document.getElementById("wlist").innerHTML=wordItems();break;}
    case "settings":go("settings");break;
    case "howto":go("howto");break;
    case "howto-ok":if(!S.seenHowto){S.seenHowto=true;save();}go("home");break;
    case "per":case "per-custom":{
      const n=a==="per"?Number(b.dataset.n):Math.round(Number(document.getElementById("perN").value));
      if(!(n>=1&&n<=100)){document.getElementById("perN").focus();return;}
      S.perDay=n;save();go("home");break;}
    case "restart":{const keep={review:S.review,mastered:S.mastered,history:S.history,dayCount:S.dayCount,perDay:S.perDay,seenHowto:S.seenHowto,lastWeekly:S.lastWeekly};S=Object.assign(freshState(),keep);save();render();break;}
    case "reset":confirmReset=true;render();break;
    case "reset-no":confirmReset=false;render();break;
    case "reset-yes":confirmReset=false;S=freshState();save();go("home");break;
  }
});
$app.addEventListener("input",e=>{if(e.target.id==="wsearch"){openWord=null;document.getElementById("wlist").innerHTML=wordItems();}});
$app.addEventListener("keydown",e=>{if(e.target.id==="nameIn"&&e.key==="Enter")register();});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(view==="learn"){if(e.key==="ArrowLeft")document.querySelector('[data-a="next"]')?.click();if(e.key==="ArrowRight")document.querySelector('[data-a="prev"]')?.click();}
  if(view==="flash"){if(e.key==="ArrowLeft")document.querySelector('[data-a="fnext"]')?.click();if(e.key==="ArrowRight")document.querySelector('[data-a="fprev"]')?.click();if(e.key===" "){e.preventDefault();document.querySelector('[data-a="flip"]')?.click();}}
});
R=loadRoot();
view=R.current&&R.profiles.some(p=>p.id===R.current)?"langs":"welcome";
if(view==="welcome")R.current=null;
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
</html>
