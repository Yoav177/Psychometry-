<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פסיכומטרי">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>אוצר מילים לפסיכומטרי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#18212E; --muted:#5B6676; --line:#DCE1E8;
  --brand:#1F3A5F; --brand-ink:#FFFFFF; --hl:#FFE27A; --ok:#2E7D5B; --ok-bg:#E3F3EB;
  --bad:#B83A33; --bad-bg:#FBE6E4; --soft:#E8EDF4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111820; --surface:#1A232E; --ink:#E8EDF3; --muted:#9AA6B4; --line:#2C3746;
    --brand:#8FB3E0; --brand-ink:#0F1822; --hl:#7A6420; --ok:#6FCB9B; --ok-bg:#16332A;
    --bad:#F08A82; --bad-bg:#3A1E1D; --soft:#222D3A;
  }
}
:root[data-theme="dark"]{
  --bg:#111820; --surface:#1A232E; --ink:#E8EDF3; --muted:#9AA6B4; --line:#2C3746;
  --brand:#8FB3E0; --brand-ink:#0F1822; --hl:#7A6420; --ok:#6FCB9B; --ok-bg:#16332A;
  --bad:#F08A82; --bad-bg:#3A1E1D; --soft:#222D3A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-size:15px}
.top b{color:var(--ink);font-weight:700}
.link{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:600}
h1{font-family:"Frank Ruhl Libre","David","Times New Roman",serif;font-weight:700;font-size:34px;line-height:1.2;margin:8px 0 6px}
h2{font-size:20px;margin:28px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0 22px;color:var(--muted);font-size:15px}
.stats b{color:var(--ink);font-size:19px;margin-left:4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:18px;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px 22px;margin-top:6px}
.word{font-family:"Frank Ruhl Libre","David","Times New Roman",serif;font-weight:700;font-size:40px;line-height:1.35;margin:0 0 16px}
.word span{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 90%,transparent 90%);padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.defs{margin:0;padding:0 22px 0 0}
.defs li{margin:0 0 8px;font-size:19px}
.defs.single{list-style:none;padding:0}
.ex{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.ex h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 8px}
.ex p{font-size:17px;margin:0 0 8px}
.ex .note{font-size:15px;color:var(--muted)}
.dots{display:flex;gap:4px;margin:4px 0 14px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--soft)}
.dots i.on{background:var(--brand)}
.q-prompt{font-size:19px;margin:0 0 4px}
.q-kind{font-size:15px;color:var(--muted);margin:0 0 14px}
.q-word{font-family:"Frank Ruhl Libre","David","Times New Roman",serif;font-weight:700;font-size:34px;line-height:1.35;margin:2px 0 18px}
.q-def{font-size:20px;margin:2px 0 18px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 16px;font-size:18px;line-height:1.45}
.opt.w{font-family:"Frank Ruhl Libre","David","Times New Roman",serif;font-size:22px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;background:var(--soft)}
.fb strong{display:block;margin-bottom:4px}
.fb .mw{font-weight:700}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px;margin-bottom:10px}
.score{font-family:"Frank Ruhl Libre","David",serif;font-size:64px;font-weight:700;line-height:1;margin:14px 0 4px}
.miss{list-style:none;margin:0;padding:0}
.miss li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.miss .mw{font-family:"Frank Ruhl Libre","David",serif;font-weight:700;font-size:22px}
.foot{margin-top:40px;font-size:14px;color:var(--muted);text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.confirm{margin-top:10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.confirm button{text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--ink)}
.confirm .danger{color:var(--bad);border-color:var(--bad)}
@media (max-width:420px){.word{font-size:34px}h1{font-size:30px}.card{padding:22px 16px 18px}}
</style>
</head>
<body>
<main id="app" style="padding-top:max(20px,env(safe-area-inset-top))"></main>
<script>
const WORDS = [["אָבְנַיִים",["מתקן מסתובב להכנת כלי חרס"],["הקדר ישב מול האבניים ועיצב כד חרס גדול בידיו.","בחוג הקרמיקה למדנו לסובב את האבניים ברגל תוך כדי עיצוב החומר."]],["אוֹצֵר",["שומר על משהו יקר ערך","הממונה על המוצגים במוזיאון"],["אוצר המוזיאון בחר בקפידה את היצירות שיוצגו בתערוכה החדשה.","הוא שימש אוצר של אוסף המטבעות העתיקים ושמר עליו מכל משמר."]],["אָחוּ",["כר דשא, שדה מרעה"],["הפרות רעו בשלווה באחו הירוק שליד הנחל.","בבוקר אביבי שכבנו באחו והבטנו בעננים."]],["אִיחוּי",["חיבור חלקים, הכלבה"],["החייט השקיע שעות באיחוי הקרעים במעיל הישן.","הרופאה ביצעה איחוי של העצם השבורה בעזרת פלטת מתכת."]],["אִלוּלֵא",["אם לא, אלמלא, לולי, לולא"],["אלולא עזרתך, לא הייתי מצליח לסיים את העבודה בזמן.","אלולא הגשם, היינו יוצאים לטיול כמתוכנן."]],["אֲלוּמָּה",["חבילת שיבולים קצורות","גלים המשודרים בטווח צר, קרן (אלומת אור - קרן אור)"],["הקוצרים אספו את השיבולים ואגדו אותן לאלומות גדולות.","הפנס שלח אלומה צרה של אור אל קצה המערה."]],["אֲלוּמָּת אוֹר",["קרן אור"],["אלומת אור חדרה מבעד לתריס והאירה את החדר החשוך.","המגדלור שולח אלומת אור כדי לכוון את הספינות בלילה."]],["אָמוֹדַאי",["צוללן"],["האמודאים צללו אל קרקעית הים כדי לחלץ את הסירה שטבעה.","הוא עבר קורס אמודאים ועבד שנים בתיקון צנרת מתחת למים."]],["אָמִיר",["צמרת, הענפים העליונים בעץ"],["הציפור בנתה את הקן באמיר העץ, הרחק מהישג ידם של החתולים.","הרוח הניעה את אמירי הברושים הגבוהים."]],["אֲמַתְלָה",["תרוץ, סיבה לא אמיתית"],["הוא מצא אמתלה כדי לא להגיע לארוחה המשפחתית.","העייפות הייתה רק אמתלה, והאמת היא שהיא פשוט לא רצתה לבוא."]],["אָסָם",["מחסן תבואה"],["החקלאי אחסן את החיטה באסם לקראת החורף.","בשנות הבצורת עמדו האסמים כמעט ריקים."]],["אֶצְבָּעוֹן",["כיסוי המהווה הגנה לאצבע בשעת תפירה"],["סבתא שמה אצבעון על האצבע כדי לא להידקר מהמחט.","בלי אצבעון קשה לדחוף את המחט דרך בד עבה."]],["אֶקְרָן",["מסך, מִרְקע"],["הסרט הוקרן על אקרן ענק באמפיתיאטרון.","המרצה עמדה ליד האקרן והסבירה כל שקופית."]],["אָרִיג",["בד"],["הווילונות נתפרו מאריג כותנה עבה.","השוק היה מלא בדוכנים של אריגים צבעוניים."]],["אַרְכִיב / אַרְכִיּוֹן",["מקום אכסון למסמכים"],["החוקרת בילתה שבועות בארכיון המדינה בחיפוש אחר מסמכים ישנים.","כל תיקי העובדים הישנים הועברו לארכיב שבמרתף."]],["אֲרָעִי",["זמני"],["המשפחה גרה במבנה ארעי עד שבניית הבית החדש תסתיים.","זה פתרון ארעי בלבד, ובהמשך נצטרך למצוא פתרון קבוע."]],["אֶשְׁכּוֹל",["מספר פירות או פרחים המחוברים יחדיו לאותו הגבעול","מספר דברים קטנים המחוברים יחד, חבילה"],["קטפנו מהגפן אשכול ענבים בשל ומתוק.","אשכול של בלונים צבעוניים נקשר לשער הגן."]],["בֵּאוּר",["הסבר של נושא לא מובן או ההסבר עצמו, פרשנות"],["המורה הוסיף ביאור קצר למילים הקשות בשיר.","לפי הביאור המקובל, הפסוק מתאר את ימי הבצורת."]],["בְּגִלּוּפִין",["במצב של שכרות קלה, \"בראש טוב\""],["אחרי שלוש כוסות יין הוא כבר היה בגילופין והתחיל לשיר.","האורחים יצאו מהמסיבה בגילופין, צוחקים ומתבדחים."]],["בְּגַפּוֹ",["לבדו, ללא בן זוג"],["הוא הגיע לחתונה בגפו, בלי בת זוג.","אחרי הגירושים היא יצאה לטיול בהודו בגפה."]],["בּוּרְסְקִי / בּוּרְסְקַאי / בּוּרְסִי",["מעבד עורות"],["הבורסקי השרה את העורות בבורות מלאים חומרים חריפים.","בעבר גרו הבורסקאים מחוץ לעיר בגלל הריח החזק של העורות."]],["בּוֹשׁ",["התבייש"],["הילד בוש במעשיו והשפיל את מבטו.","הוא לא בוש להודות שטעה."]],["בּוֹשֵׁשׁ",["התמהמה בעשיית דבר מה (בושש לבוא - איחר, התעכב)"],["האוטובוס בושש לבוא, והנוסעים התחילו לאבד סבלנות.","התשובה מהאוניברסיטה בוששה להגיע, והיא כבר התחילה לדאוג."]],["בִּיּוּת",["אילוף, הפיכת דבר פראי לביתי","הנחיית פצצה או טיל אל עבר מטרה"],["ביות הכלב התרחש לפני אלפי שנים.","מערכת הביות של הטיל כיוונה אותו במדויק אל המטרה."]],["בֵּרָא",["כָּרַת, עקר עצים","כרת צמחיה, יצר קרחת יער"],["המתיישבים בֵּראו את החורש כדי לפנות שטח לשדות.","העובדים בֵּראו חלקה ביער כדי להקים בה חניון לילה."]],["בֵּית בַּד",["מקום בו מייצרים שמן מזיתים"],["בעונת המסיק מביאים את הזיתים לבית הבד שבכפר.","בבית הבד העתיק אפשר לראות את אבני הכתישה המקוריות."]],["בֵּית מַרְזֵחַ",["בר, פאב, מסבאה"],["המלחים בילו את הלילה בבית מרזח ליד הנמל.","ברחוב הישן נפתח בית מרזח קטן עם מוזיקה חיה."]],["בַּלָּן",["עובד בבית המרחץ"],["הבלן חימם את המים והכין מגבות לרוחצים.","בבית המרחץ הטורקי עבד בלן זקן שהכיר את כל הלקוחות."]],["בְּמַפְגִּיעַ",["בהתרסה, באופן בוטה","באופן נמרץ, באסרטיביות, בהחלטיות, בפסקנות"],["הנאשם סירב במפגיע לענות על שאלות התובע.","השרה הודיעה במפגיע שהתוכנית תצא לפועל בכל מקרה."]],["בַּעֲלִיל",["באופן ברור, ללא ספק"],["ההחלטה הזאת שגויה בעליל ותזיק לכולם.","היה ניכר בעליל שהוא לא התכונן למבחן."]],["בְּפוּמְבִּי / בְּפוּמְבֵּי",["באופן גלוי ולעיני כל"],["ראש העירייה התנצל בפומבי על הטעות.","הם הכריזו בפומבי על האירוסין שלהם."]],["בָּצִיר",["קטיף ענבים","הענבים עצמם"],["בסוף הקיץ כל המשפחה משתתפת בבציר בכרם.","הבציר של השנה היה מתוק במיוחד ויצא ממנו יין משובח."]],["בָּצַר",["קטף ענבים"],["הפועלים בצרו את הענבים מוקדם בבוקר, לפני החום.","בסוף אוגוסט הם בצרו את כל הכרם בתוך שבוע."]],["גָּדָה",["שפת הנהר, חוף","קצה כלי, שפת הכלי (מלא עד גדותיו - מלא עד הסוף, עלה על מידותיו)"],["ישבנו על גדת הירדן והבטנו במים הזורמים.","הכוס הייתה מלאה עד גדותיה, והמים נשפכו על השולחן."]],["גָהַר",["התכופף, השתופף"],["האם גהרה מעל העריסה ונשקה לתינוק.","הוא גהר מעל השולחן ובחן את המפה מקרוב."]],["גּוּר",["הִזָּהֵר"],["גור לך מן האיש הזה, הוא אינו אמין.","גורו מפני החולות הטובעניים, הזהיר המדריך את המטיילים."]],["גְזוּזְטְרָה",["מרפסת חיצונית (ללא גג)"],["הם שתו קפה בגזוזטרה הצופה אל הים.","בבניינים הישנים של העיר יש גזוזטראות רחבות ופתוחות."]],["גְּזִיר",["חתיכה שנגזרה ממשהו"],["היא שמרה גזיר עיתון עם הכתבה על סבה.","הילדים הדביקו גזירי נייר צבעוניים על הקיר."]],["גִּלְעֵן",["הוציא את גלעין הפרי"],["לפני שמכינים ריבה צריך לגלען את הדובדבנים.","הוא גלען את התמרים ומילא אותם באגוזים."]],["גַּרְגְרָן",["אכלן, זללן, להוט אחר אוכל"],["הכלב הגרגרן חיסל את כל האוכל שבקערה תוך דקה.","אל תהיה גרגרן, תשאיר גם לאחרים עוגה."]],["גַּת",["מקום המשמש לדריכת ענבים והכנת יין"],["בימי קדם דרכו את הענבים ברגליים בגת.","באתר הארכאולוגי נחשפה גת חצובה בסלע."]],["דָּגָה",["שם כולל לכל הדגים למיניהם"],["הדגה בכנרת הידלדלה בגלל דיג יתר.","הים התיכון עשיר בדגה מסוגים שונים."]],["דּוֹבֵב",["גרם למישהו אחר לדבר"],["השוטר ניסה לדובב את החשוד כדי שיודה.","הפסיכולוגית דובבה את הילד השתקן בעזרת משחק."]],["דִּידַקְטִי",["שקשור בתחום תורת ההוראה (דידקטיקה - תורת ההוראה)"],["הספר נכתב בסגנון דידקטי, עם תרגילים בסוף כל פרק.","המשחק הדידקטי עוזר לילדים ללמוד חשבון בדרך מהנה."]],["דִּרְבּוּן",["עידוד לפעולה מסוימת, המרצה"],["הציון הגבוה שימש לה דרבון להמשיך להשקיע.","העובדים זקוקים לדרבון מצד ההנהלה כדי לעמוד ביעדים."]],["הִבְלִיג",["ריסן את עצמו, התאפק","נמנע מלבטא רגש כלשהו"],["למרות העלבון, הוא הבליג ולא הגיב.","הממשלה החליטה להבליג ולא להגיב על ההתגרות."]],["הִגֵּר",["עבר מארץ אחת לאחרת והשתקע בה לפרק זמן ממושך"],["סבי הגר לישראל מפולין אחרי המלחמה.","משפחות רבות הגרו לקנדה בחיפוש אחר עבודה."]],["הֲדוֹם",["שרפרף נמוך, ספסל נמוך שהיושב מניח עליו את רגליו"],["הזקן ישב בכורסה והניח את רגליו על ההדום.","ליד כס המלך עמד הדום מרופד בקטיפה."]],["הֶדְיוֹט",["נטול ידיעות בתחום מסוים"],["בענייני משפט אני הדיוט גמור, ולכן פניתי לעורך דין.","גם הדיוט יכול להבין את ההסבר הפשוט הזה."]],["הִטְמִיעַ",["ספג, הפנים, גרם למשהו להפוך חלק בלתי נפרד ממשהו אחד","החדיר מערכת חדשה (למשל מערכת מחשב) לארגון כלשהו"],["התלמידים הטמיעו את החומר היטב אחרי החזרות הרבות.","החברה הטמיעה מערכת מחשוב חדשה בכל הסניפים."]],["הִיסָּה",["השתיק, השקיט, החריש"],["המורה היסתה את התלמידים שדיברו בזמן השיעור.","האם היסתה את הילד כדי שלא יעיר את התינוק."]],["הִכְבִּיר בְּמִילִים",["דבר רבות באריכות יתרה, האריך בדברים"],["הנואם הכביר במילים, והקהל התחיל להשתעמם.","אין צורך להכביר במילים, התוצאות מדברות בעד עצמן."]],["הִכְחִישׁ",["טען שמשהו אינו נכון, שלל"],["הדובר הכחיש את הדיווחים על פיטורים בחברה.","החשוד הכחיש כל קשר לפריצה."]],["הַס",["מילת ציווי הדורשת שקט"],["הס! אני שומע רעש מהחדר הסמוך.","כשהמנצח עלה לבמה, השתרר הס באולם."]],["הִסְכִּית",["שתק והקשיב בריכוז, האזין, הטה אוזן"],["התלמידים הסכיתו בדריכות לדברי המרצה.","הסכת ושמע, כי הדברים האלה חשובים מאוד."]],["הִסְלִים",["החריף, הקצין, הידרדר"],["המצב בגבול הסלים, והצבא תוגבר באזור.","הוויכוח הסלים לצעקות ולאיומים."]],["הִסְמִיךְ",["נתן לו סמכות, אישר לו לבצע משהו, ייפה את כוחו","קֵרֵב, גרם להם להיות סמוכים (קרובים / קשורים)","הפך משהו לפחות נוזלי"],["המנהל הסמיך את סגנו לחתום על החוזים בשמו.","מוסיפים מעט קמח לרוטב כדי להסמיך אותו."]],["הֶעֱלָה אֲרוּכָה",["הגליד (ארוכה = גלד, הרקמה הנוצרת תוך כדי תהליך הריפוי של הפצע)"],["הפצע בברך העלה ארוכה אחרי שבוע.","עם הזמן גם הפצעים שבלב מעלים ארוכה."]],["הִפְלִיא בּוֹ אֶת מַכּוֹתָיו",["הִכָּה אותו"],["הבריון הפליא את מכותיו בנער עד שהעוברים ושבים התערבו.","המתאגרף הפליא את מכותיו ביריב וניצח בנוקאאוט."]],["הִפְלִיג בְּ -",["הִרְבָּה, הפריז, הגזים, עשה משהו בשפע (הפליג בשבחו - שיבח אותו מאוד)"],["המנחה הפליג בשבחי הזוכה בתחרות.","הוא הפליג בתיאורים של הטיול עד שכולם השתעממו."]],["הִצְפִּין",["נע צפונה","העלים, החביא"],["השיירה הצפינה לכיוון הגליל.","הילד הצפין את הסוכריות מתחת לכרית."]],["הֵקִיץ",["התעורר משנתו, נֵעוֹר"],["הוא הקיץ משנתו לקול צלצול השעון.","רק כשהקיץ הבין שהכול היה חלום."]],["הִשְׁחִיז",["ליטש וחידד את הלהב"],["הקצב השחיז את הסכינים לפני תחילת העבודה.","צריך להשחיז את מספרי הגינה כדי שיחתכו היטב."]],["הִשְׁתָּאוּת",["פליאה"],["הילדים הביטו בהשתאות בזיקוקים שמילאו את השמיים.","התגלית המדעית עוררה השתאות בקרב החוקרים."]],["הִתְבַּשֵּׂר",["קיבל או שמע בשורה (בדרך כלל בשורה טובה)"],["המשפחה התבשרה על הולדת הנכדה הראשונה.","הסטודנטית התבשרה שהתקבלה ללימודי רפואה."]],["הִתְגּוֹדֵד",["התקהל, התאסף"],["המון רב התגודד מול בית המשפט.","ילדים התגודדו סביב מוכר הגלידה."]],["הִתְחַלָּה",["העמיד פני חולה, התחזה לחולה"],["התלמיד התחלה כדי להתחמק מהמבחן.","בכל פעם שהיה צריך לשטוף כלים, היא התחלתה פתאום."]],["הִתְחַסֵּד",["העמיד פני צדיק","נהג ברחמנות"],["הפוליטיקאי התחסד מול המצלמות, אך מאחורי הקלעים נהג אחרת.","הוא התחסד עם העניים וחילק להם אוכל בכל שבוע."]],["הִתִּיר",["שחרר (התיר את הקשר - פתח את הקשר)","אִפְשֵר, הסכים, אישר (מהמילה מותר)"],["המלח התיר את החבל שקשר את הסירה לרציף.","ההורים התירו לה לחזור הביתה אחרי חצות."]],["הִתְכַּתֵּשׁ",["נאבק"],["שני אוהדים התכתשו ביציע והוצאו מהמגרש.","חברי הכנסת התכתשו בוויכוח חריף במליאה."]],["הִתְמוֹגֵג",["התענג, נהנה, רווה נחת"],["הסבתא התמוגגה מנחת כשראתה את נכדיה.","הוא התמוגג מהמחמאות שקיבל על ההרצאה."]],["הִתַּמֵּר",["התרומם כלפי מעלה, התנשא"],["עמוד עשן התמר מעל היער הבוער.","המגדל החדש מתמר מעל כל בנייני העיר."]],["הִתְנַבֵּא",["השמיע ניבוי או חיזוי כלשהו"],["החזאי התנבא שהחורף יהיה גשום במיוחד.","הנביא התנבא על חורבן העיר."]],["הִתְנַכֵּר",["העמיד פנים כאילו אין לו קשר אליו, התעלם ממנו במכוון"],["אחרי שהתעשר, הוא התנכר לחבריו הוותיקים.","היא התנכרה אליו כאילו מעולם לא הכירה אותו."]],["הִתְנַצֵּחַ",["התווכח"],["שני המועמדים התנצחו בעימות הטלוויזיוני.","אין טעם להתנצח איתו, הוא אף פעם לא משנה את דעתו."]],["הִתְעַמֵּר",["התעלל, התאכזר"],["המפקד התעמר בחיילים והעניש אותם בלי סיבה.","ההורים התלוננו שהמאמן מתעמר בילדים."]],["הִתְעַרְטֵל",["פשט את בגדיו","חשף את רגשותיו הכמוסים"],["הוא התערטל ונכנס לים.","בספרה החדש הסופרת מתערטלת וחושפת את פחדיה העמוקים."]],["הִתְרָה",["הזהיר"],["המורה התרה בתלמיד שאם יאחר שוב, יישלח למנהל.","השופט התרה בקהל שלא להפריע לדיון."]],["הִתְרַצָּה",["נענה לבקשה לאחר שכנוע רב, הסכים"],["אחרי שעה של תחנונים, אבא התרצה וקנה לנו גלידה.","המנהל התרצה לבסוף ואישר לה יום חופש."]],["זַבָּן",["מוכר בחנות"],["הזבן בחנות הספרים המליץ לי על רומן חדש.","היא עבדה כזבנית בחנות בגדים בקניון."]],["זֶרֶד",["ענף"],["אספנו זרדים יבשים כדי להדליק מדורה.","הציפור נשאה זרד קטן במקורה אל הקן."]],["זָרָה מֶלַח עַל הַפְּצָעִים",["הוסיף על צערו, דרך לו על היבלות, נגע בעצב רגיש (זרה - פיזר)"],["כשהזכירו לו את ההפסד, זה רק זרה מלח על פצעיו.","אל תזרה מלח על הפצעים, הוא כבר מתבייש מספיק בכישלון."]],["חַס",["ריחם"],["המלך חס על חייו של האסיר ושחרר אותו.","הוא לא חס על כספו ותרם ביד רחבה."]],["חֲרִי (אַף)",["כעס, חֵמה, זעם"],["כשגילה את הגניבה, פרץ בחרי אף.","דבריה הבוטים עוררו חרי אף בקרב הנוכחים."]],["חָרִישׁ",["ביתור האדמה במחרשה כדי שתהיה נוחה לזריעה","העונה שחורשים ומפלחים בה את האדמה"],["החריש העמוק הכין את השדה לזריעה.","בעונת החריש החקלאים עובדים מבוקר עד ערב."]],["חֲרִישִׁי",["שָׁקֵט"],["היא דיברה בקול חרישי כדי לא להעיר את הילדים.","נשמע רק רחש חרישי של העלים ברוח."]],["חָרָךְ",["שרף קלות באש, צרב","חריץ או חור בקיר"],["האש חרכה את קצות שיערו.","הלוחמים הביטו החוצה מבעד לחרך שבקיר."]],["טָוָה",["חיבר, צירף","שָׁזַר, יצר חוטים מחומר גולמי"],["הסבתא טוותה חוטי צמר בפלך.","הסופר טווה עלילה מורכבת שמחברת בין שלושה דורות."]],["טְלַאי",["חתיכת בד שתופרים על בגד לצורך תיקון קרע"],["אמא תפרה טלאי על הברך הקרועה של המכנסיים.","הג׳ינס הישן שלו מלא טלאים צבעוניים."]],["טְרָשִׁים",["אדמה סלעית שקשה לעבד"],["קשה לגדל ירקות באדמת הטרשים של ההר.","המתיישבים הפכו את גבעות הטרשים לכרמים פורחים."]],["יָגֵעַ",["עייף מרוב עבודה, תשוש"],["אחרי יום עבודה ארוך בשדה, הוא חזר הביתה יגע.","הם הגיעו יגעים ורעבים לסוף המסלול."]],["יָד רוֹחֶצֶת יָד",["אחד עוזר לשני, שמור לי ואשמור לך (בדרך כלל בהקשר שלילי)"],["בעירייה שררה שחיתות של יד רוחצת יד בין הפקידים לקבלנים.","הם תומכים זה בזה בכל הצבעה, ויד רוחצת יד."]],["יְקִיצָה",["התעוררות משינה, חוסר שינה, ערנות"],["היקיצה המוקדמת לפני הטיסה הייתה קשה במיוחד.","הלילות של יקיצה ליד מיטת התינוק התישו אותה."]],["יַרְכָתַיִים",["החלק האחורי של הספינה"],["הקברניט עמד בירכתי הספינה והביט בחוף המתרחק.","המנוע של הסירה ממוקם בירכתיים."]],["כְּבַד לָשׁוֹן / פֶּה",["מגמגם, מתקשה בדיבור"],["משה רבנו תיאר את עצמו ככבד פה וכבד לשון.","למרות שהוא כבד לשון, הוא כותב נאומים מבריקים."]],["כִּיחֵד",["הסתיר, העלים, לא גילה את כל האמת, שיקר"],["הוא לא כיחד ממני דבר וסיפר את כל האמת.","העדה כיחדה מהחוקרים פרטים חשובים."]],["כִּילָּה",["סיים, גמר","רשת שפורשים מעל למיטה להגן על השוכבים בה מיתושים וזבובים","השמיד, חיסל"],["הם פרשו כילה מעל המיטה כדי להתגונן מפני היתושים.","השריפה כילתה את היער כולו."]],["כַּן / כַּנָּה",["בסיס שעליו מעמידים דבר כלשהו"],["הפסל הוצב על כן שיש במרכז הכיכר.","הצלם העמיד את המצלמה על כן יציב לצילום הלילה."]],["כְּסָיָה",["כפפה"],["בחורף היא לובשת כסיות צמר כדי שהידיים לא יקפאו.","המנתח עטה כסיות גומי לפני הניתוח."]],["כְּרַךְ",["עיר גדולה"],["הם עברו מהכפר השקט אל הכרך הסואן.","ניו יורק היא כרך ענק שאינו ישן לעולם."]],["לֵאוּת",["יגעות, עייפות, תשישות"],["למרות הלאות, הרצים המשיכו עד קו הסיום.","היא עבדה ללא לאות כדי לגייס כסף למטרה."]],["לְדִידוֹ",["מבחינתו, מצידו, לדעתו"],["לדידו, כל הוויכוח הזה מיותר.","לדידה של המנהלת, העיקר הוא שהתלמידים ירגישו בטוחים."]],["לַהַג",["פטפוט, ריבוי דברים בלא טעם"],["הנאום היה להג ריק, בלי שום רעיון חדש.","נמאס לי מהלהג של השכנים על כל דבר קטן."]],["לַהֲגָן",["פטפטן, שמדבר בלי סוף"],["השכן הלהגן לא נתן לי לצאת מהמעלית.","בשיעור הוא תמיד היה להגן, והמורה נאלצה להעיר לו."]],["לוּלֵא",["אִם לֹא"],["לולא התרומה הנדיבה, בית הספר היה נסגר.","לולא הזהירות של הנהג, התאונה הייתה חמורה בהרבה."]],["לִיבָּה",["החלק המרכזי והחשוב ביותר במשהו, גרעין","החלק הפנימי של הפרי בו מרוכזים הזרעים","הגדיל את הלהבה","הגביר, הסעיר"],["ליבת הבעיה היא חוסר תקציב.","הנואם ליבה את רגשות הקהל בדבריו הנלהבים."]],["לִיטֵּשׁ",["נתן מראה חלק או מבריק באמצעות שפשוף/החלקה","שיפר, עיבד, עשה \"פִינִיש\""],["הצורף ליטש את הטבעת עד שהבריקה.","העורכת ליטשה את הכתבה לפני שפורסמה."]],["לִמְגִינַּת לִבּוֹ",["לצערו, למורת רוחו"],["למגינת לבו, הקבוצה שלו הפסידה בגמר.","למגינת לבה, הטיסה בוטלה ברגע האחרון."]],["מַאֲכֶלֶת",["סכין לשחיטה, חַלָף"],["השוחט השחיז את המאכלת לפני העבודה.","בסיפור העקדה, אברהם לקח את המאכלת בידו."]],["מֵאֵן",["לא הסכים, התנגד, סרב"],["הוא מיאן לקבל את ההצעה, למרות השכר הגבוה.","הילדה מיאנה להיפרד מהכלב."]],["מְבוּסָם",["שיכור קלות, שתוי"],["אחרי הקידוש הוא היה קצת מבוסם.","האורחים המבוסמים רקדו עד הבוקר."]],["מַגָּל",["כלי עבודה לקצירת תבואה (עשוי מסכין בצורת חצי ירח)"],["הקוצר הניף את המגל וקצר את השיבולים.","בתמונה הישנה נראית איכרה אוחזת מגל בשדה החיטה."]],["מָהוּהַּ",["בלוי, מרופט, שחוק"],["הוא לבש מעיל מהוה שהיה שייך לאביו.","הספה המהוהה עמדה בפינת החדר מאז ילדותי."]],["מַזְמֵרָה",["כלי גינה המשמש לקיצוץ הענפים"],["הגנן גזם את השיחים במזמרה.","בעזרת מזמרה חדה חתכתי את הענפים היבשים."]],["מִכְמוֹרֶת",["רשת גדולה המשמשת בעיקר לדייג, מצודה (רשת דייגים)"],["הדייגים הטילו את המכמורת לים עם שחר.","ספינת הדיג משכה מכמורת מלאה בדגים."]],["מֵלִיץ יוֹשֶר",["סנגור, מי שטוען לזכותו של מישהו"],["המורה שימשה מליצת יושר של התלמיד מול ועדת המשמעת.","הוא ביקש מחברו לשמש לו מליץ יושר בפני המנהל."]],["מָסִיק",["קטיף זיתים, עונת קטיף הזיתים"],["בעונת המסיק כל הכפר יוצא למטעי הזיתים.","המסיק השנה היה מוצלח, והשמן יצא איכותי."]],["מִסְעָד",["תמיכה, משענת"],["הכיסא הנוח כולל מסעד לגב ולידיים.","המשפחה הייתה לו למסעד בתקופה הקשה."]],["מַפַּח נֶפֶשׁ",["אכזבה גדולה"],["ביטול ההופעה גרם מפח נפש לאלפי מעריצים.","אחרי כל ההשקעה, התוצאות הביאו למפח נפש."]],["מִצְנֶפֶת",["כובע בד, מגבעת"],["הכוהן חבש מצנפת לבנה על ראשו.","הזקנה יצאה לגינה חבושה מצנפת בד כדי להגן על ראשה מהשמש."]],["מִרְבָּץ",["רובד קרקע שמצויים בו מחצבים (מרבץ יהלומים - אזור בו יש יהלומים רבים לכרייה)"],["בדרום אפריקה התגלו מרבצים עשירים של זהב.","החברה קיבלה רישיון לכרות במרבץ הפוספטים בנגב."]],["מְשׁוּנָּן",["בעל שיניים או בעל צורה של שיניים"],["את הלחם פורסים בסכין משוננת.","לעלים של הצמח יש שוליים משוננים."]],["מְתַאֲבֵן",["מאכל המוגש בתחילת הארוחה על- מנת להגביר את התאבון"],["כמתאבן הוגשו זיתים, חומוס ולחם חם.","המלצר שאל אם נרצה מתאבן לפני המנה העיקרית."]],["נִגַף",["הובס, נוצח"],["הצבא נגף בקרב, והאויב כבש את העיר.","הקבוצה נגפה בפני היריבה בתוצאה משפילה."]],["נֶגֶף",["מחלה קשה המפילה חללים רבים","תקלה, מכשול (אֶבֶן נֶגֶף - מכשול)"],["בימי הביניים הפיל הנגף חללים רבים באירופה.","חוסר התקציב הוא אבן נגף בדרך להשלמת הפרויקט."]],["נָדָן",["נרתיק החרב"],["האביר שלף את החרב מן הנדן.","אחרי הקרב החזיר הלוחם את חרבו לנדנה."]],["נָהִיר",["ברור, מובן"],["ההסבר של המורה היה נהיר לכל התלמידים.","לא היה נהיר לי מדוע הוא עזב פתאום."]],["נֶהֶנְתָן",["רודף תענוגות"],["הוא נהנתן שחי מסעודה לסעודה ומטיול לטיול.","חברה נהנתנית מקדשת את ההנאה של הרגע."]],["נוֹטֵר",["שומר, מאבטח"],["הנוטר סייר לאורך הגדר של המושב.","בשכונה הוצבו נוטרים כדי לשמור על הביטחון בלילות."]],["נוֹטֵר טִינָה",["לא סולח, שומר כעס"],["הוא נוטר טינה לאחיו על ריב שהיה ביניהם לפני שנים.","היא לא נוטרת טינה וסולחת מהר."]],["נוּל",["מכונת אריגה"],["האורגת ישבה ליד הנול ויצרה שטיח צבעוני.","במפעל הטקסטיל עבדו מאות נולים."]],["נְחִיל",["להקת חרקים"],["נחיל דבורים התיישב על עץ בחצר.","נחילי ארבה חיסלו את היבול בשדות."]],["נֶחָמָה פּוּרְתָּא",["נחמה כלשהי, נחמה מועטה"],["הניצחון במשחק האחרון היה נחמה פורתא אחרי עונה מאכזבת.","המכתב החם שלו היה לה נחמה פורתא בימי האבל."]],["נַחְשׁוֹל",["גל גדול"],["נחשול ענק הטביע את סירת הדייגים.","הגלים הפכו לנחשולים, והמתרחצים נצטוו לצאת מהמים."]],["נִטְמַע",["נקלט והפך לחלק מקבוצה מסוימת, נבלע"],["המהגרים נטמעו בחברה המקומית בתוך דור אחד.","הטעם של התבלין נטמע היטב בתבשיל."]],["נִיחָא",["מילא, אין דבר"],["אם היה מאחר בחמש דקות, ניחא, אבל הוא איחר בשעה.","ניחא שהוא לא עזר, אבל למה היה צריך להפריע?"]],["נִחַם",["התחרט על מה שעשה, הצטער","התנחם"],["הוא ניחם על המילים הקשות שאמר לאמו.","רק כעבור שנים ניחם על אובדן ביתו."]],["נִיפָּה",["סינן, ניקה, ברר"],["האופה ניפה את הקמח לפני שהכין את הבצק.","הוועדה ניפתה את המועמדים והשאירה רק שלושה."]],["נִכּוּשׁ",["עקירת עשבים שוטים"],["בקיבוץ עבדנו בניכוש עשבים בשדות הכותנה.","צריך לעשות ניכוש לפני שהעשבים חונקים את השתילים."]],["נִכְלָם",["מבוייש, בוש (בּוֹשׁ וְנִכְלָם - הִתְבַּיֵּשׁ מאוד), כלימה = בושה"],["הילד עמד נכלם מול המורה אחרי שנתפס מעתיק.","הוא יצא מהאולם בוש ונכלם."]],["נֶעֱתַר",["הסכים, השיב בחיוב"],["השר נעתר לבקשת התושבים ובא לבקר בשכונה.","המורה נעתרה להפצרות ודחתה את המבחן."]],["נִפְעָם",["נרגש"],["הקהל עמד נפעם מול הנוף המרהיב.","הוא היה נפעם מעוצמת הביצוע של הזמרת."]],["נִקְוָוה",["זרם והצטבר במקום כלשהו"],["מי הגשמים נקוו בשקע שבחצר.","בחורף נקוו בשדה שלוליות גדולות."]],["נִרְגָּן",["רוטן ומתלונן כל עת"],["השכן הנרגן מתלונן על כל רעש קטן.","אל תהיה נרגן, היום הזה בכלל לא רע."]],["נִרְפֶּה",["עצלן, רשלן"],["המנהל פיטר את העובד הנרפה שלא סיים אף משימה.","אל תהיה נרפה, קום ותעשה משהו!"]],["סַוָּר",["סבל בנמל"],["הסוורים פרקו את הארגזים הכבדים מהאונייה.","בנמל יפו עבדו פעם סוורים רבים בנשיאת סחורות."]],["סוֹרֵר",["מרדן, סרבן, חסר משמעת"],["הנער הסורר סירב להישמע להוריו.","בכיתה היו כמה תלמידים סוררים שהפריעו לשיעור."]],["סַיָּס",["עובד המטפל בסוסים"],["הסייס הבריש את הסוס והכין אותו לרכיבה.","בחווה עבד סייס ותיק שהכיר כל סוס בשמו."]],["סִיקֵּל",["פינה אבנים, ניקה את השטח מאבנים"],["החלוצים סיקלו את השדה לפני שחרשו אותו.","הם סיקלו את השביל כדי שיהיה נוח ללכת בו."]],["סָנֵגוֹר",["עורך דין המגן על הנאשם"],["הסנגור ביקש מבית המשפט לזכות את הנאשם.","הנאשם לא יכול היה לממן עורך דין, ולכן מונה לו סנגור ציבורי."]],["סִתֵּת",["הקציע והחליק אבנים"],["האומן סיתת את האבנים שנועדו לחזית הבניין.","הם סיתתו את גושי השיש לצורת לבנים ישרות."]],["סַתָת",["מחליק ומהקצע אבנים, בעל מקצוע שמסתת אבנים"],["הסתת הזקן עבד על אבני המקדש במשך שנים.","הזמינו סתת מומחה כדי לשקם את הבית העתיק."]],["עִילֵג",["מדבר בצורה לא ברורה, כבד דיבור"],["הוא דיבר עברית עילגת, מלאה בשיבושים.","המכתב נכתב בסגנון עילג ומלא שגיאות."]],["עַלְוָוה",["כלל העלים המכסים את העץ"],["העלווה הירוקה של העץ הסתירה את הקן.","בסתיו העלווה מאדימה ונושרת."]],["עָמַד מִנֶּגֶד / מִן הַצַּד",["לא התערב"],["השכנים עמדו מנגד כשהילד הותקף ולא עשו דבר.","המדינה לא יכולה לעמוד מן הצד מול המשבר ההומניטרי."]],["עָרֵב",["מי שמתחייב לפרוע חוב של אחר והיה והאחר לא יעמוד בהתחייבויותיו","נעים לשמיעה (נאמר גם על אוכל: ערב לחך - טעים)"],["האב חתם כערב להלוואה שבנו לקח מהבנק.","קולה הערב של הזמרת מילא את האולם."]],["פִּיר",["חוֹר, בוֹר (פיר המעלית - ה\"שרוול\" בו עוברת המעלית)"],["העובדים ירדו בפיר אל מעמקי המכרה.","המעלית נתקעה באמצע הפיר."]],["פָּלָה",["הוציא כינים (מהשיער, מהפרווה וכדומה)"],["הקופה ישבה על הענף ופלתה את גורה.","האם פלתה את שיערה של הילדה אחרי שחזרה מהגן עם כינים."]],["פָּמַלְיָה",["בני- לוויה"],["השר הגיע לטקס בלוויית פמליה גדולה.","המלכה ופמלייתה עברו ברחובות העיר."]],["פֶּרֶא",["חמור הבר","חסר תרבות"],["במכתש ראינו להקה של פראים רועה בין הסלעים.","הוא התנהג כמו פרא אדם ודחף את כולם בתור."]],["צִדֵד",["הפנה דבר מה הצידה, הִטה","הביט מן הצד, הביט מזווית בעין","תמך ב-, דגל ב-"],["הוא צידד בהצעה להאריך את שנת הלימודים.","היא צידדה את מבטה אל הדלת כשנשמעה נקישה."]],["קוֹרֶט / קַרְטוֹב",["מעט, כמות קטנה"],["הוסיפו קורט מלח לבצק.","אין בדבריו אף קורטוב של אמת."]],["קוּשִיָה",["שאלה, בעיה, חידה"],["התלמיד העלה קושיה שהמורה לא הצליח ליישב.","התיאוריה החדשה מעוררת כמה קושיות קשות."]],["קוֹשֵׁשׁ",["אסף עצים או קש למדורה"],["הילדים קוששו עצים יבשים למדורת ל״ג בעומר.","הוא יצא לקושש זרדים כדי לחמם את הבקתה."]],["קִיטוֹן",["חדר קטן, חדר שינה"],["הם גרו בקיטון צר בקומה העליונה.","המשרתת ישנה בקיטון קטן ליד המטבח."]],["קָמַל",["נבל (להיפך: לבלב)"],["הפרחים שבאגרטל קמלו אחרי כמה ימים בלי מים.","התקווה שלו קמלה עם כל מכתב דחייה."]],["קְרִיסָה",["התמוטטות, הרס"],["רעידת האדמה גרמה לקריסת בניינים רבים.","החברה נמצאת על סף קריסה כלכלית."]],["קְרִישָׁה",["התעבות של נוזל והפיכתו לסמיך וקרוש"],["המחלה פוגעת ביכולת הקרישה של הדם.","כשהמרק מתקרר מתחילה קרישה של השומן שבו."]],["קָשַׁר (לוֹ) כְּתָרִים",["שיבח אותו מאוד"],["המבקרים קשרו כתרים לסרט החדש.","בנאום הפרידה קשר המנהל כתרים לעובדת הוותיקה."]],["קַת",["החלק האחורי של הנשק שבא במגע עם הכתף, ידית"],["החייל הצמיד את קת הרובה לכתפו.","קת הסכין הייתה עשויה עץ זית."]],["רָדָה",["אסף דבש מהכוורת","שלט ביד רמה, משל"],["הכוורן רדה את הדבש מהכוורות.","העריץ רדה בעמו ביד קשה."]],["רָוָוה",["שתה עד שלא הרגיש צמא יותר"],["אחרי ההליכה במדבר הם רוו מים מהמעיין.","הגמלים שתו מהבאר עד שרוו."]],["רָקִיק",["מאפה שטוח ודק, עוגיה שטוחה"],["לארוחת הבוקר אכלנו רקיקים עם דבש.","רקיקי השוקולד הדקים נמסו בפה."]],["רֶשֶף",["הבזק אש, גחלת, ניצוץ"],["רשפי אש עפו מהמדורה אל השמיים.","רשף מהכבשן הצית את הנסורת שעל הרצפה."]],["רָשַׁף",["התיז רשפים או ניצוצות. בהשאלה: כעס, נמלא חימה ותוכחה"],["עיניו רשפו זעם כשגילה את הבגידה.","הברזל הלוהט רשף ניצוצות תחת הפטיש."]],["שָׁאוֹן",["קול, המולה, רעש"],["שאון המכוניות ברחוב הראשי לא נתן לנו לישון.","הבדיחה שלו נבלעה בשאון הקהל שהריע לשחקנים."]],["שְׁאַט נֶפֶשׁ",["תחושת סלידה (שאט - בוז)"],["הוא הביט בשאט נפש בזבל שהושלך ליד הבית.","הציבור הגיב בשאט נפש לדיווחים על ההתעללות בבעלי החיים."]],["שׁוֹקֵק (חַיִּים)",["מלא אנשים, פעילות מרובה"],["השוק שוקק חיים בבוקר יום שישי.","לקראת החג שקק הרחוב אנשים שמיהרו לקניות."]],["שִׁיסָה",["גרם למישהו לתקוף אחר, הסית"],["הוא שיסה את הכלב בפורץ.","המנהיג שיסה את ההמון במפגינים מהצד השני."]],["שָׁכִיחַ",["נפוץ, מצוי (להיפך: נדיר)"],["שם המשפחה כהן שכיח מאוד בישראל.","תאונות מהסוג הזה אינן שכיחות, אבל הן קורות."]],["שָׁכַך",["נרגע, שקט, דמם"],["הסערה שככה לקראת הבוקר.","כעסו שכך אחרי ששמע את ההסבר."]],["שָׁלָה",["הוציא מתוך נוזל"],["הדייג שלה מהמים דג גדול.","היא שלתה את הביצים מהסיר הרותח בכף."]],["שַׁמַּאי",["מי שתפקידו להעריך את שווי הנכס"],["חברת הביטוח שלחה שמאי להעריך את הנזק לרכב.","לפני מכירת הדירה הזמינו שמאי שיקבע את שוויה."]],["תֶּלֶם",["החריץ שנוצר בעת חרישת האדמה"],["המחרשה השאירה תלמים ישרים בשדה.","הזרעים נזרעו לאורך התלמים."]],["אֶדֶן",["המדף בתחתית החלון"],["החתול ישן על אדן החלון בשמש.","היא הניחה את העוגה על אדן החלון כדי שתתקרר."]],["אֲדָנִית",["עציץ מוארך המונח בדרך- כלל על אדן החלון"],["בכל חלון בבית עמדה אדנית עם פרחים אדומים.","שתלנו תבלינים באדנית שבמרפסת."]],["אִסְפְּלָנִית",["תחבושת, פלסטר, אגד מדבק"],["האחות הדביקה אספלנית על החתך בברך.","תמיד כדאי לשאת אספלניות בתיק כשיוצאים לטיול."]],["אֵפוֹא",["אם כך, ובכן"],["מה אפוא עלינו לעשות עכשיו?","לא הגעת לאסיפה, ולכן אינך יכול אפוא להצביע."]],["אֶצְעָדָה",["צמיד לרגל או ליד"],["הרקדנית ענדה אצעדת כסף על הקרסול.","בקבר העתיק נמצאו אצעדות ברונזה."]],["אֲרוּכָה",["גֶּלֶד, שכבת הבשר הבריא העולה על פצע מבריא (העלה ארוכה, הגליד)"],["הרופא אמר שהפצע יעלה ארוכה בתוך כמה ימים.","ארוכה דקה כבר כיסתה את השריטה."]],["אֶרֶך אַפַּיִים",["אדם סבלני שאינו ממהר לכעוס"],["המורה, שהייתה ארכת אפיים, הסבירה את החומר שוב ושוב.","צריך להיות ארך אפיים כדי לעבוד עם ילדים קטנים."]],["אֵרַע",["קרה"],["התאונה ארעה בצומת בשעות הבוקר.","איש לא ידע בדיוק מה ארע באותו לילה."]],["אַשְׁפָּה",["נרתיק לחיצים"],["הצייד שלף חץ מן האשפה ודרך את הקשת.","הקשת נשא על גבו אשפה מלאה חיצים."]],["בְּדִימוֹס",["שהשתחרר או פרש מעבודתו או תפקידו"],["השופט בדימוס כתב ספר על פרשות מפורסמות.","ניצב בדימוס מונה לתפקיד מנהל החברה."]],["בּוֹסֶר",["פרי לא בשל","דבר שעדיין אינו בשל, אינו מוכן"],["אל תאכל את השזיפים עכשיו, הם עדיין בוסר.","התוכנית הזאת עדיין בוסר ואינה מוכנה להצגה."]],["בּוֹצֵר",["מי שעובד בבציר (קטיף ענבים)"],["הבוצרים עבדו בכרם מהזריחה ועד הצהריים.","בעונת הבציר מגיעים לכרם בוצרים מכל האזור."]],["בִּיוֹגְרַפְיָה",["תאור תולדותיו של אדם מסוים"],["הוא קרא את הביוגרפיה של ראש הממשלה הראשון.","בקטלוג התערוכה מופיעה ביוגרפיה קצרה של האמן."]],["בַּלָאט",["בשקט, בחשאי","בסתר, בחדרי חדרים, בהחבא"],["הוא נכנס לחדר בלאט כדי לא להעיר את אשתו.","השניים תכננו בלאט את מסיבת ההפתעה."]],["בְּעֶטְיוֹ",["בעצתו (הרעה), בשל מזימתו, באשמתו, (עטי = עצה רעה)"],["בעטיו של החשמלאי הרשלן פרצה שריפה בבניין.","הקבוצה הפסידה בעטיו של השוער שהחמיץ כדור קל."]],["בְּרֹאשׁ חוּצוֹת",["בפומבי, בפרהסיה"],["הם לא התביישו להכריז על כך בראש חוצות.","סודות המשפחה נחשפו בראש חוצות."]],["בָּרִי",["ברור, ודאי, ידוע"],["ברי לי שהוא יצליח במבחן.","לא ברי אם הטיסה תמריא בזמן."]],["בְּרֵישׁ גְּלֵי",["לעיני כל"],["הוא הודה בריש גלי שהעתיק במבחן.","השר הצהיר בריש גלי שלא יתמוך בחוק."]],["בַּר-מִינָן",["מת, מנוח"],["סבי, בר המינן, נהג לספר לנו סיפורים על ילדותו.","הסופר בר המינן השאיר אחריו כתבי יד שלא פורסמו."]],["בָּרַר",["בחר את מה שמתאים ביותר, סינן"],["היא בררה בשוק את העגבניות הטובות ביותר.","צריך לברור את העדשים לפני הבישול ולהוציא מהן את האבנים."]],["גָּדַשׁ",["מִילא עד אפס מקום"],["הוא גדש את הצלחת באוכל.","המעריצים גדשו את האצטדיון עד אפס מקום."]],["גָּדַש אֶת הַסְּאָה",["הגזים, הפריז, עבר את הגבול (סאה - מידת נפח עתיקה)"],["הוא איחר כבר עשר פעמים, והפעם גדש את הסאה.","כשהמחירים עלו שוב, הרגישו התושבים שהממשלה גדשה את הסאה."]],["גֵּז",["צמר שנגזז מהצאן","פעולת הגזיזה של הצמר"],["החוואי מכר את גז הכבשים למפעל אריגה.","עונת הגז מתחילה באביב, לפני החום הגדול."]],["גָּז",["נעלם, נמוג, חלף"],["החלום על עבודה בחו״ל גז כשהחברה נסגרה.","שנות נעוריו גזו במהירות."]],["גְּזֵרָה",["פקודה או חוק של איסור כלשהו, פסק דין, תקנה, הוראה"],["הגזירות החדשות של השלטון עוררו זעם בציבור.","הקיצוץ בתקציב הבריאות נחשב בעיני רבים לגזרה קשה."]],["גַּיְא",["שקע צר בין הרים"],["הדרך ירדה אל הגיא העמוק שבין ההרים.","בגיא הצר זרם נחל קטן."]],["גִּיל / גִּילָה",["שמחה, ששון, אושר"],["הקהל פרץ בקריאות גיל כשהקבוצה הבקיעה.","הבשורה על הולדת התינוקת מילאה את כולם גילה."]],["גַּלְעִין",["גרעין הפרי, ליבה, חרצן"],["הוא ירק את גלעין הזית לצלחת.","באבוקדו יש גלעין גדול במרכז."]],["גְּמִילָה",["הבשלת הפרי","השתחררות מהרגל מזיק"],["הוא נכנס לתוכנית גמילה כדי להפסיק לעשן.","הפירות הגיעו לשלב הגמילה והם כמעט מוכנים לקטיף."]],["גַּנְזַך",["ארכיב, ארכיון, מקום לאכסון מסמכים (לרוב ממשלתי)"],["המסמכים הסודיים נשמרו בגנזך המדינה במשך עשרות שנים.","החוקר קיבל אישור לעיין בתיקים שבגנזך."]],["גַּפַּיִם",["שם כולל לרגלים והידיים של בני אדם ובעלי חיים"],["החתול מתח את גפיו אחרי שנת הצהריים.","הילד רעד בכל גפיו מקור."]],["גָּרַע",["החסיר"],["המורה גרעה נקודה על כל שגיאת כתיב.","העדכון לתוכנה לא גרע דבר מהמהירות שלה."]],["דָּלָה",["שאב, הוציא מהמים (דָּלָה פנינים). בהשאלה: הוציא משהו לאחר חיפוש (לדלות מידע)"],["הם דלו מים מהבאר בעזרת דלי.","העיתונאי דלה מידע חשוב מתוך המסמכים."]],["דָלַק",["רדף (אחרי מישהו)","בער"],["השוטרים דלקו אחרי הגנב ברחובות העיר.","האש דלקה בתנור כל הלילה."]],["דָּרוּך",["מוכן לפעולה, ערני, קשוב","מתוח, משוך"],["הקהל ישב דרוך וחיכה לתוצאות.","הקשת הייתה דרוכה, והחץ כוון אל המטרה."]],["הֶאֱמִיר",["עלה, התייקר"],["מחירי הדירות האמירו בשנה האחרונה.","מניית החברה האמירה אחרי פרסום הדוח."]],["הִבְלִיח",["הבהב באור חלש ובלתי יציב, נצנץ"],["אור חלש הבליח מבעד לחלון הבקתה.","בעיניה הבליח ניצוץ של תקווה."]],["הִגְדִּישׁ אֶת הַסְּאָה",["הגזים, הפריז, עבר את הגבול (סאה - מידת נפח עתיקה)"],["הוא תמיד מאחר, אבל היום הגדיש את הסאה והגיע אחרי שעתיים.","העיתונאי הגדיש את הסאה כשפרסם פרטים אישיים על המשפחה."]],["הֵגִיף",["סגר, נעל, הבריח"],["השומר הגיף את השער עם רדת החשכה.","לפני הסערה הגפנו את התריסים."]],["הִדְבִּיר",["ריסס נגד מזיקים"],["הזמנו מדביר כדי להדביר את הג׳וקים במטבח.","העירייה הדבירה את היתושים ליד הבריכה."]],["הִדִּיר רַגְלָיו",["נמנע מלבקר, הגיע לעתים רחוקות"],["אחרי הריב, הוא הדיר את רגליו מבית אחיו.","מאז שהמחירים עלו, אנשים מדירים את רגליהם מהמסעדה."]],["הִדִּיר שֵׁינָה מֵעֵינָיו",["גרם לדאגה","לא נרדם"],["החוב הגדול הדיר שינה מעיניו.","הדאגה לבנה החייל הדירה שינה מעיניה."]],["הֵהִין",["העז"],["איש לא ההין לומר למנהל שהוא טועה.","הנער ההין לטפס על הצוק הגבוה."]],["הוֹכִיחַ",["הראה ראיות לנכונותו ואמיתותו של דבר מה, אימת, נזף","הטיף לו מוסר"],["עורך הדין הוכיח שהנאשם היה בחו״ל בזמן הפשע.","האב הוכיח את בנו על התנהגותו הגסה."]],["הוֹקִיר רַגְלָיו",["נמנע מלבקר, הגיע לעתים רחוקות"],["מאז שעבר לעיר אחרת, הוא מוקיר את רגליו מאיתנו.","אחרי הריב, החברים הוותיקים הוקירו את רגליהם מביתו."]],["הִזְדַּכְּכוּת",["הפיכה לנקי וצלול, התנקות","השתחררות מחטאים או רגשות שליליים, זיכוך הנפש"],["המים עוברים הזדככות בשכבות החול.","הטיול הארוך במדבר היה עבורו חוויה של הזדככות."]],["הִטְלִיא",["תיקן קרע בבגד על ידי טלאי"],["סבתא הטליאה את המכנסיים הקרועים.","הוא הטליא את השק כדי שהחיטה לא תישפך."]],["הִכְמִין",["הניח במקום מסתור, החביא, הסתיר"],["השודדים הכמינו את השלל במערה.","ההורים הכמינו את המתנות בארון עד יום ההולדת."]],["הָלַם",["הכה, הקיש, דפק"],["הנפח הלם בפטיש על הברזל.","הגשם הלם בחלונות כל הלילה."]],["הֵפִיס דַעֲתוֹ",["ריצה או הרגיע אותו, השכין שלום"],["הוא ניסה להפיס את דעתה בזר פרחים.","רק התנצלות פומבית תפיס את דעת העובדים."]],["הִשְׁכִּין",["נתן מקום מגורים, יישב, אִכלס","השליט, השרה (אווירה, שלום וכו')"],["המדינה השכינה את העולים בשכונות חדשות.","המתווך הצליח להשכין שלום בין שני הצדדים."]],["הִשְׁתּוֹקֵק",["רצה מאוד"],["הילד השתוקק לקבל אופניים ליום ההולדת.","אחרי שבוע במדבר השתוקקנו למקלחת חמה."]],["הִתְחַבֵּט",["התלבט"],["הוא התחבט אם לקבל את הצעת העבודה.","הוועדה התחבטה בשאלה במשך חודשים."]],["הִתְמַקֵּחַ",["ניהל משא ומתן על מחירו של דבר או על תנאים בעסקה, בחוזה וכדומה"],["בשוק כדאי להתמקח על המחיר.","הם התמקחו שעות על תנאי החוזה."]],["הִתְפַּעֵם",["התרגש מרוב פליאה, החסיר פעימה, התרשם"],["המבקרים התפעמו מיופיו של המקדש.","הוא התפעם כששמע את הילדה מנגנת בפסנתר."]],["הִתְקַהֵל",["התאסף, התקבץ לקהל"],["תושבים רבים התקהלו בכיכר כדי למחות.","סקרנים התקהלו סביב זירת התאונה."]],["זְמוֹרָה",["ענף, זרד"],["הוא גזם את הזמורות היבשות מהגפן.","הציפור ישבה על זמורה ושרה."]],["זָמַר",["קצץ ענפים (מַזְמֵרָה - מספרים מיוחדים לקיצוץ ענפים, זְמוֹרָה - ענף של גפן)"],["הכורם זמר את הגפנים בסוף החורף.","בחודש שבט זומרים את עצי הפרי."]],["חַבּוּט",["מועב, שחבטו בו. בהשאלה: נדוש, נושא שדנו בו רבות, חסר חידוש","מוכה, נחבט"],["הנושא הזה חבוט כל כך, שאין מה לחדש בו.","הארגז החבוט הגיע עם שקעים בכל צדדיו."]],["חִלְחוּל",["הסתננות","חדירה של מים וירידתם למעמקים"],["חלחול מי הגשם מעשיר את מי התהום.","חלחול הרעיונות החדשים לחברה לקח שנים."]],["חמשיר",["שיר היתולי, עוקצני וקצר המורכב מחמש שורות (חמש ושיר)"],["הוא כתב חמשיר מצחיק על המורה למתמטיקה.","בחוג לכתיבה התבקשנו לחבר חמשיר על חיית מחמד."]],["חָרִיט",["ארנק"],["הגנב חטף את החריט מידי הזקנה.","היא הוציאה מהחריט כמה מטבעות ושילמה."]],["חָרַץ לָשׁוֹן",["התחצף, חירף וגידף, השמיע דברים קשים (גם הוציא לשון)"],["התלמיד חרץ לשון כלפי המורה והוזמן לשיחה עם המנהל.","הילד הקטן חרץ לשון לאחותו וברח."]],["חָתָה",["גרף, אסף והעביר (לרוב גחלים) (מַחְתָּה - כלי לטיפול בגחלים)"],["הוא חתה את הגחלים מהאח אל תוך הדלי.","הטבח חתה את הגחלים כדי לחזק את האש."]],["טָבַע",["חקק צורה כלשהי בתוך חומר","יצר מטבע"],["האומן טבע את סמל העיר על הכד.","בעת העתיקה טבעו מטבעות כסף עם דיוקן המלך."]],["יָרַד לְסוֹף דַעְתּוֹ",["הבין את כוונתו בדיוק"],["רק אחרי שיחה ארוכה ירדתי לסוף דעתו.","קשה לרדת לסוף דעתה של הסופרת, שכותבת ברמזים."]],["יֵשׁ בְּלִבּוֹ עָלָיו",["לא סלח"],["יש בלבו על חברו שלא הזמין אותו לחתונה.","עדיין יש בלבה עליו בגלל המילים הקשות שאמר."]],["כַּבִּיר",["גדול, עצום, רב, אדיר"],["המדען השקיע מאמץ כביר במחקר.","הסכר נבנה בהשקעה כספית כבירה."]],["כֶּבֶשׁ",["מישור משופע (משמש לחיבור בין מקומות בעלי גבהים שונים, כבש המטוס, כבש הספינה וכד')"],["הנוסעים ירדו מהמטוס בכבש.","בנו כבש לכיסאות גלגלים בכניסה לבניין."]],["כָּבַשׁ",["הקסים","סלל דרך","לחיצה, דחיסה, הידוק","התאפק, הבליג","שמר מזון"],["הזמרת כבשה את הקהל בקולה.","סבתא כבשה מלפפונים בצנצנות."]],["כִּבְשָׁן",["תנור להתכת מתכות וחימום חומרים שונים, כּוּר"],["הברזל הותך בכבשן בחום עצום.","הקדר הכניס את הכדים לכבשן לשריפה."]],["כַּחַש",["שֶקֶר, כַּזָב"],["דבריו התגלו ככחש.","הם סבבו אותו בכחש והוציאו ממנו את כספו."]],["כִּיבֵּד",["טאטא, ניקה"],["היא כיבדה את הבית לפני בוא האורחים.","אחרי המסיבה כיבדנו את הרצפה ושטפנו כלים."]],["כֵּרָה",["סעודה, משתה, ארוחה חגיגית"],["המלך ערך כרה גדולה לכבוד נישואי בנו.","אחרי הניצחון נערכה כרה לכל הלוחמים."]],["כָּרַה",["הוציא מחצבים מהקרקע, חפר, חצב"],["הפועלים כרו פחם במכרה העמוק.","הם כרו בור גדול כדי להטמין בו את הצינור."]],["כִּתְמוֹל שִׁלְשוֹם",["כמו תמיד, כמו שהיה עד עכשיו, כרגיל"],["למחרת הסערה, החיים בכפר חזרו להתנהל כתמול שלשום.","הוא המשיך לעבוד כתמול שלשום, כאילו לא קרה דבר."]],["לֹא שְׁזָפַתּוּ עַיִן",["לא נראה על ידי איש, היה חבוי ומוסתר מעיני כול"],["במרתף נמצאו מסמכים שלא שזפתם עין מאז המלחמה.","באי הנידח יש מפרצים שעוד לא שזפתם עין."]],["לִבֵּן",["בירר סוגיה לעומק, דן בפרטים עד שהבין והגיע למסקנה / לפתרון","חמם מתכת באש חזקה (עד שצבעה הפך לבן)","הלהטת מתכת עד שצבעה נהיה ללבן","ברר סוגיה מסוימת כדי להגיע לפתרון או למסקנה"],["הוועדה ליבנה את כל הפרטים לפני שקיבלה החלטה.","הנפח ליבן את הברזל באש עד שהלבין."]],["לַהַק",["קבוצת מטוסים","קבוצה של בעלי חיים, להקה"],["להק מטוסים חלף מעל העיר ביום העצמאות.","להק ציפורים נודדות נחת באגם."]],["לָקוֹנִי",["קצר, תמציתי, ענייני"],["הוא ענה בתשובה לקונית: כן.","ההודעה הלקונית של החברה לא הסבירה דבר."]],["מִאוּס",["דוחה, מגעיל, בזוי"],["השקר שלו היה מאוס בעיני כולם.","ריח מאוס עלה מפח האשפה."]],["מוּמָר",["מי שהמיר את דתו"],["בימי האינקוויזיציה נאלצו יהודים רבים להפוך למומרים.","הקהילה החרימה את המומר שעזב את דתו."]],["מוּסַר כְּלָיוֹת",["רגשי אשם, חרטה"],["אחרי שצעק על אמו, הוא חש מוסר כליות.","הגנב החזיר את הארנק מתוך מוסר כליות."]],["מחה",["השמיד, השכיח, מחק"],["האויב מחה את הכפר מעל פני האדמה.","הזמן מחה את זכר המאורע מלב האנשים."]],["מָחָה",["התנגד, הביע מחאה","ניגב (מחה דמעה)"],["העובדים מחו נגד הפיטורים.","היא מחתה דמעה מעינה."]],["מֶחֱוָה",["תנועה סמלית עם אחד מאיברי הגוף","מעשה בלתי מחייב שנועד להראות על רצון טוב וידידות"],["השופט עשה מחווה בידו לסימן שאפשר להתחיל.","הפרחים ששלחה היו מחווה של רצון טוב."]],["מְטֻלָּא",["מתוקן בטלאי, שניתן עליו טלאי במקום הקרע"],["הילד לבש מכנסיים מטולאים.","הוא ישן מתחת לשמיכה מטולאת."]],["מִכְמוֹנֶת",["מלכודת, פח יקוש"],["הכוח נפל למכמונת שהכין האויב.","השאלה הייתה מכמונת שנועדה להכשיל את המועמד."]],["מִכְמָן",["מטמון, אוצר"],["הם חיפשו את מכמן הזהב של הפיראטים.","הספרייה הישנה היא מכמן של ידע."]],["מִכְמַנִּים",["סודות"],["הסופרת חשפה את מכמני הלב האנושי.","רק ותיקי הכפר מכירים את מכמני המערות."]],["מְפוֹרָז",["שאין בו כוחות צבאיים"],["האזור המפורז בין שתי המדינות נשמר בידי כוח בינלאומי.","לפי ההסכם, השטח שליד הגבול יישאר מפורז."]],["מְצוּעֲצָע",["מקושט ומעוטר בחוסר טעם ובצורה מוגזמת, קיטש"],["הסלון היה מצועצע בפסלונים ובתחרה.","ההזמנה המצועצעת לחתונה נראתה זולה."]],["מֵצֵר",["מצטער על משהו"],["אני מצר על כך שלא יכולתי להגיע לחתונה.","הוא אמר לה שהוא מצר מאוד על אובדנה."]],["מְרוּבָּב",["מוכתם, מלוכלך"],["החולצה הלבנה שלו הייתה מרובבת בכתמי שמן.","הרצפה המרובבת בבוץ דרשה שטיפה יסודית."]],["מִרְקָם",["הרכב של חומר","מארג, אופי שנובע מההרכב"],["לעוגה הזאת יש מרקם רך ואוורירי.","ההגירה שינתה את המרקם החברתי של העיר."]],["מָשָׁה",["הוציא מתוך המים"],["המציל משה את הילד מהבריכה.","בת פרעה משתה את התיבה מן היאור."]],["מְשׂוּרָה",["במידה מצומצמת, מעט מאוד","כלי למדידת נוזלים"],["בזמן המלחמה חילקו את הלחם במשורה.","הוא מחמיא לעובדיו במשורה."]],["מָשַׁל בְּרוּחוֹ",["ריסן את עצמו, התאפק"],["למרות ההתגרות, השחקן משל ברוחו.","רק מי שמושל ברוחו יכול להיות שופט טוב."]],["נוֹחַ לִכְעוֹס",["מתעצבן מהר, מהיר חֵמה"],["הבוס נוח לכעוס, ולכן כולם נזהרים ממנו.","אל תהיה נוח לכעוס, קודם תקשיב להסבר."]],["נִישָׂא",["הושמע, נאמר","רם, גבוה","הורם, הונף"],["הנאום נישא בפני אלפי אנשים.","הדגל התנוסס על המגדל הנישא ביותר בעיר."]],["נָמוֹג",["מפוחד מאוד, מבוהל","נעלם בהדרגה, התפוגג"],["החיילים הנמוגים ברחו משדה הקרב.","הערפל נמוג עם עליית השמש."]],["נַקִיק",["חריץ בסלע או בהר, סדק"],["הנשר בנה קן בנקיק שבצוק.","הלטאה נעלמה בתוך נקיק בסלע."]],["נֵתַח",["חתיכת בשר","חלק מהשלם, פרוסה"],["הקצב חתך נתח בשר עבור הלקוחה.","החברה כבשה נתח גדול משוק הטלפונים."]],["סָבָא",["שתה לשוכרה (מסבאה - פאב)"],["הם ישבו במסבאה וסבאו יין עד חצות.","השיכור סבא כל הלילה ולא זכר דבר בבוקר."]],["סַגְפָן",["אדם שמענה את עצמו, מתנזר מהנאות החיים"],["הנזיר הסגפן אכל רק לחם ומים.","הוא חי כסגפן וויתר על כל הנאה."]],["סוּגַר",["כלוב"],["האריה הסתובב בחוסר מנוחה בסוגר.","הציפור הקטנה שרה בתוך הסוגר."]],["סֶכֶר",["מחסום בפני זרם מים של נהר או תעלה שניתן להרימו ולהורידו לפי הצורך"],["הסכר על הנהר מונע הצפות בחורף.","כשפתחו את הסכר, המים זרמו בעוצמה."]],["סָכַר אֶת פִּיו",["סתם לו את הפה, החריש"],["התשובה הניצחת שלה סכרה את פיו.","המנהל סכר את פיו של העובד שהתלונן."]],["סָרִיג",["אריג סרוג דמוי רשת","מתקן לייבוש כלים","שבכה, מחיצת רשת"],["היא סרגה צעיף מסריג רך.","הכלים הרטובים הונחו על הסריג ליד הכיור."]],["סָתוּם",["לא ברור, לא מובן, מעורפל"],["המכתב נכתב בלשון סתומה, ואיש לא הבין את כוונתו.","השורה הסתומה בשיר עוררה ויכוחים בין הפרשנים."]],["עִבּוּי",["תהליך הפיכת גז לנוזל","הפיכת דבר לעבה, צפוף או סמיך יותר משהיה"],["טיפות הטל נוצרות מעיבוי של אדי המים באוויר.","העירייה החליטה על עיבוי הבנייה בשכונה."]],["עֲדִי",["תכשיט"],["הכלה ענדה עדי זהב בחתונה.","בקבר העתיק נמצאו כלי חרס ועדיים."]],["עַל נְקַלָּה",["בקלות, ללא מאמץ"],["את המבחן הזה לא עוברים על נקלה.","הם ניצחו את הקבוצה החלשה על נקלה."]],["עָלוּם",["מוסתר, חסוי","בלתי מוסבר, לא מובן"],["התרומה הגיעה מתורם עלום שם.","סיבת מותו נותרה עלומה."]],["עֱלִי",["חלק ממערכת הרביה של צמחים","מכשיר שצורתו גליל המשמש לכתישה"],["היא כתשה את התבלינים במכתש ובעלי.","הדבורה נגעה בעלי של הפרח והעבירה אבקה."]],["עִנְבָּל",["לשון הפעמון","רצועת הבשר הקטנה התלויה בחלל הלוע מעל ללשון"],["הענבל פגע בדופן הפעמון והשמיע צלצול.","הרופא ביקש מהילד לפתוח את הפה כדי לבדוק את הענבל."]],["עָנֵף",["מסועף, בעל הרבה שלוחות","שיש לו הרבה ענפים רבים"],["לחברה יש ניסיון ענף בפיתוח תוכנה.","העץ העתיק היה ענף וסיפק צל רב."]],["עָסִיסִי",["רענן, מעניין","מלא מיץ"],["האבטיח היה עסיסי ומתוק.","העיתון פרסם רכילות עסיסית על הזמר."]],["עֲשָׁשִׁית",["מנורת נפט"],["בלי חשמל, הם הדליקו עששית בבקתה.","אור העששית ריצד על קירות החדר."]],["פָּדָה",["הציל, שיחרר, חילץ","שילם כסף תמורת החפץ הממושכן"],["המשפחה פדתה את השבוי בכופר גבוה.","הוא חזר לבית העבוט ופדה את השעון שמישכן."]],["פּוּזְמָק",["גרב"],["הילד הסתובב בבית בפוזמקים בלבד.","סבתא סרגה לו פוזמקי צמר לחורף."]],["פּוּמִית",["פִּיָּה"],["הנגן ניגב את הפומית של החצוצרה.","לכל נבדק ניתנה פומית חדשה לבדיקת הנשיפה."]],["פִּיטּוּם",["האכלת מופרזת"],["פיטום אווזים נאסר בחוק בגלל ההתעללות בבעלי החיים.","פיטום התלמידים בחומר לקראת הבחינה לא מלמד אותם לחשוב."]],["פִּיֵּס",["הרגיע מישהו והשכיח את כעסו על ידי בקשת סליחה, פיצוי וכו'","השכין שלום בין שני צדדים"],["הוא קנה לה פרחים כדי לפייס אותה.","המתווך פייס בין השכנים הניצים."]],["פִּיק בִּרְכַּיִּים",["רעידת הברכיים מפחד או מחולשה"],["כשעלה לבמה, אחז בו פיק ברכיים.","הידיעה המבהילה גרמה לה לפיק ברכיים."]],["פֶּלֶג",["חלק מהשלם (לרוב במשמעות חצי)","נחל טבעי קטן, ערוץ","חלק מקבוצה שחבריו החליטו להיפרד ממנה"],["פלג מים זרם בין הסלעים.","פלג קיצוני פרש מהמפלגה והקים תנועה חדשה."]],["פָּרַע",["הרס, בזז","החזיר חוב"],["הוא פרע את החוב בתשלומים חודשיים.","ההמון הזועם פרע בחנויות ושבר חלונות."]],["פָשָׂה",["התפשט, התרחב, נפוץ (משמש במיוחד לתיאור תופעות שליליות או מזיקות)"],["המגפה פשתה בכל רחבי המדינה.","השחיתות פשתה בכל מערכות השלטון."]],["פִּשְפָּש",["דלת קטנה, שער קטן"],["נכנסנו לחצר דרך הפשפש שבשער הגדול.","בדלת המבצר היה פשפש קטן לשומרים."]],["פֶּתִי",["מי שמאמין לכל מה שאומרים לו"],["רק פתי יאמין להבטחות שלו.","הנוכל ניצל את הפתאים שמסרו לו את חסכונותיהם."]],["צְדוּדִית",["פרופיל, מראה דמותו של אדם או עצם מן הצד"],["האמנית ציירה את צדודיתה של הילדה.","על המטבע מופיעה צדודית של המלכה."]],["צוֹהַר",["חלון קטן, אשנב"],["אור השמש חדר מבעד לצוהר שבגג.","הספר פותח צוהר לעולמם של המהגרים."]],["קוּבְלָנָה",["תלונה, טענה"],["הלקוח הגיש קובלנה נגד החברה.","העובדים באו אל המנהל בקובלנות על תנאי העבודה."]],["קוּלְמוּס",["עט, נוצה לרישום"],["המשורר טבל את הקולמוס בדיו והתחיל לכתוב.","בהינף קולמוס ביטל השר את התוכנית."]],["קוּף הַמַּחַט",["החור במחט דרכו משחילים את החוט, חריר המחט"],["סבתא התקשתה להשחיל את החוט בקוף המחט.","הגמל לא יעבור בקוף המחט, אמר הרב בחיוך."]],["קוֹרַת רוּחַ",["שביעות רצון, נחת (להיפך: מורת רוח)"],["ההורים הביטו בקורת רוח בבנם המסיים את לימודיו.","היא קיבלה את התוצאות בקורת רוח."]],["קֶסֶת",["כלי לדיו"],["על שולחן הסופר עמדה קסת דיו ישנה.","הסופר טבל את הקולמוס בקסת."]],["קָפַץ",["סגר בחוזקה איבר כלשהו (שפתיים, אגרוף)"],["הוא קפץ את שפתיו כדי לא לצעוק.","הילד קפץ את אגרופו בכעס."]],["קָפַץ אֶת יָדוֹ",["סרב לתת"],["העשיר קפץ את ידו ולא תרם דבר.","אל תקפוץ את ידך מול העני."]],["קָרוּא",["מי שהוזמן"],["רק הקרואים הורשו להיכנס לאולם.","מאות קרואים הגיעו לחתונה."]],["קְשֵׁה עוֹרֶף",["עקשן"],["הילד קשה העורף סירב ללבוש מעיל.","המשא ומתן נתקע בגלל עמדתו קשת העורף של הצד השני."]],["רַאַוְותָן",["אוהב להראות את עצמו ולהרשים אחרים (מציג עצמו כאילו היה חלון ראוה)"],["הוא ראוותן שמתהדר בשעון היקר שלו מול כולם.","החתונה הראוותנית עלתה הון עתק."]],["רֶגֶב",["גוש עפר"],["הילדים זרקו רגבי אדמה לתוך הבור.","המחרשה שברה את רגבי העפר."]],["רְדִיד",["צעיף"],["היא עטפה את כתפיה ברדיד משי.","בחורף היא לובשת רדיד צמר מעל המעיל."]],["רוֹבֶד",["שכבה"],["הארכאולוגים חשפו רובד מן התקופה הרומית.","לסיפור יש רובד נוסף, עמוק יותר."]],["רָווּי",["מלא, עמוס","מלא בנוזלים, ששתה מספיק, שהשקו אותו דַיו"],["האוויר היה רווי לחות.","הנאום היה רווי רגש."]],["רֶכֶס",["שרשרת הרים או גבעות"],["הם טיפסו אל רכס ההרים.","השמש שקעה מאחורי רכס הכרמל."]],["רָפֶה",["חלש ומדולדל, רופס"],["הוא לחץ את ידי בלחיצה רפה.","המנהיג הרפה לא הצליח לקבל החלטות."]],["רִפְיוֹן יָדַיִּם",["יאוש"],["אחרי הכישלון השלישי אחז בו רפיון ידיים.","אסור לתת לרפיון ידיים להשתלט עלינו."]],["רִפְיוֹן רוּחַ",["יאוש","חולשה נפשית, חוסר אונים"],["תקופה ארוכה של אבטלה הביאה אותו לרפיון רוח.","המאמן ניסה לעודד את השחקנים ולמנוע רפיון רוח."]],["רִתְמָה",["מערכת רצועות המשמשת לקשירת הבהמה, אפסר, רסן"],["האיכר הידק את הרתמה על הסוס.","הכלב נקשר ברתמה ליד הדלת."]],["שְׁבָב",["חלק קטן במחשב (צִ 'יפ)","רסיס עץ או מתכת הניתז בעת עיבודם"],["המחשב החדש מצויד בשבב מהיר במיוחד.","שבבי עץ עפו לכל עבר בזמן הניסור."]],["שַׁבְשֶׁבֶת",["מתקן המשמש לזיהוי כיוון הרוח"],["השבשבת על הגג הראתה שהרוח נושבת ממערב.","הוא משנה את דעתו כמו שבשבת."]],["שִׁגְעוֹן גַּדְלוּת",["סוג של הפרעה נפשית שהלוקה בה חושב שהוא אישיות חשובה ובעלת כוחות מיוחדים"],["המנהל החדש לוקה בשיגעון גדלות.","בשיגעון הגדלות שלו הוא ראה את עצמו כמלך."]],["שְׁדֵמָה",["שדה תבואה או כרם"],["השדמות הצהיבו לקראת הקציר.","מן הגבעה השקפנו על השדמות והכרמים."]],["שׁוֹקֶת",["מיכל מים דמוי אמבטיה המשמש להשקיית בהמות (בִּפְנֵי שׁוֹקֶת שְׁבוּרָה - במצב של חוסר אונים)"],["הפרות שתו מים מן השוקת.","אחרי שהעסק קרס, הוא נותר מול שוקת שבורה."]],["שִׁיסּוּי",["הסתה לתקיפה, חירחור"],["שיסוי הכלבים במפגינים עורר ביקורת קשה.","המאמר עסק בשיסוי קבוצות באוכלוסייה זו בזו."]],["שָׁלַט בְּרוּחוֹ",["ריסן את עצמו, התאפק"],["השופט שלט ברוחו למרות הצעקות באולם.","כשבנו שבר את החלון, האב שלט ברוחו ולא צעק."]],["שִׁעֲרוּך",["הערכת שווי מחדש"],["הבנק ביצע שערוך של הנכסים בעקבות ירידת המחירים.","שערוך המניות הביא לרווח גדול בדוחות."]],["שִׁרְבּוּט",["ציור ללא משמעות, \"קשקוש\""],["בשולי המחברת היו שרבוטים של התלמיד.","מה שנראה כמו שרבוט היה בעצם מפת אוצר."]],["תָּאֵב",["רוצה מאוד, משתוקק (תאב בצע - רודף כסף)"],["הוא אדם תאב בצע שמוכן לעשות הכול למען כסף.","הילדים היו תאבים לשמוע את סוף הסיפור."]],["תַּגְּרָן",["רוכל בשוק, סוחר","כינוי למי שמרבה להתווכח על המחיר"],["התגרן בשוק הכריז בקול על מחירי הפירות.","אל תהיה תגרן, המחיר כבר הוגן."]],["תּוֹחֶלֶת חַיִים",["משך הזמן שאדם (או מכשיר או ארגון) צפויים להתקיים"],["תוחלת החיים בישראל גבוהה מהממוצע העולמי.","תוחלת החיים של הסוללה הזאת היא כשלוש שנים."]],["תְּלוּלִית",["ערימה קטנה, תלולית"],["הילדים בנו תלולית חול על החוף.","תלולית עפר נערמה ליד הבור שנחפר."]],["אֲבוּקָה",["לפיד, צרור קיסמים בוערים"],["המטיילים הדליקו אבוקות ונכנסו למערה.","הנערים נשאו אבוקות בתהלוכה."]],["אֶבֶן מַשְׁחֶזֶת",["אבן המשמשת להשחזה ושינון של כלי חיתוך חדים"],["הנגר חידד את האזמל על אבן משחזת.","הוויכוחים עם חבריו היו לו אבן משחזת לרעיונות."]],["אֶגֶד",["תחבושת לפצע, פלסטר (אגד מדבק)","חבילה","יחידה צבאית גדולה"],["האחות חבשה את הפצע באגד סטרילי.","אגד שריון גדול הוזעק לגבול בזמן המלחמה."]],["אֵגֶל",["רסיס, טיפה של נוזל (טל, זיעה, דמעה וכדומה)"],["אגלי זיעה הופיעו על מצחו של הרץ.","בבוקר נצצו אגלי טל על העלים."]],["אָהִיל",["כיסוי למנורה"],["היא החליפה את האהיל הישן של המנורה באהיל בד חדש.","האהיל הכהה עמעם את האור בחדר."]],["אוֹבְּיֶקְטִיבִי",["ענייני, שאינו מושפע מדעות או העדפות אישיות"],["שופט צריך להיות אובייקטיבי ולא להעדיף אף צד.","הכתבה לא הייתה אובייקטיבית, והיא הציגה רק את עמדת החברה."]],["אוּמְדָן",["הערכה של גודל"],["לפי האומדן, כעשרת אלפים איש השתתפו בהפגנה.","הקבלן מסר אומדן ראשוני של עלות השיפוץ."]],["אוֹרְחָה",["שיירה של בעלי חיים או רוכבים (בדרך כלל של גמלים)"],["אורחת גמלים עשתה את דרכה במדבר.","סוחרי התבלינים הצטרפו לאורחה הגדולה שיצאה לכיוון דמשק."]],["אוֹרְלוֹגִין",["שעון קיר גדול"],["האורלוגין שבסלון צלצל שתים עשרה פעמים בחצות.","סבא כיוון את האורלוגין הישן בכל בוקר."]],["אָחוּז אֵימָה",["מפוחד מאוד"],["כששמע צעדים בחושך, הוא עמד אחוז אימה.","התושבים ברחו אחוזי אימה מהבניין הבוער."]],["אָכַף",["כפה על קיום חוק, תקנה, פסק דין"],["המשטרה אוכפת את חוקי התנועה בכבישים.","העירייה החליטה לאכוף את האיסור על עישון בפארקים."]],["אָנִין",["בעל טעם מעודן ורגיש, בררן"],["מבקר המסעדות האנין לא התרשם מהמנה.","יש לו טעם אנין במוזיקה, והוא לא מקשיב לשירים פשוטים."]],["אָפִיק",["נחל, ערוץ, נהר","מסלול, נתיב, כיוון"],["אפיק הנחל יבש רוב השנה.","התלמיד מחפש אפיק חדש לקריירה שלו."]],["אָפַס",["לא נשאר ממנו דבר, תם, נגמר"],["אחרי שבוע בלי עבודה, אפס הכסף שבכיסו.","כשראה את הציון, אפסה כל תקווה שעוד יתקבל."]],["בָּא עַל שְׂכָרוֹ",["קיבל את מה שמגיע לו על מעשיו הטובים, תוגמל"],["התלמידה שהשקיעה כל השנה באה על שכרה וקיבלה ציון מלא.","הכורם שטיפל בגפנים באהבה בא על שכרו ביבול גדול."]],["בּוֹסֵס",["הלך לאט ובצעדים כבדים, בדרך כלל באדמה טובענית, בבוץ, בשלג וכדומה"],["החיילים בוססו בבוץ העמוק לאורך השביל.","המטיילים בוססו בשלג עד ברכיהם."]],["בָּזַק",["פיזר"],["האיכר בזק זרעים על פני השדה.","הטבח בזק מלח ופלפל על הבשר."]],["בָּזָק",["מהיר מאוד, מפתיע"],["המשטרה ערכה מבצע בזק ותפסה את החשודים תוך שעה.","בבחירות הבזק ניצח המועמד הצעיר."]],["בְּחַדְרֵי חֲדָרִים",["בצורה לא גלויה, בסתר"],["ההחלטה התקבלה בחדרי חדרים, בלי שהציבור ידע עליה.","העסקה נרקמה בחדרי חדרים בין שני המנהלים."]],["בִּיעוּת",["פחד גדול, מורא, אימה"],["הפיצוץ הפתאומי עורר ביעות בקרב העוברים ושבים.","הילד התעורר מחלום ביעותים וקרא לאמו."]],["בִּיעָף",["במהירות"],["הוא עבר ביעף על העבודה ולא שם לב לשגיאות.","המטוס חלף ביעף מעל ראשינו."]],["בֵּית מֶרְחָץ",["מקום ציבורי שניתן להתרחץ ולהתקלח בו"],["בתקופה הרומית היה בית המרחץ מקום מפגש חברתי.","בעיר העתיקה נחשף בית מרחץ עם בריכות אבן."]],["בַּר",["תבואה, גרגרי תבואה ללא השיבולים","בן","חוץ, הצד החיצון (אין תוכו כברו - אין פנימיותו כחיצוניותו)","לא מתורבת, פראי","נקי, טהור","ראוי ל-, בעל... (בר- סמכא - בעל סמכות)"],["האיכר מכר שק של בר לטחנה.","השופט הוא בר סמכא בדיני משפחה."]],["בְּרִיּוֹת",["שם כולל לבעלי החיים (כולל בני אדם)"],["הוא אדם אהוב על הבריות, כי הוא תמיד מוכן לעזור.","בסיפור מופיעות בריות משונות שחיות ביער."]],["בְּרִיחַ",["אחד החלקים בנשק קל","קורה מעץ או ברזל המשמשת לנעילת השער"],["החייל פירק את הבריח של הרובה כדי לנקות אותו.","השומר נעל את השער בבריח ברזל כבד."]],["בַּר-שְׁפִיטָה",["מי שניתן לשפוט אותו"],["לפי חוות הדעת, הנאשם אינו בר שפיטה בגלל מצבו הנפשי.","ילד בן שמונה אינו בר שפיטה בבית משפט פלילי."]],["בְּשׁוֹגֵג",["לא בכוונה, בטעות, שלא במתכוון, בלא יודעין"],["הוא מחק את הקובץ בשוגג.","הנהג הודה שפגע בגדר בשוגג."]],["גּוֹרֶן",["מקום בו דשים את התבואה (מפרידים את הגרגרים מהשיבולים)"],["האיכרים הביאו את השיבולים לגורן כדי לדוש אותן.","בערב ישבו הפועלים על הגורן ונחו."]],["גָחַן",["התכופף, שח, גהר"],["האם גחנה אל הילד ולחשה באוזנו.","הוא גחן מעל הבאר כדי לראות את המים."]],["גַּלָב",["סַפָּר, אדם שמקצועו לספר אנשים ולגלחם"],["הגלב גילח את זקנו של הזקן בתער חד.","בשוק ישב גלב שסיפר את הלקוחות על שרפרף."]],["גַּמְלוֹנִי",["גדול, ארוך, מגושם, חסר קואורדינציה, מסורבל (גמלוני - כמו גמל)"],["הנער הגמלוני נתקל ברהיטים בכל צעד.","הרהיט הגמלוני לא נכנס בדלת."]],["גָּנַז",["העביר מסמכים לארכיב לשם אִחסון"],["הארכיון גנז את המכתבים הישנים של ראש הממשלה.","הממשלה החליטה לגנוז את הדוח ולא לפרסם אותו."]],["גֵּץ",["ניצוץ"],["גץ מהמדורה עף ונחת על השמיכה.","גץ קטן מספיק כדי להצית שריפה ביער יבש."]],["גֶּשֶׁם זַלְעָפוֹת",["גשם חזק, מבול"],["גשם זלעפות ירד על העיר כל הלילה.","המשחק הופסק בגלל גשם זלעפות."]],["דּוּמָם",["בשקט, בדממה"],["הם ישבו דומם והקשיבו לקולות הלילה.","הילד בכה דומם כדי שאיש לא ישמע."]],["דִידָה",["צלע, הלך תוך קפיצות קלות ותנועות מצד לצד"],["הזקן דידה לאורך הרחוב בעזרת מקל.","הילדה הקטנה דידתה בשמחה אחרי הבלון."]],["דָּלִיל",["מימי, נוזלי","לא מרוכז, לא דחוס, מפוזר"],["המרק יצא דליל מדי, צריך להוסיף לו תפוחי אדמה.","השיער שלו נעשה דליל עם השנים."]],["דִמְעוֹת תַנִּין",["דמעות שווא המוזלות רק למראית עין, השתתפות בצער הזולת כלפי חוץ בלבד"],["הוא הזיל דמעות תנין בהלוויה, אף שלא אהב את הנפטר.","אל תזיל דמעות תנין, אני יודע שאתה שמח שהפסדתי."]],["דֶּשֶׁן",["חומר כימי שמוסיפים לאדמה לצורך השבחתה לגידול צמחים"],["החקלאי פיזר דשן בשדה לפני הזריעה.","שימוש מופרז בדשן עלול לזהם את מי התהום."]],["הִדִּיחַ",["הסית למעשה שלילי"],["המבוגרים הדיחו את הנערים לגנוב מהחנות.","הכת הדיחה את חבריה להתרחק ממשפחותיהם."]],["הַדְרָן",["קטע נוסף לאחר סיום הופעה, לאור בקשת הקהל"],["הקהל מחא כפיים, והזמר חזר לבמה להדרן.","הלהקה ניגנה שלושה הדרנים בסוף ההופעה."]],["הוֹגִיעַ",["עייף"],["הוא היה הוגיע אחרי יום עבודה ארוך.","הדרך הארוכה הוגיעה את המטיילים."]],["הִזְלִיף",["התיז נוזל, טפטף"],["הטבח הזליף רוטב על הבשר.","היא הזליפה בושם על צווארה."]],["הִטִּיל אֶת חִתּוֹ / חִתָּתוֹ",["הפחיד אותו מאוד, הרתיע"],["הכלב הגדול הטיל את חיתתו על הילדים בשכונה.","המורה הקפדנית הטילה את חיתתה על התלמידים."]],["הֵטִיל מוֹרָא",["הפחיד מאוד"],["השליט הטיל מורא על כל נתיניו.","הקול הרועם שלו הטיל מורא על כל מי שבחדר."]],["הִלְאִים",["העביר לבעלות הכלל, הפקיע מבעלות פרטית לבעלות לאומית (להיפך: הפריט)"],["הממשלה הלאימה את חברת החשמל.","אחרי המהפכה הולאמו כל בתי החרושת במדינה."]],["הָלַךְ רָכִיל",["ריכל"],["השכנה הלכה רכיל וסיפרה לכולם על הריב.","מי שהולך רכיל מאבד את אמון חבריו."]],["הָלַך שְׁבִי",["התפתה אחרי דבר מה שהתברר כשקר ומרמה, הלך שולל","התאהב במישהו או משהו לחלוטין והיה מוכן לעשות הכול למענו"],["המשקיעים הלכו שבי אחרי ההבטחות לרווח מהיר.","הוא הלך שבי אחרי קסמה והיה מוכן לעשות הכול למענה."]],["הָלַך שׁוֹלַל",["האמין לדבר שהתברר כמוטעה, רוּמה"],["הלקוחות הלכו שולל אחרי הפרסומת המטעה.","אל תלך שולל אחרי המחיר הזול, המוצר גרוע."]],["הִלְעִיט",["האכיל יותר מידי"],["סבתא הלעיטה את הנכדים בעוגות ובממתקים.","התקשורת הלעיטה את הציבור בשמועות."]],["הֵמִיר",["החליף דבר אחד בשני"],["בנמל התעופה המיר את השקלים לדולרים.","הוא המיר את דתו לפני שהתחתן."]],["הֵמֵס",["חימם מוצק עד שהפך לנוזל"],["השמש הממיסה את השלג על ההרים.","הממיסו את השוקולד באמבט מים חמים."]],["הֵסֵב",["התיישב לשולחן"],["המשפחה הסבה לשולחן לארוחת החג.","האורחים הסבו לשולחן והמתינו למנה הראשונה."]],["הֶעְפִּיל",["עלה על מקום גבוהה, טיפס","התקדם בתפקיד או מעמד"],["המטפסים העפילו לפסגת ההר עם הזריחה.","בתוך שנים ספורות הוא העפיל לתפקיד מנכ״ל."]],["הִפְצִיר",["בקש שוב ושוב, התחנן"],["היא הפצירה בו להישאר לארוחת ערב.","למרות שהפצירו בו, הוא סירב להתפטר."]],["הִפְקִיעַ",["לקח דבר מה מבעליו בעזרת צו משפטי או בתוקף חוקי אחר","העלה דבר מעבר למקובל (הפקעת מחירים - העלאה מופרזת של מחירים מעבר למחיר המקובל, פשיטת עור)"],["המדינה הפקיעה את הקרקע לצורך סלילת כביש.","בזמן המחסור הסוחרים הפקיעו את מחירי המים."]],["הֵפֵר",["לא קיים","הפסיק, השבית"],["הקבלן הפר את החוזה ולא סיים את הבנייה.","צלצול הטלפון הפר את השקט בחדר."]],["הִצְטַנֵּף",["התכרבל בתנוחה עוברית"],["הכלבלב הצטנף על השטיח וישן.","היא הצטנפה מתחת לשמיכה בלילה הקר."]],["הֵקִיץ הַקֵץ",["הגיע הסוף למשהו, תם"],["הקיץ הקץ על השלטון הישן.","כשהגיעה ההודעה הבין שהקיץ הקץ על החלום."]],["הִקְנִיט",["הרגיז מישהו על ידי לעג, עקיצה"],["האח הגדול הקניט את אחותו על שיערה.","התלמידים הקניטו את הילד החדש בכיתה."]],["הִרְעִיף",["העניק דברים טובים (כמו מחמאות) בנדיבות וברוחב לב","הזיל, התיז"],["המנהל הרעיף שבחים על העובדת החדשה.","העננים הרעיפו גשם על השדות היבשים."]],["הִרְפָּה",["הפסיק להחזיק בו, הפסיק להטריד או להציק"],["הכלב לא הרפה מהמקל.","הילד הרפה מאמו רק כשהבטיחה לחזור."]],["הִשִּׂיא עֵצָה",["ייעץ"],["המורה השיאה לו עצה לפתוח בשאלות הקלות.","הוא השיא לחבריו עצה טובה לפני הראיון."]],["הִשְׁרָה",["שם משהו בתוך נוזל, טבל (והשאיר בתוך הנוזל)"],["צריך להשרות את החומוס במים במשך לילה.","היא השרתה את הבגד המוכתם בחומר ניקוי."]],["הִשְׁתַּיֵּר",["נשאר, נותר"],["מהעוגה השתיירה רק פרוסה אחת.","מכל בני הכפר השתיירו רק כמה משפחות."]],["הִשְׁתַּעְבֵּד",["השקיע את כל זמנו ומרצו במשהו תוך זניחת דברים אחרים","קיבל בהכנעה את מרותו של מישהו, דוכא","התמכר"],["הוא השתעבד לעבודה ושכח את משפחתו.","העם המובס נאלץ להשתעבד לשליט הזר."]],["הִתְאַבֵּק בַּעֲפַר רַגְלָיו",["הפך לתלמידו"],["עוד בנעוריו התאבק בעפר רגליו של הצייר הגדול.","התלמידים התאבקו בעפר רגליו של הרב ולמדו ממנו כל דבר."]],["הִתִּיךְ",["העביר חומר ממצב מוצק למצב נוזל"],["הצורף התיך את הזהב ויצק ממנו טבעת.","החום העז התיך את הנר."]],["הִתְיַמֵּר",["חשב וטען שהוא יכול לעשות משהו שמעבר ליכולתו"],["הוא מתיימר להבין בכל תחום, אף שאין לו השכלה.","התוכנית מתיימרת לפתור את משבר הדיור בתוך שנה."]],["הִתְלַקֵּחַ",["התפרץ, התעורר והתחזק (על יֶצֶר, רגש וכד')","נדלק, התחיל לבעור","התלהט, התפשט (על ריב, קטטה וכד')"],["הוויכוח התלקח והפך לקטטה.","העצים היבשים התלקחו מיד."]],["הִתְעַשֵּׁת",["חזר לשלוט במצב, התארגן מחדש, יצא ממצב של בלבול"],["אחרי ההלם הראשוני, הוא התעשת והזעיק עזרה.","הקבוצה התעשתה במחצית השנייה וניצחה."]],["הִתְפִּיל",["הפך לתפל, הפך מי ים למי שתיה"],["המתקן החדש מתפיל מי ים ומספק מים לעיר.","המטבח התפיל את התבשיל כששכחו להוסיף מלח."]],["הִתְקַנֵּא",["התחיל לקנא"],["כשראתה את השמלה החדשה של חברתה, היא התקנאה.","הילד התקנא באחיו התינוק שקיבל את כל תשומת הלב."]],["הִתְרַבְרֵב",["התגאה, השתחצן, \"השוויץ\""],["הוא התרברב בפני חבריו שהוא הכי מהיר בכיתה.","אל תתרברב, עוד לא ניצחת."]],["הִתְרַעֵם",["כעס, התרגז, התמרמר"],["התושבים התרעמו על החלטת העירייה.","הוא התרעם על כך שלא הזמינו אותו לפגישה."]],["זַאֲטוּט",["ילד קטן, תינוק"],["הזאטוט רץ בחצר אחרי הכדור.","בגן הילדים שיחקו זאטוטים בני שלוש."]],["זְחוּחַ",["מי שהתנהגותו היא שילוב של שביעות רצון מוגזמת וגאוותנות"],["אחרי הניצחון הוא הסתובב זחוח, בטוח שהוא הטוב ביותר.","החיוך הזחוח שלו עצבן את כולם."]],["זִיקּוּק",["טיהור, ניקוי"],["זיקוק הנפט הוא תהליך ארוך ומסובך.","בבית הזיקוק הופכים נפט גולמי לדלק."]],["זַך",["נקי, טהור, צלול"],["מי המעיין היו זכים וצלולים.","היה לו לב זך ותמים."]],["זִכּוּך",["טיהור"],["המים עוברים זיכוך בכמה שלבים לפני שהם מגיעים לברז.","המוזיקה הייתה עבורו אמצעי לזיכוך הנפש."]],["זָרָה",["פיזר, הפיץ (כמו בביטוי - זרה מלח על הפצעים)"],["הרוח זרתה את העלים היבשים בחצר.","האיכר זרה את התבואה ברוח כדי להפריד את המוץ."]],["זָרָה אֲבָק / חוֹל בַּעֵינַיִים",["הונה, ניסה להסתיר את העובדות"],["המנהל זרה חול בעיני הדירקטוריון והסתיר את ההפסדים.","אל תזרה לי אבק בעיניים, אני יודע מה באמת קרה."]],["חוֹשֶׁךְ מִצְרַיִם",["אפלה כבדה, חושך מוחלט (מכת החושך במצרים)"],["כשהחשמל נפל, השתרר בבית חושך מצרים.","במערה היה חושך מצרים, ולא ראינו דבר."]],["חַיִּץ",["סוג של גדר המשמש להפרדה, מחיצה"],["בבית הכנסת הפריד חייץ עץ בין עזרת הנשים לגברים.","המעקה משמש חייץ בין הכביש למדרכה."]],["חִישֵּׁל",["חיזק והקשיח מבחינה פיזית או נפשית"],["השירות הצבאי חישל את אופיו.","הקשיים שעברה בילדותה חישלו אותה."]],["חֲפִיר",["תעלה חפורה באדמה מסביב לחומת העיר או מסביב למבצר"],["סביב הטירה נחפר חפיר מלא מים.","התוקפים ניסו לחצות את החפיר בעזרת גשר מאולתר."]],["חֵרֵף נַפְשוֹ",["סיכן את חייו בשביל משהו שהאמין בו"],["החייל חירף את נפשו כדי לחלץ את חברו הפצוע.","הלוחמים חירפו את נפשם בקרב על העיר."]],["חֶרְפָּה",["בושה"],["התבוסה נחשבה חרפה לצבא.","הוא לא יכול היה לשאת את החרפה ועזב את העיר."]],["חֶשְׁבּוֹנִיָּה",["מכשיר לביצוע פעולות פשוטות של חיבור וחיסור (מורכב משורות חרוזים שאפשר להזיזם מצד לצד)"],["בגן לומדים לספור בעזרת חשבונייה צבעונית.","הסוחר הזקן חישב את החשבון על חשבונייה ישנה."]],["חַתְרָנוּת",["לחתור תחת מישהו, פעילות שמטרתה לערער מבפנים את הסדר הקיים"],["השלטון האשים את העיתונאים בחתרנות.","הארגון החתרני פעל בסתר נגד הממשלה."]],["טָחוּב",["רטוב, לח"],["המרתף הטחוב הדיף ריח של עובש.","הבגדים שנשארו בשק הפכו טחובים."]],["טָמַן ראשׁוֹ בַּחוֹל",["התעלם מהמציאות החמורה"],["הממשלה טמנה את ראשה בחול והתעלמה מהמשבר.","במקום לטמון את הראש בחול, כדאי לטפל בבעיה עכשיו."]],["טֶרָסָה",["מדרגה שנבנית במדרון ההר כדי למנוע סחף אדמה"],["החקלאים בנו טרסות על מדרון ההר ושתלו בהן גפנים.","הטרסות העתיקות מונעות מהגשם לסחוף את האדמה."]],["יָהִיר",["גאוותן, רברבן"],["השחקן היהיר לא הסכים לדבר עם העיתונאים.","ההתנהגות היהירה שלו הרחיקה ממנו חברים."]],["יְחִידֵי סְגוּלָה",["אנשים שמצטיינים בתחום פעולתם, משכמם ומעלה"],["רק יחידי סגולה מצליחים להתקבל ליחידה הזאת.","המורה הזאת היא מיחידי הסגולה שמסוגלים לרתק כל כיתה."]],["יְלוּדָה",["כלל התינוקות שנולדו בזמן/במקום מסוים (ההפך מתמותה)"],["שיעור הילודה בעיר עלה בשנים האחרונות.","בגלל ירידה בילודה נסגרו כמה גנים בשכונה."]],["יָצָא מִכֵּלָיו",["התפרץ בכעס עד ששכח את עצמו, התרתח ביותר"],["כשגילה שדירתו נפרצה, הוא יצא מכליו.","השופט יצא מכליו כשהנאשם העליב את הקורבן."]],["יֶקֶב",["המקום שבו מייצרים יין"],["ביקרנו ביקב שבגליל וטעמנו כמה סוגי יין.","היקב הוותיק מייצר יין כבר מאה שנה."]],["יְקַר הַמְּצִיאוּת",["נדיר, שאין רבים כמותו"],["מורה סבלנית כמוה היא יקרת המציאות.","הפרח הזה יקר המציאות וגדל רק בכמה מקומות בעולם."]],["יְשִׁימוֹן",["מדבר, שממה"],["בני ישראל נדדו ארבעים שנה בישימון.","העיר הנטושה הפכה לישימון."]],["יָשִׁישׁ",["זקן, קשיש"],["הישיש סיפר לנכדיו על ימי ילדותו בכפר.","בדיור המוגן מתגוררים ישישים רבים."]],["כִּיכָּר",["יחידת משקל עתיקה"],["המלך דרש מס של כיכר כסף מכל עיר.","בתנ״ך מוזכרים כיכרות של זהב שנתרמו למקדש."]],["כָּלִיל",["לגמרי, לחלוטין, עד תום"],["השריפה השמידה את היער כליל.","הם שכחו כליל את הפגישה."]],["כְּלִימָה",["בושה"],["הוא הסמיק מכלימה כשנתפס משקר.","פניו כוסו כלימה אחרי הכישלון הפומבי."]],["כָּמוּש",["מצומק, בלה, נובל"],["הפרחים הכמושים נזרקו לפח.","הירקות הכמושים שנשארו במקרר כבר לא ראויים לאכילה."]],["לְבָנָה",["ירח, המאור הקטן"],["הלבנה המלאה האירה את השביל.","מחזור הלבנה נמשך כעשרים ותשעה ימים."]],["לְמוֹתָר",["מיותר"],["למותר לציין שכולכם מוזמנים.","ההסבר הנוסף היה למותר, כולם כבר הבינו."]],["מבוֹאָר",["מפורש, מוסבר"],["ההוראות מבוארות היטב בחוברת.","בספר מופיע הטקסט המבואר עם הערות בשוליים."]],["מַגְבִּית",["גביית כספים בצורה מאורגנת למטרה ציבורית כלשהי"],["הקהילה ערכה מגבית לטובת המשפחות שנפגעו.","המגבית גייסה מיליוני שקלים לבניית בית חולים."]],["מַהְבִּיל",["מעלה אדים, רותח"],["הוא שתה תה מהביל ביום הקר.","הסיר המהביל עמד על הכיריים."]],["מָהַל",["ערבב נוזלים, הקטין את הריכוז על ידי הוספת מים"],["הוא מהל את המיץ המרוכז במים.","בעל הבר נתפס מוהל את המשקאות במים."]],["מֵזַח",["רציף הנכנס אל תוך הים ואליו קושרים את הסירות"],["הסירות נקשרו למזח שבנמל.","בערב טיילנו לאורך המזח והבטנו בשקיעה."]],["מֵחוּשִׁים",["כאבים"],["הזקן סבל ממיחושים בגב.","היא התלוננה על מיחושי ראש בבוקר."]],["מַחֲלוֹקֶת",["מריבה, חילוקי דעות"],["בין האחים פרצה מחלוקת על הירושה.","הנושא שנוי במחלוקת בין המומחים."]],["מַחְלָצוֹת",["בגדים מפוארים, לבוש מהודר"],["לטקס הגיעו האורחים לבושים במחלצות.","השחקנית עלתה לבמה במחלצות מפוארות."]],["מַטְפֶּה",["מיכל לכיבוי אש, מַטָף"],["בכל רכב חייב להיות מטפה.","השכן כיבה את השריפה בעזרת מטפה."]],["מֵי תְּהוֹם",["מי גשמים המצטברים מתחת לאדמה ומשמשים מקור למעיינות ולבארות"],["מי התהום באזור זוהמו בגלל שפכים של מפעל.","הבאר שואבת מים מן מי התהום."]],["מְיוֹעָר",["מכוסה יער"],["הגליל העליון הוא אזור הררי ומיוער.","השטח המיוער נשרף כולו בשריפה."]],["מַכּוֹשׁ",["כלי עבודה חקלאי דמוי מעדר"],["הוא עישב את הגינה בעזרת מכוש.","האיכר עבד את הערוגות במכוש ובמעדר."]],["מִנְיָן",["עשרה יהודים לפחות הדרושים בכדי לקיים תפילה"],["בבית הכנסת חיכו לעשירי כדי להשלים מניין.","בזכות השכנים הצליחו לארגן מניין לתפילה."]],["מַעֲגָן",["נמל, מרינה, מפרץ קטן המשמש לעגינת כלי שיט"],["היאכטות עגנו במעגן הקטן שליד הכפר.","המעגן סגור לסירות בזמן סערה."]],["מָעַל",["עשה שימוש בכספים או ברכוש שהובטח בידו למטרות רווח אישיות, שלח יד לכסף"],["הגזבר מעל בכספי העמותה ונשלח לכלא.","הפקידה נחשדה שמעלה בכספים שהופקדו בידיה."]],["מִפְתָּן",["סף, החלק התחתון בכניסה"],["החתול ישב על מפתן הדלת.","המדינה עומדת על מפתן עידן חדש."]],["מַקְצֵרָה",["מכונה חקלאית המשמשת לקצירת יבולי דגנים"],["המקצרה עברה בשדה וקצרה את החיטה.","לפני המצאת המקצרה קצרו את התבואה בידיים."]],["מַרְבָד",["שטיח, שכבה, רובד"],["הרצפה כוסתה במרבד פרסי.","מרבד של פרחים צבעוניים כיסה את הגבעה באביב."]],["מִשְׁעֶנֶת קָנֶה רָצוּץ",["דבר או אדם שאין לסמוך עליו"],["התברר שהבטחות השותף היו משענת קנה רצוץ.","אל תסמוך עליו, הוא משענת קנה רצוץ."]],["מַתְבֵּן",["מחסן תבן, אסם"],["האיכר אחסן את החציר במתבן.","המתבן נשרף, והפרות נותרו בלי מזון לחורף."]],["נָא",["צלוי למחצה, מבושל למחצה"],["הוא מעדיף את הסטייק שלו נא.","אסור לאכול בשר עוף נא."]],["נִבְצַר מִמֶנּוּ",["נמנע ממנו דבר מה"],["נבצר ממני להגיע לכנס בגלל מחלה.","כשהשר חלה ונבצר ממנו למלא את תפקידו, מונה ממלא מקום."]],["נְהִירָה",["הגעה של הרבה אנשים למקום מסוים"],["בחופש הגדול נרשמה נהירה של משפחות לחופים.","הנהירה לקניונים החלה עם תחילת המבצעים."]],["נוּגֶה",["עצוב"],["המנגינה הנוגה העלתה דמעות בעיניה.","הוא ישב ליד החלון במבט נוגה."]],["נָטָה חֶסֶד",["עזר לו והתייחס אליו ברוך, סייע"],["המורה נטתה חסד לתלמיד החדש ועזרה לו להשתלב.","המלך נטה חסד לאסיר ושחרר אותו."]],["נִים וְלָא נִים",["בין שינה לערות, שינה קלה מאוד"],["התינוק היה נים ולא נים כשהנחתי אותו במיטה.","בנסיעה הארוכה ישבתי נים ולא נים."]],["נֵכַר",["ארץ זרה ומרוחקת, חוץ לארץ"],["הוא חי שנים רבות בנכר והתגעגע לארצו.","המהגרים התקשו להסתגל לחיים בארץ נכר."]],["נִלְאֶה",["עייף, תשוש"],["החייל הנלאה נרדם מיד על המיטה.","הרצים הנלאים חצו את קו הסיום בקושי."]],["נְמוּך רוּחַ",["צנוע, עניו"],["למרות הצלחתו הגדולה, הוא נשאר נמוך רוח.","המנהלת נמוכת הרוח לא התגאתה בהישגיה."]],["נָצַר אֶת לְשׁוֹנוֹ / פִּיו",["השתתק, לא הוציא הגה"],["כשהבין שטעה, נצר את לשונו ולא ענה.","היא נצרה את פיה כדי לא לפגוע בו."]],["נִקְבָּה",["מחילה, מנהרה"],["נקבת השילוח העתיקה הובילה מים אל העיר.","המטיילים הלכו עם פנסים לאורך הנקבה."]],["נַקְבּוּבִית",["נקב קטן מאוד, חור זעיר"],["הזיעה יוצאת מהגוף דרך נקבוביות העור.","באבן הספוג יש המון נקבוביות."]],["סָבוּךְ",["מסובך מאוד (על בעיה), סמיך ועבות (על יער)"],["המקרה הסבוך הטריד את החוקרים חודשים.","השביל עבר דרך יער סבוך."]],["סוֹכֵךְ",["כיסה לצורך הגנה"],["גג הפח סוכך על הפועלים מפני השמש.","העץ הגדול סוכך על הילדים ששיחקו תחתיו."]],["סִיכֵּל",["ביטל, הכשיל דבר מה"],["המשטרה סיכלה את השוד ברגע האחרון.","הגשם סיכל את התוכנית לצאת לפיקניק."]],["סָר חִינוֹ",["הפסיק למצוא חן בעיני מישהו (החן שלו זז)"],["הזמר סר חינו בעיני הקהל אחרי השערורייה.","התחביב החדש סר חינו תוך שבוע."]],["סָתוּר",["לא מסודר, פרוע"],["הילד הגיע לבית הספר בשיער סתור.","אחרי הרוח החזקה, שערה היה סתור לגמרי."]],["עָבִיט",["כלי קיבול למי שפכים, סיר לילה"],["החולה ביקש מהאחות להביא לו עביט.","בבית הישן שמרו עביט מתחת למיטה."]],["עֶגְלוֹן",["מי שנוהג בעגלה רתומה לסוסים"],["העגלון הצליף בסוסים והכרכרה יצאה לדרך.","העגלון הוביל את הנוסעים מהתחנה לכפר."]],["עוֹל",["כלי רתמה לבהמות עבודה, שני מוטות המחוברים ביתדות לעורף הבהמה"],["האיכר הניח את העול על צווארי השוורים.","השוורים משכו את המחרשה, כשהעול כבד על צווארם."]],["עִישֵּׂב",["הוציא (בידיים) עשבים שוטים (נִיכּוּש - הוצאת עשבים בעזרת מַכּוֹש)"],["כל יום שישי היא עישבה את הגינה.","צריך לעשב את הערוגות לפני שהעשבים יחנקו את הירקות."]],["עַל רֶגֶל אַחַת",["בצורה קצרה ומתומצתת, ביעף"],["הסבר לי על רגל אחת מה ההבדל בין שני המושגים.","הוא הציג את התוכנית על רגל אחת בתוך חמש דקות."]],["עָלַב",["העליב, פגע"],["המילים הקשות שלו עלבו בה.","הוא לא התכוון לעלוב באיש."]],["עָמַד עַל טִיבוֹ",["חקר את אופיו של משהו וגיבש את דעתו עליו, תהה על קנקנו"],["לפני שהעסיק אותו, המנהל עמד על טיבו.","קשה לעמוד על טיבו של אדם בפגישה אחת."]],["עֲקַלְקָל",["שאינו ישר, מפותל"],["הדרך העקלקלה עלתה אל ראש ההר.","הוא ענה בתשובה עקלקלה ולא ברורה."]],["עֲרוּגָה",["תלולית אדמה מוארכת בה זורעים זרעים או שותלים שתילים בגינה"],["סבא שתל עגבניות בערוגה שבחצר.","הגננת והילדים זרעו צנוניות בערוגות."]],["פּוֹרֶה",["שמניב הרבה פרי, שנותן תפוקה גדולה, יעיל"],["האדמה בעמק פורייה מאוד.","הסופר הפורה פרסם שלושה ספרים בשנה אחת."]],["פְּלָצוּר",["חבל ארוך עם לולאה בקצה המשמש את הבוקר ללכידת סוסים, לָאסוֹ"],["הבוקר השליך את הפלצור ולכד את הסוס הבורח.","בתחרות הרודאו הציגו הרוכבים את כישוריהם בפלצור."]],["פְּתַלְתְּל",["שאינו ישר, מפותל","הפכפך, ערמומי","מסובך להבנה, מורכב"],["הכביש הפתלתל עלה אל הכפר שבהר.","הוא פוליטיקאי פתלתל שאי אפשר לדעת מה הוא מתכנן."]],["צִי",["קבוצת אוניות בעלות ייעוד משותף"],["צי של ספינות מלחמה עגן בנמל.","לחברת התעופה יש צי של חמישים מטוסים."]],["צִיר",["מיץ, רוטב","שליח, מיופה כוח, מעין שגריר"],["היא הוסיפה את ציר הבשר לאורז.","ציר המדינה בפריז נפגש עם שר החוץ הצרפתי."]],["צְנִים",["טוסט, קלי"],["לארוחת בוקר אכלנו צנים עם חמאה וריבה.","הוא הגיש לילדים צנימים עם גבינה."]],["קוֹצֶר רוּחַ",["חוסר (קצר ב) סבלנות"],["הנוסעים הביעו קוצר רוח כשהטיסה התעכבה.","הוא חיכה בקוצר רוח לתוצאות הבחינה."]],["קִידָּה",["השתחוות קלה"],["השחקנים קדו קידה בסוף ההצגה.","התלמיד קד קידה קלה מול המורה."]],["קֶלַח",["פרי התירס","קלח תירס, אשכול התירס שבו מצויים הגרגרים","זרם, שטף"],["בקיץ אנחנו אוכלים קלחי תירס על האש.","קלח מים זרם מהצינור השבור."]],["קְלִישָאַה / קְלִישָה",["רעיון נדוש ושחוק שכבר הועלה פעמים רבות בעבר והספיק לאבד מעוצמתו"],["הנאום היה מלא קלישאות על אחדות ושלום.","הסרט נשען על קלישאה של גיבור יחיד שמציל את העולם."]],["קָמִין",["תנור, אח"],["בחורף הם ישבו ליד הקמין ושתו תה.","באולם הגדול בערה אש בקמין."]],["קִנְטֵר",["לגלג, הרגיז"],["הנער קינטר את אחיו הקטן עד שבכה.","הם קינטרו אותה על המבטא שלה."]],["קְשֵׁה לֵב",["חסר רחמים, אכזרי","חצוף, חסר בושה, גס רוח","עקשן"],["השליט קשה הלב לא ריחם על האסירים.","הילד קשה הלב לא הסכים להתנצל."]],["רוֹחַב יָד / לֵב",["נדיבות"],["הם אירחו אותנו ברוחב לב.","התורם הפגין רוחב יד ותרם סכום גדול."]],["רִיפָּה אֶת יָדָיו",["החליש אותו מורלית (ההיפך מעודד אותו), ייאש אותו"],["הביקורת הקשה של המאמן ריפתה את ידי השחקנים.","אל תרפה את ידיו, הוא צריך עידוד עכשיו."]],["שְׂבָכָה",["מחיצת רשת, גדר"],["חלון הכלא היה מכוסה בשבכה מברזל.","בין החצרות הפרידה שבכה של רשת."]],["שַׁבְרִיר",["חלק קטן ביותר, קצת"],["לשבריר שנייה חשבתי שראיתי רוח רפאים.","הוא הצליח להבין רק שבריר ממה שנאמר."]],["שׁוֹבָךְ",["קן יונים בצורת תיבה"],["היונים חזרו אל השובך בערב.","על גג הבית הישן עמד שובך עץ."]],["שָׁחוּק",["נדוש, שדוף (כשנאמר על רעיון)","בלוי ומשומש, מרופט","עייף נפשית, מותש וחסר כוח"],["הבדיחה הזאת כבר שחוקה, כולם שמעו אותה.","הוא הגיע אחרי משמרת כפולה, שחוק ועייף."]],["שִׁחֵת",["השחית, הרס, חיבל"],["הוונדלים שיחתו את הפסלים בגן הציבורי.","השחיתות שיחתה את המערכת מבפנים."]],["שַׁחַת",["תבואה"],["הפרות אכלו שחת בחורף.","הם אספו את השחת מהשדה לפני הגשם."]],["שִׁדֵּל",["פיתה, ניסה לשכנע מישהו לעשות משהו בניגוד לרצונו ההתחלתי"],["הוא שידל את חברו להבריז מהשיעור.","המוכר ניסה לשדל אותה לקנות את השמלה היקרה."]],["שִׁיכּוּך",["ריכוך, הרגעה (משככי כאבים)"],["התרופה משמשת לשיכוך כאבים.","השיחה הרגועה תרמה לשיכוך המתח בין הצדדים."]],["שִׁכְתּוּב",["כתיבת חומר כלשהו בשנית בניסוח או סגנון טוב יותר"],["העורך ביקש שכתוב של הפרק הראשון.","אחרי השכתוב, המאמר נעשה ברור וקצר יותר."]],["שִׁלְהֵי",["סוף, סיום, בשלבים האחרונים"],["בשלהי הקיץ מתחילות הרוחות להתקרר.","הסופר כתב את ספרו האחרון בשלהי חייו."]],["שָׁלַח יָד בְּנַפְשוֹ",["התאבד, טָרָף נפש בכַפו"],["לפי הסיפור המקראי, שאול המלך שלח יד בנפשו בקרב על הר הגלבוע.","בסוף המחזה של שייקספיר, רומיאו שולח יד בנפשו."]],["שִׂמְחָה לְאֵיד",["שמחה על כשלונו של מישהו"],["לא הייתה בו שמחה לאיד כשיריבו נכשל, רק צער.","השכנים הביטו בשמחה לאיד בעסק המתחרה שנסגר."]],["שָׁפָל",["נבזה, מנוול","נמוך, קטן (שפל רוח - צנוע, רוחו \"קטנה\")"],["זה מעשה שפל לגנוב מקופת הצדקה.","הבית נבנה על קרקע שפלה ליד הנהר, ולכן הוצף בחורף."]],["שַׁרְלְטָן",["נוכל, רמאי"],["השרלטן מכר לאנשים תרופות פלא שלא עזרו לאיש.","התברר שהיועץ המפורסם הוא שרלטן בלי שום הכשרה."]],["תֶּבֶן",["סוג של קש המשמש כמאכל בהמות"],["החמור אכל תבן מהאבוס.","הם מילאו את המזרנים בתבן."]],["תָּדִיר",["שכיח, קורה לעתים קרובות (תדיר - בתדירות גבוהה) (להיפך: נדיר)"],["האוטובוס עובר כאן בתדירות גבוהה, כמעט כל חמש דקות.","הוא אורח תדיר בבית הקפה השכונתי."]],["תִּיעוּב",["סלידה, מאיסה"],["הוא הביט בתיעוב בחרקים שמילאו את המטבח.","דבריו הגזעניים עוררו תיעוב בקרב הקהל."]],["תַּסְמִין",["סימפטום, סימן היכר"],["חום גבוה ושיעול הם תסמינים של שפעת.","העלייה במחירים היא תסמין של משבר כלכלי עמוק."]],["תִּפְרַחַת",["מספר פרחים המחוברים יחדיו לאותו הגבעול, אשכול"],["לחרצית יש תפרחת צהובה במרכזה.","הדבורים התגודדו סביב תפרחות הלבנדר."]],["תַּתְרָן",["נטול חוש ריח. בהשאלה: חסר חוש הבחנה"],["הכלב שלנו תתרן, והוא לא מצליח לאתר את האוכל שלו.","בענייני אופנה הוא תתרן גמור ולא מבחין בין בגד יפה למכוער."]],["אֶבְרָה",["כנף של עוף"],["הנשר פרש את אברותיו ודאה מעל הבקעה.","הציפור הפצועה לא הצליחה להניע את אברתה."]],["אַדְוָה",["גל קטן"],["אדוות קטנות התפשטו במים כשזרקתי אבן לאגם.","הרוח הקלה יצרה אדוות על פני הבריכה."]],["אִוְושָׁה",["רחש קל, רשרוש"],["נשמעה אוושה של עלים ברוח.","אוושת השמלה שלה נשמעה כשעברה במסדרון."]],["אָזְלַת יָד",["חוסר אונים, חולשה, חוסר יכולת לבצע דבר מה"],["הממשלה הואשמה באוזלת יד בטיפול במשבר.","השוטרים עמדו באוזלת יד מול ההמון המשתולל."]],["אֲחִיזַת עֵינַיִים",["תרמית, הטעיה, הולכת שולל"],["הקוסם הציג אחיזת עיניים מרשימה והעלים מטבע באוויר.","ההבטחות לרווח מהיר התבררו כאחיזת עיניים."]],["אֵיכָה?",["איך? הכיצד?"],["איכה נפלו גיבורים?","איכה אספר לו את הבשורה הרעה?"]],["אִיכּוּל",["קורוזיה, הרס מתכת עקב התרכבות עם חמצן"],["האיכול החליש את גשר הברזל הישן.","צבעו את הגדר כדי להגן עליה מאיכול."]],["אִימּוּם",["תבנית בצורת כף רגל או גוף בעזרתה מייצרים נעליים או בגדים"],["הסנדלר הכניס אימום לתוך הנעל כדי לשמור על צורתה.","במפעל ההלבשה עבדו עם אימומים בגדלים שונים."]],["אֵימְתָנִי",["מפחיד, מאיים, מבהיל"],["כלב אימתני עמד בשער ונבח על כל עובר.","מבחן הכניסה נראה אימתני, אבל בסוף הוא היה קל."]],["אֵיפָה וְאֵיפָה",["אפליה, יחס לא שווה לשני אנשים שונים"],["המורה נהגה איפה ואיפה, והעדיפה את התלמידים הטובים.","העובדים התלוננו שההנהלה נוהגת איפה ואיפה בחלוקת הבונוסים."]],["אֵיתָן",["חזק ויציב, חסון"],["הגשר נבנה מבטון איתן שיחזיק מעמד מאות שנים.","למרות גילו, סבא עדיין איתן ובריא."]],["אֵיתָן בְּדַעְתוֹ",["עומד על דעתו, דבק בעמדתו, משוכנע בצדקתו"],["למרות הלחץ, השופט נשאר איתן בדעתו.","היא איתנה בדעתה ללמוד רפואה בחו״ל."]],["אָמַד",["העריך"],["השמאי אמד את הנזק לבית בכמה עשרות אלפי שקלים.","קשה לאמוד את מספר המשתתפים בהפגנה."]],["אַמַּת מַיִם",["תעלה המשמשת להעברת מים ממקום למקום"],["הרומאים בנו אמת מים שהובילה מים מהמעיינות לקיסריה.","שרידי אמת המים העתיקה נמצאים ליד החוף."]],["אֲנָקָה",["צעקה (לרוב כתוצאה מצער או כאב), גניחה"],["אנקה של כאב נפלטה מפיו כשנפל.","מבין ההריסות נשמעו אנקות הפצועים."]],["אֲפַרְכֶּסֶת",["החלק העליון בשפופרת הטלפון שאותו מצמידים לאוזן"],["היא הצמידה את האפרכסת לאוזנה והקשיבה.","באפרכסת נשמע קול חלש ומקוטע."]],["אִצְטַבָּה",["מדף, רף"],["הספרים הישנים סודרו על האצטבה העליונה.","הוא הרכיב אצטבה חדשה במטבח לתבלינים."]],["אַרְכָּה",["הארכת זמן, תוספת זמן"],["הסטודנט ביקש ארכה להגשת העבודה.","בית המשפט נתן לנאשם ארכה של חודש."]],["בְּדִיעֲבַד",["לאחר מעשה"],["בדיעבד, הבנתי שהיה ע
