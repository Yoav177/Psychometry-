דרך כלל חזיר) על ידי דקירה"],["לפי ההלכה, נחירה אינה כשרה.","בכפר הישן ביצעו נחירה של החזירים לפני החורף."]],["נִיר",["אחו, שדה שנחרש"],["החקלאי חרש את הניר.","בניר הירוק רעו הפרות."]],["נַכְלוּלִי",["רמאי, נוכל, מעורפל בכוונותיו"],["הוא איש נכלולי שאי אפשר לסמוך עליו.","החברה נקטה בשיטות נכלוליות כדי להתחמק מתשלום."]],["נָפָה",["כלי בעל נקבים קטנים לניפוי קמח, מסננת","אזור, אחוז"],["האופה ניפה את הקמח בנפה.","התושבים בנפת השרון יצביעו מחר."]],["נֵצֶר",["בן, צאצא","ענף רך הצומח מהשורש"],["הבן הוא נצר למשפחת רבנים ידועה.","נצר צעיר צמח מגזע העץ הכרות."]],["נָצַר",["שמר, הגן"],["הוא נצר את הסוד בלבו שנים.","נצור לשונך מרע."]],["נָשִׂיא",["ענן נושא גשם"],["נשיאים ורוח וגשם אין.","נשיאים כבדים נאספו מעל ההרים."]],["נֶשֶׁךְ",["ריבית"],["הבנק גבה נשך גבוה על ההלוואה.","התורה אוסרת לתת כסף בנשך."]],["נִשְפֶּה",["חלק ותלול"],["המטפסים נאחזו בצוק הנשפה.","הדרך הנשפה ירדה אל התהום."]],["סַד",["מכשיר עינוי קדום","לוח מיוחד המשמש לקיבוע ותמיכה באיבר פצוע"],["הרופא שם סד על הרגל השבורה.","במוזיאון מוצג סד ששימש לעינוי אסירים בימי הביניים."]],["סַהַר",["ירח, לבנה"],["אור הסהר האיר את השדה.","בליל הסהר יצאנו לטיול."]],["סְחִי",["אשפה, זוהמה, לכלוך"],["הרחובות היו מלאים סחי אחרי השביתה.","הם התייחסו אליו כאל סחי."]],["סֵיפָא",["סוף, החלק האחרון (להיפך: רֵישָא)"],["בסיפא של הסעיף נקבע חריג.","לא הבנתי את הסיפא של המשפט."]],["סְפּוֹרָדי",["בלתי סדיר, אקראי, ללא חוקיות קבועה"],["באזור נרשמו התקפות ספורדיות.","השמש הופיעה רק באופן ספורדי במשך היום."]],["סְפָר",["גבול, קצה, רצועת אדמה החוצצת בין מדינות (ישובי ספר - ישובי גבול)"],["יישובי הספר סבלו מירי.","הם הקימו קיבוץ בספר המדבר."]],["סְתַגְּלָן",["מי שמתאים עצמו בקלות למצבים חדשים, אדפטיבי"],["הוא סתגלן שמסתדר בכל מקום עבודה.","הילדים סתגלנים יותר מהמבוגרים."]],["עָב",["ענן"],["עבים כבדים כיסו את השמיים.","השמש יצאה מבין העבים."]],["עֲבוֹתוֹת",["חבלים עבים"],["הספינה נקשרה לרציף בעבותות.","הם קשרו את המשא בעבותות."]],["עֲזוּבָה",["מצב של הרס והזנחה"],["הבית עמד בעזובה שנים.","העזובה בגן הציבורי הדאיגה את התושבים."]],["עֲלוּמִים",["ימי הנעורים"],["בימי עלומיו טייל בכל העולם.","היא נזכרה בעלומיה בקיבוץ."]],["עֲלָטָה",["חושך, אפלה"],["הגנבים פרצו לחנות בחסות העלטה.","בעלטה לא ראינו דבר."]],["עָשָׂה נְפָשׁוֹת",["גייס תומכים למשהו"],["הפעילים עשו נפשות לקידום החוק.","הוא עשה נפשות למען המועמד."]],["פּוּלְמוּס",["ויכוח, מחלוקת"],["המאמר עורר פולמוס סוער בעיתונות.","הפולמוס בין המדענים נמשך שנים."]],["פּוּר",["מזל, גורל"],["הפור נפל, והוא נבחר לתפקיד.","חג פורים נקרא על שם הפור שהטיל המן."]],["פּוּרְתָּא",["מעט, קצת (נחמה פּוּרְתָּא - נחמה מועטה)"],["נחמה פורתא היא שלפחות הוא לא נפצע.","הוא התעכב פורתא לפני שענה."]],["פִּיד",["אסון, צרה"],["פידו של העם הגיע כשפרצה המלחמה.","השמחה לפידו של אויב אינה מכובדת."]],["פִּיל לָבָן",["כינוי לפרויקט ענק שהושקע בו רבות אך אין בו שימוש"],["האצטדיון הענק הפך לפיל לבן.","התושבים מתחו ביקורת על הפיל הלבן שבנתה העירייה."]],["פִּילֵּל",["ציפה, קיווה"],["לא פיללתי שהוא יצליח כל כך.","היא לא פיללה שתזכה בפרס."]],["פִּיסֵח",["צולע"],["החתול הפיסח הסתובב בחצר.","מאז התאונה הוא פיסח ברגלו."]],["פַּרְגּוֹד",["סוג של מחיצה ניידת"],["הרופא ביקש מהמטופל לעמוד מאחורי הפרגוד.","פרגוד הפריד בין מיטות החולים."]],["פְּרוֹלוֹג",["מבוא, הקדמה (להיפך: אפילוג)"],["בפרולוג של המחזה המקהלה מציגה את הדמויות.","הנאום היה פרולוג לשינויים הגדולים."]],["פִּתְחוֹן פֶּה",["אפשרות לומר דבר מה, הזדמנות לטעון משהו"],["אסור לתת להם פתחון פה להאשים אותנו.","הוא ביקש פתחון פה כדי להסביר את עצמו."]],["צְבִיר",["קבוצה (צביר עננים - קבוצת עננים)"],["צביר כוכבים נראה בטלסקופ.","צביר של עננים כיסה את ההרים."]],["צְדִיָּה",["כוונה רעה, זדון"],["בית המשפט קבע שהמעשה נעשה בצדייה.","לא הייתה בדבריו צדייה, רק טעות."]],["צַדְקָנוּת",["תכונתו של הצדקן, גלגול עיניים"],["הצדקנות שלו מעצבנת את כל חבריו.","נמאס לי מהצדקנות של השכנה."]],["צָמִיג",["סמיך, דביק"],["הדבש הצמיג נזל לאט מהכף.","שמן המנוע נעשה צמיג בקור."]],["צִקְצוּק",["קול הנוצר על ידי הנעת הלשון בין השיניים לחניכיים (לרוב מציין חוסר אישור או שלילה)"],["הוא ציקצק בלשונו כשראה את הציון.","הצקצוק של הסבתא הביע אי שביעות רצון."]],["צָרוּף",["מזוקק, ברור וטהור (תענוג צרוף - הנאה מוחלטת)"],["הוא עשה זאת מתוך אהבה צרופה.","התבונה הצרופה שלה הרשימה את כולם."]],["צָרַר",["קשר יחד לחבילה","התנכל, התנהג באיבה כלפי מישהו, היה אויבו (צר - אויב)"],["היא צררה את הבגדים בשמיכה.","השכנים צררו לו מאז הריב."]],["קְבָסְתָּן",["טרחן, מישהו שמעורר בחילה וגועל"],["הלקוח הקבסתן לא הפסיק להתלונן.","השכן הקבסתן חיטט בכל מה שעשינו."]],["קוֹבַע",["קסדה"],["החיילים חבשו קובע.","הלוחם הסיר את הקובע אחרי הקרב."]],["קוֹלָן",["מכשיר המשמש לכיוון כלי נגינה"],["הנגן כיוון את הפסנתר בעזרת קולן.","המורה השמיעה צליל מהקולן לפני השיר."]],["קִטְרֶג",["האשים, הביא לדין"],["התובע קיטרג על הנאשם בחומרה.","השטן קיטרג על איוב."]],["קִיקְיוֹנִי",["זמני, ארעי"],["הממשלה הקיקיונית נפלה אחרי חודש.","הם הקימו מבנה קיקיוני לקראת הפסטיבל."]],["קָלוֹן",["בושה, חרפה (אות קלון - סימן גנאי)"],["הפרשה המיטה קלון על המשפחה.","הוא הורשע בעבירה שיש עמה קלון."]],["קְלוֹקֵל",["שטיבו גרוע, איכותו ירודה"],["המכונה הקלוקלת התקלקלה שוב.","הוא כתב חיבור קלוקל ומלא שגיאות."]],["קִלֵּס",["הילל, שיבח","קִילֵל, לעג, השפיל, ביזה"],["המבקרים קילסו את ההופעה.","הילדים קילסו את הזקן שנפל."]],["קַנְטְרָן",["סכסכן, נוהג להתגרות ולהרגיז"],["הקנטרן בכיתה תמיד מחפש עם מי לריב.","אל תהיה קנטרן, תן לאחותך לשחק בשקט."]],["קִנְיָן",["רכוש, נכס"],["הבית הזה הוא הקניין היקר ביותר של המשפחה.","הידע שרכש בלימודים הוא קניין שאיש לא יוכל לקחת ממנו."]],["קַפֶּנְדַרְיָא / קַפַּנְדְּרִיָּה",["דרך קיצור"],["הילדים עשו קפנדריא דרך הגינה של השכנים.","אין קפנדריא להצלחה, צריך לעבוד קשה."]],["קַרְדּוֹם",["מכשיר לחטיבת עצים, גרזן"],["החוטב הניף את הקרדום וביקע את הבול.","אל תעשה מהתורה קרדום לחפור בו."]],["קַרְפִּיף",["שטח מגודר"],["הרכבים הישנים הושארו בקרפיף מאחורי המוסך.","העירייה גידרה קרפיף לאחסון ציוד."]],["רְבָב",["כתם, פגם, מום מוסרי (ללא רבב - מושלם)"],["השופטת ידועה כאישה ללא רבב.","החולצה הלבנה נשארה נקייה מכל רבב."]],["רָבִיד",["שרשרת לצוואר, תליון"],["היא ענדה רביד זהב על צווארה.","החתן העניק לכלה רביד פנינים."]],["רָגַן",["התלונן"],["העם רגן במדבר על המחסור במים.","העובדים רגנו על השכר הנמוך."]],["רַהַב",["התרברבות, גאווה"],["ברהב גדול הוא הבטיח לנצח את כולם.","הרהב של הקבוצה נשבר אחרי ההפסד."]],["רָהוּי",["הססני, חסר בטחון"],["התלמיד הרהוי לא העז להרים את היד.","היא ענתה בקול רהוי."]],["רֵישָא",["התחלה, החלק הראשון (להיפך: סֵיפָא)"],["ברישא של החוזה מופיעים פרטי הצדדים.","ברישא המשפט נראה פשוט, אבל בסופו הסתתר מלכוד."]],["רַכָּב",["עֶגְלוֹן, \"נהג\" של כרכרה"],["הרכב הצליף בסוסים והכרכרה יצאה לדרך.","הרכב עצר מול הארמון."]],["רִנֵּן",["ריכל","שר"],["השכנים רננו על הזוג החדש.","הציפורים רננו עם שחר."]],["רַפְרֶפֶת",["סוג של קינוח אוורירי, פודינג"],["לקינוח הוגשה רפרפת שוקולד.","הילדים אהבו את רפרפת הווניל של סבתא."]],["רָצַץ",["שבר, ריסק, ניפץ"],["האבן רצצה את המכונית שחנתה מתחת לצוק.","המכה רצצה את גולגולת הנחש."]],["רָקַח",["הכין תרופה או ריבה (מרקחת - ריבה, מרקחה - בֹּשֶׂם)","המציא (סיפור לא אמיתי), הכין תכנית (בהקשר שלילי)"],["סבתא רקחה ריבת תותים.","השניים רקחו תוכנית לגנוב את התכשיטים."]],["רָש",["עני"],["הרש לא יכול היה לקנות אוכל לילדיו.","עשירים ורשים חיו באותה שכונה."]],["שִׁגָיוֹן",["מחשבה שאינה מרפה"],["השיגיון לטוס לחלל לא הרפה ממנו.","הוא נסחף אחרי שיגיון ובזבז את כל כספו."]],["שִׁהוּי",["עיכוב, איחור"],["השיהוי בטיפול בתלונה פגע בלקוחות.","בית המשפט דחה את הערעור בשל שיהוי."]],["שׁוֹחֵר",["חובב, מתעניין ב-, (למשל: שוחר מדע)","נאמן, ידיד (למשל: שוחר שלום)"],["הוא שוחר תרבות ומבקר בכל תערוכה.","כשוחר שלום, הוא הקדיש את חייו לפיוס."]],["שׁוֹעַ",["בעל הון, עשיר"],["השועים של העיר ישבו בשורה הראשונה.","הוא מתחכך עם שועי עולם."]],["שִׁוֵּעַ",["התחנן, זעק","היה זקוק למשהו נואשות"],["הנפגעים שיוועו לעזרה.","בית הספר הישן שווע לשיפוץ."]],["שָׁזַף",["ראה, הביט","שרף, צרב"],["עין לא שזפה את המקום הזה מאות שנים.","השמש שזפה את פני הקוצרים."]],["שָׁחוּחַ",["כפוף"],["הזקן הלך שחוח ונשען על מקל.","העצים השחוחים נכפפו ברוח."]],["שָׁחוּן",["חם ויבש"],["החורף השחון הדאיג את החקלאים.","ביום שחון כזה כדאי לשתות הרבה."]],["שַׁחַל",["אריה צעיר"],["השחל הצעיר ניסה לצוד לבדו.","הלוחמים יצאו לקרב כשחלים."]],["שִׁיפּוּי",["ליטוש והחלקה של דבר מה בעזרת שופין, השחזה","תשלום כספי (לרוב כפיצוי)"],["לפני הצביעה ביצעו שיפוי של הדלת.","הוא קיבל שיפוי על הנזק לרכבו."]],["שְׂכַלְתָן",["אדם שחיי את חייו על פי השכל וההיגיון במקום רגשות או אמונות, רציונליסט"],["השכלתן לא האמין באמונות טפלות.","כשכלתנית, היא שוקלת כל החלטה בהיגיון."]],["שָׁנָה",["עשה משהו שוב ושוב, חזר על פעולה מסוימת","למד, שינן"],["הוא שנה על אותה טעות פעמיים.","התלמיד שנה את הפרק עד שידע אותו בעל פה."]],["שְׁנִיוֹנִי",["בעל חשיבות פחותה מעט מדבר אחר שהוא החשוב ביותר, משני"],["הנושא הזה שניוני, בואו נתמקד בעיקר.","המלון המרכזי מלא, אז הזמנו מקום שניוני."]],["שִׁסֵּעַ",["קָּרָע (שִׁסֵּעַ את דברי חברו - קטע את דברי חברו)"],["הוויכוח שיסע את המפלגה לשני מחנות.","הוא שיסע את דבריה באמצע המשפט."]],["שַׁעַל",["פסיעה, צעד"],["אין לו אפילו שעל של אדמה.","הם התקדמו שעל אחר שעל."]],["שְׁתַדְלָן",["מי שמנסה לשכנע אנשים לעשות דבר מה"],["השתדלן ניסה לשכנע את חברי הכנסת לתמוך בחוק.","החברה שכרה שתדלן כדי לקדם את האינטרסים שלה."]],["תַּאֲנִיָּה וַאֲנִיָּה",["בכי מר על אסון"],["בעיר שררו תאניה ואניה אחרי האסון.","הקינה מתארת תאניה ואניה על החורבן."]],["תּוֹעַמְלָן",["מי שעוסק בתעמולה, מי שמפיץ מסרים ברבים"],["התועמלן נאם בכיכר בפני קהל גדול.","התועמלנים של המפלגה הפיצו כרזות בכל העיר."]],["תִּחוּחַ",["פירור האדמה בעזרת כלי כלשהו"],["הגנן ביצע תיחוח של האדמה סביב השתילים.","התיחוח מאפשר למים לחלחל לשורשים."]],["תִּיתוֹרָה / תִּיתוֹרֶת",["שולי הכובע, שוליים בולטים של חפץ כלשהו"],["הכובע היה בעל תיתורה רחבה שהגנה מפני השמש.","הוא נגע בתיתורת הכובע לאות שלום."]],["תַּכְרִיכִים",["בדים לבנים בהם עוטפים את המתים לפני הקבורה"],["לפי המנהג, הנפטר נקבר בתכריכים.","בתערוכה הוצגו שרידי תכריכים מן העת העתיקה."]],["תִּכְתּוֹבֶת",["השם לכלל המכתבים שנשלחו מאיש לרעהו","החלפת מכתבים הדדית בין אדם למוסד כלשהו"],["התכתובת בין שני המדענים פורסמה בספר.","בתיק נמצאה תכתובת ענפה עם העירייה."]],["תִּלֵי תִּילִים",["שפע רב"],["על כל אות בתורה ניתן לדרוש תילי תילים של הלכות.","הוא כתב תילי תילים של מכתבים."]],["תְּמוּרָה",["שינוי, מפנה, תהפוכות"],["המהפכה הביאה תמורות גדולות בחיי העם.","בשנים האחרונות חלו תמורות בשוק העבודה."]],["תַּמְלִיל",["טקסט"],["הזמר כתב את התמליל והמלחין כתב את המנגינה.","התמליל של ההרצאה פורסם באתר."]],["תְּנוּבָה",["יבול, תוצרת חקלאית"],["תנובת השדות השנה הייתה גבוהה.","השוק מלא בתנובה טרייה מהמשקים."]],["תְּעוּדַת עֲנִיוּת",["עדות לחוסר יכולת"],["הכישלון בפרויקט הוא תעודת עניות למנהלים.","זו תעודת עניות למערכת שאינה מסוגלת לטפל בבעיה."]],["תִּעֵל",["הפנה לאפיק מסוים, כִּיוֵן","חפר תעלות לניקוז או השקיה"],["המורה תיעלה את האנרגיה של התלמידים לפעילות יצירתית.","החלוצים תיעלו את הביצות כדי לייבש אותן."]],["תַּעַל",["רפואה"],["אין תעל למכה הזאת.","הם חיפשו תעל לכאב."]],["תַּשׁ",["הפך לחלש, התעייף"],["כוחו של הרץ תש לקראת הקילומטר האחרון.","הוויכוח נמשך עד שכוחם תש."]],["תַּשְׁלִיל",["סרט צילום ממנו מפיקים את התמונות, נגטיב"],["הצלם פיתח את התשליל בחדר החושך.","הם מצאו אלבום ישן עם תשלילים של תמונות משפחתיות."]],["אִבְחָה",["ברק, נצנוץ","תנופה/הנפה מהירה של חרב"],["אבחת ברק האירה את השמיים.","באבחת חרב אחת הכריע הלוחם את יריבו."]],["אֶבֶן הָרֹאשָׁה",["מרכזי, חיוני","האבן שבמרכז הקשת (בבנין)"],["התוכנית הזאת היא אבן הראשה של המדיניות החדשה.","הבנאי הניח את אבן הראשה בראש הקשת."]],["אֶבֶן נֶגֶף",["מכשול, הפרעה (נגף - מחלה)"],["חוסר האמון בין הצדדים היה אבן נגף בשיחות.","הבירוקרטיה היא אבן נגף לעסקים קטנים."]],["אֶבֶן פִּינָּה",["דבר יסודי, עיקרי","אבן שמניחים ביסוד בניין חדש"],["החינוך הוא אבן פינה בכל חברה.","ראש העירייה הניח את אבן הפינה לבית הספר החדש."]],["אֶבֶן שׁוֹאֶבֶת",["מגנט","מוקד משיכה, מוקד התעניינות המושך תשומת לב"],["העיר העתיקה היא אבן שואבת לתיירים.","המגנט, או אבן השואבת, משך אליו את המסמרים."]],["אֶבֶן שָׂפָה",["האבנים שבשולי הכביש, תחילת המדרכה"],["הנהג פגע באבן השפה בזמן החנייה.","העירייה צבעה את אבני השפה באדום ולבן."]],["אַגַּב אוֹרְחָא",["דרך אגב"],["אגב אורחא, הוא הזכיר שהוא מתחתן.","הנושא עלה בשיחה אגב אורחא."]],["אִדְרָה",["עצם של דג"],["הילד נחנק מאדרה של דג.","צריך להוציא את כל האדרות לפני הגשת הדג לילדים."]],["אוֹטוֹקְרַטְיָה",["שלטון יחיד"],["במדינה שלטה אוטוקרטיה במשך עשרות שנים.","העם התקומם נגד האוטוקרטיה."]],["אוּנְקְיָה",["יחידת משקל, כ- 29 גרם"],["לפי המתכון, יש להוסיף אונקיה של חמאה.","הזהב נמכר לפי מחיר לאונקיה."]],["אָזַר מָתְנָיו / חַלְצָיו / חַיִל",["התכונן למאבק (אזר - התמלא)"],["התלמידים אזרו כוח לקראת הבחינות.","העובדים אזרו חיל ונאבקו על זכויותיהם."]],["אַחֲרִית",["קץ, סוף, סיום"],["באחרית הספר מתגלה הסוד.","באחרית ימיו חזר לכפר הולדתו."]],["אִיטֵּר (יַד יְמִינוֹ)",["שמאלי"],["הוא איטר יד ימינו וכותב ביד שמאל.","לשחקן טניס איטר יש יתרון מול יריבים רבים."]],["אַמְתַּחַת",["תיק, תרמיל, ילקוט, שק, נרתיק, ארנק"],["הוא הוציא מאמתחתו רעיון חדש.","המטייל שם באמתחתו לחם ומים."]],["אַסְפַּקְלַרְיָה",["נקודת מבט, נקודת השקפה","מַרְאָה"],["הסופר מביט על החברה מבעד לאספקלריה של ילד.","ההיסטוריון מציג את האירועים באספקלריה חדשה."]],["אָפוּף",["מוקף, עטוף"],["ההר היה אפוף ערפל.","הפרשה אפופה מסתורין."]],["אַפִּרְיוֹן",["כינוי לבית הקדש","חופה עשויה אריג, המשמשת בעיקר לקישוט","מושב כבוד שמעליו חופה ועליו נשאו בימי קדם אנשים נכבדים"],["המלך נישא באפריון על כתפי עבדיו.","הכלה ישבה מתחת לאפריון מקושט בפרחים."]],["אָצַר",["העלים, החביא, הסתיר","שמר","הכיל בתוכו, נשא בחובו, החזיק, הכיל"],["הגנב אצר את התכשיטים בכספת.","הספר אוצר בתוכו חוכמה רבה."]],["אֲרוֹמָה",["ניחוח, ריח קל"],["ארומה של קפה טרי מילאה את המטבח.","לתבשיל הייתה ארומה של תבלינים."]],["ארַֹח",["אופן התנהגות, דרך חיים, הליכות"],["ארח החיים הכפרי שקט ורגוע.","הם שמרו על ארח החיים המסורתי."]],["אַרְכֻּבָּה",["בֶּרֶך","ידית כפופה בצורת ברך המשמשת להפעלת מכונה/מנוע"],["הוא נפל ושרט את ארכובתו.","הנהג סובב את הארכובה כדי להתניע את הרכב הישן."]],["אֲרֶשֶׁת (פָּנִים)",["הבעת פנים"],["ארשת פניה הביעה אכזבה.","הוא נכנס לחדר בארשת רצינית."]],["אַשְׁמַאי",["חוטא (לרוב בהקשר של חטא מיני)"],["המטיף כינה את חוטאי העיר אשמאים.","במחזה הישן מופיע אשמאי שנענש על חטאיו."]],["בַּד",["קורת עץ המשמשת לכתישת זיתים (בית בד - מקום בו כותשים את הזיתים)","ענף, זרד, חוטר"],["את הזיתים כתשו בקורת הבד.","הם אספו בדים יבשים להבערה."]],["בְּחֵרוּק שִׁינַּיִים",["בזעם וברוגז תוך איפוק עצמי, בקושי"],["הוא קיבל את ההחלטה בחירוק שיניים.","בחירוק שיניים הם הסכימו לפשרה."]],["בְּיֶתֶר שְׂאֵת",["בעוצמה רבה יותר"],["אחרי ההפסקה, הגשם חזר ביתר שאת.","המחאות נמשכו ביתר שאת."]],["בִּכְפִיפָה אַחַת",["ביחד, באותו המקום"],["הם לא יכולים לחיות בכפיפה אחת.","חתול וכלב גרים אצלנו בכפיפה אחת."]],["בִּלְתִּי אֶמְצָעִי",["ללא תיווך, ישיר"],["היא לא הייתה מעורבת באופן בלתי אמצעי בעסקה.","בני הזוג זקוקים לתקשורת בלתי אמצעית."]],["בִּלְתִּי נִדְלֶה",["שאינו נגמר, אינסופי"],["לילדים יש אנרגיה בלתי נדלית.","הים הוא מקור השראה בלתי נדלה."]],["בְּמֵישָׁרִין",["באופן ישיר ללא תיווך, בלי הקדמות, ישר ולעניין"],["הוא פנה אליה במישרין ושאל מה קרה.","ההחלטה נוגעת במישרין לתלמידים."]],["בְּעוֹד מוֹעֵד",["בזמן, לא מאוחר מידי (מבעוד מועד - מספיק זמן לפני, לא ברגע האחרון)"],["הוא הגיע לתחנה בעוד מועד.","כדאי לבטל את ההזמנה בעוד מועד."]],["בַּצַּר לוֹ",["בזמן מצוקתו"],["בצר לו, פנה אל אחיו לעזרה.","בצר לה, היא התפללה."]],["גָּאָה",["עָלַה, התרומם"],["מפלס הנהר גאה אחרי הגשמים.","הים גאה ושטף את החוף."]],["גֵּב",["גומה באדמה או בסלע שבה נקווים מי גשמים"],["מי הגשם נקוו בגבים שבסלע.","הצבאים שתו מהגב."]],["גֹּב",["בּוֹר, מאורה (גוב אריות - מאורת האריות)"],["דניאל הושלך לגוב האריות.","השועל יצא מן הגוב בלילה."]],["גִּבֵּן",["בעל חטוטרת, אדם שגבו מעוקם"],["הגיבן מנוטרדאם הוא דמות מפורסמת בספרות.","הזקן הגיבן הלך לאט."]],["גִּינּוּי",["מתיחת ביקורת על מעשה כלשהו"],["המדינות פרסמו גינוי חריף לתקיפה.","מעשיו זכו לגינוי מכל הצדדים."]],["גָּלְמִי / גּוֹלְמִי",["במצבו הטבעי לפני שעבר עיבוד, ראשוני","ברוטו"],["המפעל קונה חומרי גלם ומייצר מהם מוצרים.","זו טיוטה גולמית שעדיין צריכה עריכה."]],["גַּרְדוֹם",["במה עליה מוציאים להורג (טעות נפוצה: קַּרְדוֹם - גרזן)"],["הנידון הובל לגרדום.","הגרדום נבנה בכיכר העיר."]],["גָרוּם",["רזה מאוד, בעל עצמות בולטות"],["הסוס הגרום לא יכול היה לשאת משא.","אחרי המחלה הוא נראה גרום וחלש."]],["דְּאָבוֹן",["צער גדול"],["הוא מת לדאבון לב כל מכריו.","לדאבוננו, האירוע בוטל."]],["דוֹמֶן",["זבל אורגני (בעיקר צואה של אדם או בעל חיים)"],["בספר ירמיהו מתוארות גופות המושלכות כדומן על פני השדה.","הנחל זוהם בדומן מהרפת."]],["הִבְכִּיר",["הבשיל בתחילת העונה"],["עצי התאנה הבכירו השנה.","הענבים הבכירו בגלל החום."]],["הֲוָיָה",["מציאות, ממשות"],["המלחמה הפכה לחלק מההוויה היומיומית.","ההוויה של העיר הגדולה שונה מאוד מזו של הכפר."]],["הוֹלֵל",["החי חיי הוללות/שובבות לא מוסרית, החי את הרגע ומרבה בתענוגות ובבילויים פרועים"],["בנעוריו היה הולל שבילה כל לילה במסיבות.","הנסיך ההולל בזבז את הון אביו."]],["הֵחִישׁ (אֶת) צְעָדָיו / פְּעָמָיו",["הגביר את קצב הליכתו, מיהר"],["כששמע את הרעם, החיש את צעדיו.","היא החישה את פעמיה הביתה."]],["הֶחְרִישׁ",["שתק, נאלם, דמם","השתיק, גרם לדממה"],["הוא החריש כששאלו אותו על האירוע.","צעקת המורה החרישה את הכיתה."]],["הִכָּה בְּאֶצְבַּע צְרֵדָה",["השמיע נקישה בעזרת האמה והאגודל"],["הוא היכה באצבע צרדה כדי לקרוא למלצר.","הרקדנית היכתה באצבע צרדה לקצב המוזיקה."]],["הִכְפִּישׁ",["דיבר בגנות"],["המתחרה הכפיש את שמו בעיתונות.","אסור להכפיש אנשים ברשתות החברתיות."]],["הָלַך בְּדֶרֶך כָּל בָּשָר / הָאָרֶץ",["מת, נפטר"],["הסופר הלך בדרך כל בשר בגיל תשעים.","כולנו נלך יום אחד בדרך כל הארץ."]],["הִסְכִּין",["התרגל, הסתגל"],["הוא הסכין לחיים בעיר הגדולה.","העין הסכינה לחושך."]],["הֶעֱלָה עַל נֵס",["פרסם, הפך דבר למופת, ציין לטובה"],["המורה העלתה על נס את מעשיו של התלמיד.","הספר מעלה על נס את גבורת הלוחמים."]],["הָפַךְ אֶת עוֹרוֹ",["שינה את דרך התנהגותו מקצה לקצה"],["הפוליטיקאי הפך את עורו ועבר למפלגה היריבה.","הנער הפרוע הפך את עורו ונעשה תלמיד מצטיין."]],["הִרְכִּין",["כפף, הטה כלפי מטה"],["התלמיד הרכין את ראשו בבושה.","העצים הרכינו את ענפיהם תחת כובד השלג."]],["הִשְׁלִיך נַפְשׁוֹ מִנֶּגֶד",["סיכן את חייו בשביל משהו שהאמין בו"],["החייל השליך נפשו מנגד כדי להציל את חבריו.","הכבאים השליכו נפשם מנגד בשריפה."]],["הִתְגַּלֵּעַ רִיב",["הסתכסכו, התקוטטו, התעמתו"],["בין השכנים התגלע ריב על החניה.","בין השותפים התגלע ריב על חלוקת הרווחים."]],["הִתְוָוה",["תכנן בקווים כלליים מבלי להיכנס לדקויות","שרטט, רשם, סימן"],["הממשלה התוותה מדיניות חדשה.","המהנדס התווה את קווי הכביש על המפה."]],["הִתְנַגֵּחַ",["ניהל ויכוח תקיף וחריף","כשנאמר על בעל חיים: נאבק בעזרת קרניו"],["השרים התנגחו בישיבת הממשלה.","שני האיילים התנגחו בקרניהם."]],["הִתְרִיס",["מחה, התנגד"],["הסטודנטים התריסו נגד העלאת שכר הלימוד.","הוא התריס כלפי המנהל מול כולם."]],["זֵד",["רשע, זדון"],["הזדים יבואו על עונשם.","המעשה נעשה בזדון על ידי אדם זד."]],["חָבוּש",["מי שיש לו כיסוי על הראש","כלוא, אסור","מי ששמו עליו תחבושת"],["הוא הלך ברחוב חבוש כובע רחב.","האסיר ישב חבוש בכלא שנים."]],["חִדָלוֹן",["חורבן, הרס"],["המלחמה הביאה חידלון על האזור.","הם מרגישים תחושת חידלון מאז המשבר."]],["חוּט הַשָּׁנִי",["קו יסודי החוזר ונשנה לאורכו של עניין כלשהו"],["הגעגוע למולדת הוא חוט השני שעובר בכל שיריו.","חוט השני בעדויות הוא הפחד."]],["חַט",["שן השנהב הבולטת של הפיל"],["הציידים הרגו פילים בשביל החטים שלהם.","המסחר בחטי שנהב אסור."]],["חֲטוֹטֶרֶת",["גִבְנוּן בליטה בגב, דבשת"],["לגמל יש חטוטרת על הגב.","הזקן סבל מחטוטרת."]],["חֹסֶן",["כֹּח"],["החוסן הלאומי נבחן בזמן המלחמה.","הספורטאי הפגין חוסן נפשי אחרי הפציעה."]],["חֲסַר פְּנִיּוֹת",["אובייקטיבי, הגון, לא משוחד"],["הבורר היה חסר פניות ולא העדיף אף צד.","צריך ועדה חסרת פניות שתבדוק את הפרשה."]],["חֲפָתִים",["כפתורים לרכיסת קצה השרוול","כינוי לקפל בשרוול","החלק הקיצוני בשרוול"],["הוא ענד חפתים מזהב לחתונה.","השרוולים עם החפתים היו מגוהצים."]],["חָרוֹן (אַף)",["כעס, זעם"],["המלך התמלא חרון אף כששמע על המרד.","חרון הציבור הופנה כלפי הממשלה."]],["חַת",["נבהל, התמלא פחד"],["הוא לא חת מפני האיום.","אל תחת מן האויב."]],["טֶלֶף",["פרסה"],["הפרה דרכה בטלפיה בבוץ.","לבעלי חיים כשרים יש טלף שסוע."]],["טְרַנְסְפוֹרְמַצְיָה",["שינוי צורה, שינוי תכונות"],["העיר עברה טרנספורמציה מכפר קטן למטרופולין.","הזחל עובר טרנספורמציה והופך לפרפר."]],["יָצוּל",["מוט בקצה של מחרשה או עגלה שרותמים אליו את הבהמה"],["האיכר קשר את השור ליצול המחרשה.","היצול של העגלה נשבר."]],["כָּל אֵימַת שֶׁ -",["בכל זמן ש-"],["כל אימת שהוא מגיע, הוא מביא מתנה.","כל אימת שיורד גשם, הרחוב מוצף."]],["כְּפִיפוּת",["מצבו של מי שנמצא תחת סמכותו ופיקודו של אחר"],["העובדים נמצאים בכפיפות למנהל המחלקה.","החוק קובע כפיפות של הצבא לממשלה."]],["כֹּפֶר",["תשלום שנדרשים לשלם על מנת להציל חיי אדם"],["החוטפים דרשו כופר עבור שחרור הבן.","המשפחה שילמה כופר גבוה."]],["לָא מִנֵּיהּ וְלָא מִקְּצָתֵיהּ",["שגוי לחלוטין (לא ממנו ולא קצת ממנו)"],["הטענות נגדו לא מיניה ולא מקצתיה.","השמועה על פיטוריו לא מיניה ולא מקצתיה."]],["לַבִּירִינְתְּ",["מבוך"],["הם הלכו לאיבוד בלבירינת הגן.","הבירוקרטיה היא לבירינת של טפסים."]],["להד\"ם",["בדיוני, ראשי התיבות של \"לא היו דברים מעולם\""],["הדובר אמר שהידיעה בעיתון היא להד״ם.","הוא הכחיש את השמועות וטען שמדובר בלהד״ם."]],["לִיבְּרָה",["יחידת משקל"],["הסוחר מכר לו ליברה של קפה.","הבשר נמכר לפי ליברה."]],["לַיִּש",["אריה צעיר"],["הליש הצעיר ניסה לתקוף את הצבי.","הם שאגו כמו לישים."]],["לְמַכְבִּיר",["הרבה, בשפע"],["בחגיגה היו אוכל ושתייה למכביר.","בספר יש דוגמאות למכביר."]],["לְמִצְעָר",["לפחות"],["צריך להקדיש למצער שעה ביום ללימוד.","זה ייקח למצער שבוע."]],["לְמַרְאִית עַיִן",["לכאורה"],["הם התייעצו עם הציבור רק למראית עין.","למראית עין הם חברים, אבל בפועל הם יריבים."]],["לָעַז",["רכילות"],["השכנים הוציאו לעז על המשפחה החדשה.","אל תאמין ללעז שמסתובב במשרד."]],["מַאֲוַיִּים",["משיכה עזה, תאווה"],["הוא הגשים את כל מאווייו.","מאוויי הלב שלה היו פשוטים."]],["מְבֻדָּר",["מפוזר"],["הנייר המבודר כיסה את הרצפה.","הצאן המבודר נאסף אל המכלאה."]],["מֻבְלַעַת",["שטח אדמה שנמצא בשליטת מדינה אחת ומוקף בשטחי מדינה אחרת"],["המובלעת מוקפת בשטחי המדינה השכנה.","הכפר הוא מובלעת בתוך העיר הגדולה."]],["מִבְּעוֹד מוֹעֵד",["מספיק זמן לפני, לא ברגע האחרון (בעוד מועד - בזמן, לא מאוחר מידי)"],["מבעוד מועד הזמנו מקומות במסעדה.","כדאי להגיע לשדה התעופה מבעוד מועד."]],["מְדוּכָה",["גליל המשמש לשיגור מטעני נפץ","קערה המשמשת לכתישה בעזרת עלי (מוט בצורת גליל)"],["החיילים ירו פצצות מרגמה מהמדוכה.","היא כתשה את השום במדוכה."]],["מְהַדְּרִין",["מי שמקפיד על כל פרט ופרט, דקדקן"],["הכשרות במסעדה היא בהשגחת מהדרין.","הוא מהדרין בכל הקשור לעבודתו."]],["מַחַט",["עלה צר, קשה ומחודד"],["מחטי האורן כיסו את שביל היער.","לעץ הזה יש מחטים ירוקות כל השנה."]],["מָחַט",["קינח (את האף)"],["הילד מחט את אפו בממחטה.","היא מחטה את האף אחרי ההצטננות."]],["מַחְתָּה",["כל אחד מהכלים המשמשים לטיפול האח (יעה, מגרפה וכו')","כלי להעברת גחלים חמים ממקום למקום"],["הם גרפו את האפר מהאח במחתה.","הכוהן נשא מחתה מלאה גחלים."]],["מַטְרוֹנָה / מַטְרוֹנִית",["גברת נכבדה"],["המטרונה של העיר ערכה נשף צדקה.","המטרוניות ישבו בשורה הראשונה."]],["מִיָּמִים יָמִימָה",["מזה זמן רב, מאז ומעולם"],["מימים ימימה נהגו לחגוג כאן את הבציר.","המשפחה גרה בכפר מימים ימימה."]],["מִנִּי אָז",["מאז"],["מני אז לא ראינו אותו.","מני אז השתנו החיים בעיר."]],["מְסוֹבָב",["פועל יוצא, תוצאה"],["העוני הוא סיבה, והפשיעה היא המסובב.","צריך להבחין בין הסיבה למסובב."]],["מִקַּדְמַת דְּנָא",["מאז ומעולם, מאז ומתמיד"],["מקדמת דנא נהגו אנשים לטפס להר.","זה מנהג מקדמת דנא."]],["מְרוּפָּט",["קרוע ובלוי, משומש"],["הוא לבש מעיל מרופט.","הספר המרופט עבר מיד ליד."]],["מִשְׁבָּר",["גל"],["משברי הים התנפצו על הסלעים.","הספינה נאבקה במשברים."]],["מַשְׁמִים",["משעמם, שגרתי"],["ההרצאה המשמימה הרדימה את הקהל.","העבודה המשמימה גרמה לו לחפש משרה אחרת."]],["נִבְכֵי נפְשוֹ",["תוך תוכו (נאמר על אדם)"],["בנבכי נפשו הוא ידע שטעה.","הסופרת חושפת את נבכי נפשן של הדמויות."]],["נִדְרַשׁ",["עסק בעניין מסוים"],["הוועדה נדרשה לסוגיה בדיון מיוחד.","השופט נדרש לשאלה המשפטית."]],["נְהָרָה",["אור, זוהר"],["פניה קרנו נהרה כשראתה את ילדיה.","נהרת השחר האירה את ההרים."]],["נַחְתּוֹם",["אופה, בעל מאפיה"],["הנחתום אפה לחם טרי כל בוקר.","אין הנחתום מעיד על עיסתו."]],["נִיכָּר",["נראה לעין, בולט"],["בקולו הייתה ניכרת עייפות.","השינוי בשכונה ניכר לעין."]],["נְסִיקָה",["התרוממות, המראה"],["המטוס החל בנסיקה אל מעל העננים.","נסיקת המחירים הפתיעה את כולם."]],["נִעֵר (אֶת) חָצְנוֹ מ-",["התנער מאחריות, התנער מהקשר אליו (חצנו = שולי הבגד)"],["החברה ניערה חוצנה מהאחריות לתאונה.","אחרי הכישלון, כל השותפים ניערו את חוצנם מהפרויקט."]],["נֶעְתְּקוּ מִילִּים מִפִּיו",["לא השמיע קול, שתק"],["כשראה את הרכב ההרוס, נעתקו המילים מפיו.","נעתקו מילים מפיה מול הנוף."]],["נַפְשׁוֹ יָצְאָה",["רצה מאוד, השתוקק"],["נפשו יצאה לחזור הביתה.","נפשה יצאה אל הים."]],["סִדְקִית",["שם כולל לחפצים קטנים (ביחוד כלי תפירה)"],["בחנות הסדקית קנינו חוטים וכפתורים.","סבתא שמרה קופסת סדקית בארון."]],["סִילּוּף",["עיוות הדברים כך שיראו בצורה שונה מן המציאות"],["העיתון הואשם בסילוף דברי השר.","זה סילוף של ההיסטוריה."]],["סָנַט",["לעג, הִקְנִיט, התגרה"],["הילדים סנטו בו על המשקפיים שלו.","הוא סנט במתחרה שלו בפומבי."]],["סְפּוֹנְטָנִי",["ללא תכנון"],["הם יצאו לטיול ספונטני בלי תוכנית.","המחמאה שלה הייתה ספונטנית."]],["עֹל",["נטל, מעמסה","זוג מוטות המחוברים לבהמה ומשמשים ככן לשאר אביזרי הרתמה"],["עול הפרנסה נפל על כתפיו.","השוורים משכו את העגלה כשהעול על צווארם."]],["עֶלֶם / עַלְמָה",["בחור צעיר / בחורה צעירה"],["העלם הצעיר ביקש את ידה של העלמה.","עלמה יפה ישבה על שפת הבאר."]],["פֵּאָה",["דופן של גוף תלת- מימדי, פינה","קווּצת שיער מצידי הראש (פאות לחיים)"],["לקובייה יש שש פאות.","הוא גידל פאות לחיים ארוכות."]],["פַּח (יָקוּשׁ)",["מלכודת, מכמונת"],["הצייד הניח פח יקוש לשועל.","החשוד נפל בפח שטמנו לו החוקרים."]],["פִּיתוֹם",["מי שמדבר מהבטן ללא הנעת השפתיים"],["הפיתום הציג מופע עם בובה מדברת.","הקהל צחק מהפיתום שדיבר בלי להזיז את השפתיים."]],["פָּכַר",["שבר, לחץ, מעך"],["הוא פכר את הלחם בידיו.","הגשם הכבד פכר את גבעולי הפרחים."]],["פָּכַר אֶת יָדָיו / אֶצְבְּעוֹתָיו",["שילב את אצבעותיו בחוזקה כביטוי לכעס או לצער רב"],["האם פכרה את ידיה בייאוש.","הוא פכר את אצבעותיו בזמן שחיכה לתשובה."]],["פְּלוּגְתָּא",["מחלוקת, ריב, חילוקי דעות"],["בין החוקרים יש פלוגתא על פירוש הכתובת.","זה עניין שנוי בפלוגתא."]],["פְּלוֹנִי",["מישהו בלתי ידוע, אלמוני"],["נניח שפלוני קונה דירה בחמישה מיליון שקל.","הוא לא רוצה שכל פלוני ואלמוני ידע על כך."]],["פַּלָּצוּת",["זעזוע עמוק, פחד עז"],["סרט האימה עורר פלצות בקהל.","פלצות אחזה בו כששמע את הצעדים."]],["פָּרִיץ",["אציל, בעל אחוזה שיש לשלם לו מיסים","מושחת, חסר מוסר"],["האיכרים נאלצו לשלם מסים לפריץ.","הפריץ המושחת ניצל את עובדיו."]],["פַּרְסָה",["חומר דמוי ציפורן המכסה את טלפי הבהמה","מידת אורך קדומה"],["הנפח החליף את הפרסה של הסוס.","העיר נמצאת במרחק כמה פרסאות מכאן."]],["פֵּשֶׁר",["משמעות, פירוש (חסר פשר - לא מובן)"],["איש לא הבין את פשר ההודעה המוזרה.","החלום נראה לו חסר פשר."]],["צוֹרֵף",["אמן שעוסק בעיצוב מתכות יקרות לתכשיטים, תכשיטן"],["הצורף עיצב טבעת נישואין מזהב לבן.","הם הזמינו שרשרת מצורף מוכר בעיר העתיקה."]],["צַלְיָן",["עולה לרגל"],["צליינים מכל העולם הגיעו לירושלים לחג.","הצליינים צעדו בדרך הארוכה אל המקדש."]],["צָפוּד",["מקומט, יבש ומצומק, מכווץ"],["פניה של הזקנה היו צפודות מהשמש.","התאנים הצפודות התייבשו על הגג."]],["צַרְכָנִיָּה",["חנות המנוהלת ע\"י ארגון חברים ללא מטרת רווח (מוכרת בעיקר מזון) או חנות מכולת קטנה"],["בקיבוץ הייתה צרכנייה קטנה ליד חדר האוכל.","קנינו חלב ולחם בצרכנייה של המושב."]],["קְבָס / קֶבֶס",["בחילה, גועל"],["ריח הביוב עורר בו קבס.","השקרים שלו מעוררים קבס."]],["קִטּוּב",["ניגוד"],["הקיטוב בחברה הישראלית העמיק בשנים האחרונות.","הדיון חשף קיטוב חריף בין שני הצדדים."]],["קִיפֵּחַ",["שָׁכל, איבד (קיפח את חייו - מת)","גבוה מאוד, ענק","הפלה לרעה"],["לוחמים רבים קיפחו את חייהם בקרב.","העובדים הרגישו שהם מקופחים לעומת עמיתיהם."]],["קַלּוּת רֹאשׁ",["התייחסות מזלזלת שלא נותנת את הכבוד הראוי לנושא, קלות דעת"],["השופט נזף בנאשם על קלות הראש שבה התייחס לדיון.","אסור להתייחס בקלות ראש להוראות הבטיחות."]],["קְנוֹקֶנֶת",["איבר בצמח הדומה לחוט אשר נכרך סביב עצמים ומאפשר לצמח לטפס"],["הגפן נאחזה בגדר בעזרת הקנוקנות שלה.","קנוקנות האפונה נכרכו סביב המוט."]],["קַצְרָנוּת",["שיטת כתיבה מקוצרת ומהירה לרישום פרוטוקולים (בעיקר בבית- משפט)"],["הקצרנית תיעדה כל מילה שנאמרה בדיון.","היא למדה קצרנות כדי לעבוד בבית המשפט."]],["קֶרֶן יַעַר",["כלי נשיפה ממתכת"],["נגן קרן היער ניגן סולו בתזמורת.","צליל קרן היער נשמע ברחבי האולם."]],["רַחַשׁ",["תנועה, רִשרוש"],["נשמע רחש של עלים בשיחים.","רחש של שיחות מילא את האולם לפני ההצגה."]],["רָחַשׁ",["הרגיש, חש (רוחש כבוד - מכבד)","שקק, היה מלא חיים"],["התלמידים רוחשים כבוד רב למורה.","השוק רחש קונים ביום שישי."]],["רֶמֶץ",["אפר חם שיש בו ניצוצות אש, גחלים"],["מתחת לאפר נותר רמץ לוחש.","הם חיממו את הידיים מעל הרמץ."]],["רֶפוֹרְמָה",["שינוי יסודי ומקיף, תיקון הדברים מיסודם"],["הממשלה הודיעה על רפורמה במערכת החינוך.","הרפורמה בשוק החשמל הורידה את המחירים."]],["שָׁבִיס",["כיסוי ראש לנשים"],["הכלה חבשה שביס לבן.","הנשים בכפר הלכו עם שביס על הראש."]],["שִׁוָּוה",["הקנה לו"],["הצייר שיווה לתמונה מראה של חלום.","התאורה שיוותה לחדר אווירה חמימה."]],["שַׁוֵּוה בְּנַפְשֵׁך",["תאר לעצמך"],["שווה בנפשך מה היה קורה אילו לא עצרנו בזמן.","שווי בנפשך שאת גרה על אי בודד."]],["שְׁוֵוה נֶפֶשׁ",["אדיש"],["הוא נשאר שווה נפש מול הבשורה.","אי אפשר להישאר שווה נפש מול עוול."]],["שַׁחֲרִית",["אחת משלושת התפילות שיהודי חייב בהן מדי יום","שעות הבוקר, זריחה"],["סבא הולך בכל בוקר לתפילת שחרית.","בשחרית יצאו הדייגים לים."]],["שִׁנֵּס",["קשר חגורה סביב המותניים, חגר"],["הלוחמים שינסו מותניים ויצאו לדרך.","העובדים שינסו מותניים כדי לסיים את הבנייה."]],["שָׁעָה",["התייחס, שם לב (לא בהכרח הסכים לבקשה) (להיפך: התעלם)"],["המנהל לא שעה לבקשות העובדים.","היא שעתה לעצת אביה."]],["שָׁפוּף",["כפוף"],["הוא ישב שפוף מול המחשב.","הזקן הלך שפוף ברחוב."]],["שָׁרִיר וְקַיָם",["ידוע וברור מעבר לכל ספק, ודאי"],["הכלל הזה שריר וקיים עד היום.","ההסכם בין המדינות שריר וקיים."]],["שַׂרְעַפִּים",["מחשבות, הרהורים"],["הוא שקע בשרעפים ולא שמע שקוראים לו.","השיר מביע את שרעפי המשורר על אהבה."]],["תַּבְלִיט",["צורת פני האדמה","סוג של פסל הבולט מהמשטח החלק עליו הוא מפוסל"],["התבליט של האזור הררי ומבותר.","על קיר המקדש נחקק תבליט של אריה."]],["תּוֹחֶלֶת",["תקווה, סיכוי (חסר תוחלת - חסר סיכוי, חסר טעם)","ממוצע משוקלל של מספר תוצאות (מוכח בסטטיסטיקה)"],["המאמצים להציל את החברה היו חסרי תוחלת.","בסטטיסטיקה חישבנו את התוחלת של ההגרלה."]],["תִּינָּה",["התאבל"],["האם תינתה את בנה שנפל.","העם תינה על חורבן העיר."]],["תִּינָה (אֶת צָרוֹתָיו)",["השמיע את צרותיו באוזני מישהו"],["היא תינתה את צרותיה בפני השכנה.","הוא תינה את צרותיו באוזני כל מי שהסכים להקשיב."]],["תַּמְלוּגִים",["תשלום עבור שימוש בזכויות יוצרים"],["הסופרת מקבלת תמלוגים על כל ספר שנמכר.","הזמר מתפרנס בעיקר מתמלוגים."]],["תַּעֲרִיף",["המחיר שיש לשלם בתמורה לדבר מה, שער"],["התעריף של החשמל עלה החודש.","עורך הדין גובה תעריף גבוה לשעה."]],["תִּקְרוֹבֶת",["כיבוד"],["אחרי הטקס הוגשה תקרובת קלה.","המארחת הגישה תקרובת של פירות ועוגות."]],["אֶבֶן יְסוֹד",["דבר מרכזי במשהו, מרכז הכובד"],["אמון הציבור הוא אבן יסוד בדמוקרטיה.","אבן היסוד לבניין החדש הונחה בטקס."]],["אַבְּסוּרְדִי",["חסר הגיון, שטותי, דבר שאינו מתקבל על הדעת"],["זה אבסורדי לחייב אותנו לשלם על שירות שלא קיבלנו.","המחזה מתאר מצב אבסורדי."]],["אַדְּרַבָּה",["ההיפך הוא הנכון","למה לא? יופי!"],["״אתה מתנגד?״ ״אדרבה, אני תומך בכל לבי.״","״נצא לטיול מחר?״ ״אדרבה, רעיון מצוין!״"]],["אוֹב",["קסם, כישוף"],["שאול הלך אל בעלת האוב בעין דור.","הוא עסק באוב ובכישוף."]],["אוֹטוֹרִיטָה",["סמכות הנובעת מידע בתחום מסוים"],["הפרופסור הוא אוטוריטה בתחום ההיסטוריה.","ההורים איבדו את האוטוריטה שלהם מול הילדים."]],["אוֹרַח",["מנהג, אופן התנהגות, דרך חיים"],["אורח החיים הבריא כולל תזונה טובה וספורט.","אורח החיים בקיבוץ השתנה."]],["אֵין תּוֹכוֹ כְּבָרוֹ",["צבוע, שקרן"],["הוא נחמד בפנים, אבל אין תוכו כברו.","אל תסמוך עליה, אין תוכה כברה."]],["אִיֵּשׁ",["הציב אנשים למילוי תפקיד מסוים"],["המנהל איש את כל התפקידים בתוך שבוע.","העירייה איישה את משרת המהנדס."]],["אִישׁ אֶשְׁכּוֹלוֹת",["אדם הבקי בתחומים רבים ושונים"],["לאונרדו דה וינצ׳י היה איש אשכולות.","הרב הוא איש אשכולות שמבין גם במדע ובאמנות."]],["אֶנִיגְמָה",["תעלומה, חידה"],["היעלמות המטוס נותרה אניגמה.","האיש הזה הוא אניגמה בשבילי."]],["אַפְּרַקְדָן",["שכוב על הגב"],["הוא שכב אפרקדן על הדשא.","התינוק ישן אפרקדן."]],["אֶשְׁתָּקַד",["בשנה שעברה"],["אשתקד ביקרנו באיטליה.","התוצאות השנה טובות מאלה של אשתקד."]],["אֶתְנַחְתָּא",["הפסקה, פסק זמן"],["אחרי שעתיים של עבודה, לקחנו אתנחתא.","החופשה הייתה אתנחתא מהשגרה."]],["בְּחוּבּוֹ",["בו, בתוכו"],["התוכנית טומנת בחובה סיכונים רבים.","הספר נושא בחובו מסר חשוב."]],["בִּיזָארִי",["מוזר, לא נורמאלי"],["הוא לבש תלבושת ביזארית למסיבה.","זה היה מקרה ביזארי שאף אחד לא ציפה לו."]],["בִּכָּה",["ספד, קונן והתאבל על מת"],["כל העם בכה את מות המנהיג.","היא בכתה את בעלה שנפטר."]],["בַּלְדָּר",["שליח, דוור, רץ"],["הבלדר העביר את המסמכים בין המשרדים.","החברה שלחה בלדר עם החבילה."]],["בָּלוּי",["שחוק, מרופט, ישן וקרוע"],["הוא לבש מכנסיים בלויים.","הספר הבלוי עבר בין דורות של תלמידים."]],["בְּנַפְשׁוֹ הַדָּבָר",["עבורו מדובר בדבר חיוני וגורלי בבחינת ייהרג ובל יעבור"],["לגבי החופש הזה, בנפשו הדבר.","עבור ההורים, שלום ילדיהם הוא בנפשם הדבר."]],["בִּקֵּשׁ עַל נַפְשׁוֹ",["התחנן על חייו"],["האסיר ביקש על נפשו מול השופט.","השבוי ביקש על נפשו."]],["גְּדִיל",["קצוות חוטים היוצאים משולי הבגד"],["לצעיף היו גדילים ארוכים בשוליים.","בגדילי הטלית היו חוטי תכלת."]],["גִּדֵם / גִּדֵעַ",["קטוע יד"],["הגידם למד לכתוב ביד שמאל.","החייל חזר מהמלחמה גידם."]],["גֶּדֶם / גֶּדַע",["גזע העץ שנשאר לאחר כריתה, חלק מאיבר שנשאר לאחר קטיעה"],["אחרי הכריתה נותר רק גדם העץ.","היא ישבה על גדם העץ ביער."]],["גָּדַם / גָּדַע",["כרת, חטב, קטע"],["החוטבים גדעו את העצים הגבוהים.","המחלה גדעה את חייו בגיל צעיר."]],["גְּלִימָה",["בגד עליון ארוך"],["השופט לבש גלימה שחורה.","הקוסם עטה גלימה ארוכה."]],["גָּמַר עָלָיו אֶת הַהַלֵּל",["שיבח אותו"],["המבקרים גמרו את ההלל על ההצגה החדשה.","המנהל גמר עליה את ההלל בפני כולם."]],["דִּבְרֵי חֲלָקוֹת",["דברי חנופה, לשון חלקות"],["אל תתפתה לדברי החלקות שלו.","הוא ניסה לשכנע את המנהל בדברי חלקות."]],["דָּחָה אוֹתוֹ בְּקַש",["התחמק מלתת תשובה בתירוץ קלוש"],["הוא דחה אותי בקש ואמר שהוא עסוק.","הפקיד דחה את הפונים בקש."]],["דֹּחַק",["מצב של מחסור ומצוקה","צפיפות"],["המשפחה חיה בדוחק אחרי הפיטורים.","בדוחק של שעת העומס בקושי עלינו לרכבת."]],["דָּמַם",["השתתק, לא הוציא הגה","הפסיק לזוז, נרגע, שקט"],["הקהל דמם כשהשחקן עלה לבמה.","הרוח דממה והים נרגע."]],["הֶאֱפִיל",["עלה עליו ביכולתו","החשיך, הקדיר"],["הכוכב הצעיר האפיל על כל שאר השחקנים.","העננים האפילו את השמיים."]],["הֲגַם שֶׁ -",["למרות שֶׁ -, אף על פי, אם כי"],["הוא הצליח במבחן, הגם שלא למד הרבה.","הגם שהיה עייף, המשיך לעבוד."]],["הֵחִישׁ",["האיץ, זירז"],["הרופא החיש את הטיפול כשהמצב הוחמר.","החדשות החישו את ההחלטה."]],["הֶחֱשָה",["לא השמיע קול, שתק, דמם לא התערב"],["כשהתחיל הוויכוח, היא החשתה.","החברים החשו ולא התערבו בריב."]],["הִכְלִים",["בייש, הביך, הלבין את פניו, עלב"],["המורה הכלים את התלמיד מול הכיתה.","הוא הרגיש מוכלם אחרי ההערה."]],["הִכְתִּיר",["הסמיך מלך חדש"],["הם הכתירו את הנסיך למלך.","העיתונים הכתירו אותו כגיבור השנה."]],["הִמְרָה אֶת פִּיו",["נהג בניגוד להוראתו"],["החייל המרה את פי המפקד.","הילד המרה את פי הוריו ויצא בלילה."]],["הֵסִיר אֶת הַלּוֹט",["חשף, גילה, פרסם (לוט - כיסוי)"],["העיתונאי הסיר את הלוט מעל פרשת השחיתות.","ראש העירייה הסיר את הלוט מעל האנדרטה."]],["הִסְתּוֹפֵף",["שהה באופן ממושך במקום מסוים או בחברת אנשים מסוימים"],["הוא נהג להסתופף בבית הקפה של האמנים.","בצעירותו הסתופף בחצר הרבי."]],["הִסְתּוֹפֵף בְּצִלּוֹ",["היה לתלמידו (הסתופף - שהה במחיצת אנשים)"],["הוא הסתופף בצלו של הצייר הגדול במשך שנים.","התלמידים הסתופפו בצלו של הפרופסור."]],["הֶעֱרָה",["גילה, חשף","שתה, לגם"],["הוא הערה את כוס המים בבת אחת.","המחקר הערה עובדות חדשות על העבר."]],["הִצְמִית",["השמיד, חיסל, החריב"],["האויב הצמית את כל הכפרים באזור.","המגפה הצמיתה אוכלוסיות שלמות."]],["הִקְצָה",["ייעד משהו למטרה מסוימת, הקציב, הפריש"],["העירייה הקצתה כסף לבניית גן שעשועים.","המורה הקצתה חצי שעה לשאלות."]],["הִרְעִים",["הרגיז, הביא לידי כעס","השמיע קול רעם, הרעשה"],["הילד הרעים את אביו בהתנהגותו.","התותחים הרעימו כל הלילה."]],["הִתְאוֹנֵן",["התלונן"],["הלקוח התאונן על השירות האיטי.","היא התאוננה על כאבי ראש."]],["הִתְגַּפֵּף",["התחבק מתוך אהבה, התרפק, התלטף"],["הזוג התגפף על הספסל בפארק.","הגורים התגפפו זה בזה."]],["התקין",["הכין, סידר, יצר","קבע תקנה, חוקק"],["הוא התקין מדף חדש במטבח.","הכנסת התקינה תקנות חדשות."]],["ווַרְיַאצְיָה",["נוסח, גירסה"],["המלחין כתב וריאציה על מנגינה עממית.","יש כמה וריאציות של המתכון הזה."]],["וִירְטוּאוֹז",["המצטיין בשלמות במקצועו, בעל רמת ביצוע גבוה במיוחד"],["הכנר הווירטואוז ריתק את הקהל.","הוא וירטואוז בכל הקשור לתיקון מכוניות."]],["זִכָּיוֹן",["זכות מיוחדת לדבר מה"],["החברה קיבלה זיכיון להפעלת הנמל.","הוא רכש זיכיון של רשת המזון המהיר."]],["זַלְזַל",["ענף"],["הציפור עמדה על זלזל דק.","זלזלי הגפן התפשטו על הגדר."]],["חָפַן",["תפס דבר מה בכף ידו"],["הילד חפן חול בידיו.","הוא חפן את המטבעות והכניס אותם לכיסו."]],["חֹפֶן",["מידת נפח המסמלת את הכמות שניתן להחזיק בכף יד קמוצה"],["היא הוסיפה חופן אגוזים לסלט.","חופן אורז מספיק לארוחה אחת."]],["חָרַץ",["גזר, פסק, קבע","שרט, עשה חריץ במשטח"],["השופט חרץ את דינו של הנאשם.","הילד חרץ את שמו על השולחן."]],["טְפִיפָה",["הליכה בצעדים קלים תוך התנדנדות, צעידה מרחפת"],["הרקדנית נעה בטפיפה על הבמה.","טפיפת הצעדים שלה נשמעה במסדרון."]],["טַרְזָנִי",["גנדרני, מתלבש בהידור"],["הוא הגיע למסיבה בחליפה טרזנית.","הצעיר הטרזני התבונן בעצמו בכל חלון ראווה."]],["יִעוּד",["הקצבת דבר או אדם למטרה מסוימת, הקדשה, יחוד","שליחות, כוונה, תכלית"],["ייעוד הקרקע שונה ממגורים למסחר.","היא מרגישה שהוראה היא ייעודה."]],["יָצָא חוֹצֵץ",["התנגד בתוקף"],["התושבים יצאו חוצץ נגד בניית המפעל.","השר יצא חוצץ נגד ההצעה."]],["יָצָא לָשׂוּחַ",["יצא לטייל"],["יצחק יצא לשוח בשדה לפני ערב.","אחרי ארוחת הערב יצאנו לשוח לאורך הים."]],["כִּילַי",["קמצן"],["הכילי לא הזמין אף אחד לארוחה.","אל תהיה כילי, תוסיף קצת לתרומה."]],["כָּמוּס",["מוסתר, חסוי, מוחבא"],["הסוד נשמר כמוס במשך שנים.","במגירה היו מכתבים כמוסים."]],["כָּפַר",["לא הסכים עם דבר מקובל","התכחש לקיום האל","לא הודה בהאשמות המיוחסות לו"],["הנאשם כפר באשמה.","הוא כפר בכל מה שלמד בבית הוריו."]],["כְּרוּב",["מלאך"],["הכרובים הוצבו על ארון הברית.","בציור נראים כרובים מכונפים."]],["לָאַט",["לחש, דיבר לאט ובלחש"],["היא לאטה לו באוזן את הסוד.","הוא לאט משהו לחברו בזמן השיעור."]],["לוֹט",["כיסוי, מעטה"],["לוט של ערפל כיסה את העמק.","פני האנדרטה היו מכוסים בלוט."]],["לוּט",["מכוסה, עטוף","מצורף, נספח"],["המכתב לוט בזאת.","ראשה היה לוט בצעיף."]],["לוּט בָּעֲרָפֶל",["שאינו ברור, מעורפל"],["עתידה של החברה לוט בערפל.","הנסיבות של התאונה עדיין לוטות בערפל."]],["לָחַך",["נגע קלות (כשנאמר על גלים, אש וכו')","כשנאמר על חיה: אכל עשב","שרף לחלוטין, כילה"],["הגלים ליחכו את החוף.","הפרה ליחכה עשב בשדה."]],["לְלֹא כָּחָל וְסָרָק",["כמו שהוא מבלי להוסיף או לגרוע, ללא קישוטים ותוספות"],["הוא סיפר את האמת ללא כחל וסרק.","התמונה מציגה את המציאות ללא כחל וסרק."]],["לְמַפְרֵע",["לאחר מעשה, על מה שהיה"],["התשלום אושר למפרע.","השכר עודכן למפרע מתחילת השנה."]],["לְמִשְעִי",["באופן נקי ביותר, באופן חלק"],["הוא היה מגולח למשעי.","החדר היה מסודר למשעי."]],["לִסְטִים",["שודד, גנב"],["הליסטים שדדו את השיירה בדרך.","ליסטים ארבו לעוברי אורח ביער."]],["לִפְנַי וְלִפְנִים",["באופן יסודי ומעמיק"],["החוקר בדק את הפרשה לפני ולפנים.","היא מכירה את החומר לפני ולפנים."]],["מִגְדָּנוֹת",["דברי מתיקה (אפשר גם: מגדנים)"],["החנות מלאה במגדנות לקראת החג.","סבתא הגישה מגדנות לנכדים."]],["מָגוֹף / מְגוּפָה",["ברז, פקק, שסתום ויסות"],["האינסטלטור סגר את המגוף הראשי.","המגופה נפלה מהבקבוק."]],["מוּבְהָק",["ניכר בברור, בולט","אופייני, טיפוסי, ייצוגי"],["היא תלמידתו המובהקת של הפרופסור.","זו דוגמה מובהקת לבזבוז כספי ציבור."]],["מוּפְשָט",["ערטילאי, נטול גשמיות (להיפך: מוחשי)"],["הצייר מצייר אמנות מופשטת.","קשה להסביר מושג מופשט לילדים."]],["מִינוּת",["כפירה בדת, כפירה בעיקר"],["הקהילה האשימה אותו במינות.","בימי הביניים נרדפו אנשים באשמת מינות."]],["מְלוּבָּן",["מובהר, מוסבר, מפורש"],["העניין מלובן היטב בדוח.","לאחר דיון, הסוגיה מלובנת."]],["מִנְשָר",["הצהרה, כרוז"],["המורדים פרסמו מנשר לעם.","המנשר קרא לתושבים לצאת לרחובות."]],["מַעֲקָשׁ",["מכשול, סיבוך","מפותל, שאינו מישורי"],["הדרך אל המטרה רצופה מעקשים.","השביל המעקש עלה אל ראש ההר."]],["מְשׁוֹבֵב נֶפֶשׁ",["מהנה ביותר, נעים"],["הטיול בטבע היה משובב נפש.","היא שמעה מוזיקה משובבת נפש."]],["מִשְׁנֶה",["כפול ומכופל, רב מאוד (משנה תוקף, משנה חשיבות)"],["ההכרזה נתנה משנה תוקף להסכם.","לנושא יש משנה חשיבות בימים אלה."]],["מִתְוֶוה",["שרטוט או רישום בקווים כלליים, סקיצה"],["האדריכל הציג מתווה ראשוני של הבניין.","הממשלה הציגה מתווה לפתרון המשבר."]],["נֵאוֹת",["הסכים"],["אחרי שכנוע, הוא נאות לעזור לנו.","המנהלת נאותה לבקשה."]],["נָאוֹת",["מתאים, ראוי, הולם"],["צריך לבוא בלבוש נאות לטקס.","העובדים דרשו שכר נאות."]],["נֹגַהּ",["אור, זוהר"],["נוגה הירח האיר את הלילה.","נוגה של תקווה עלה בעיניה."]],["נָד / הִתְנוֹדֵד",["נע, מתנועע"],["הסירה נדה על הגלים.","העץ התנודד ברוח החזקה."]],["נִדְבָּך",["דרגה בהתפתחותו של דבר מה, שלב","שכבה"],["הפרויקט הזה הוא נדבך חשוב בתוכנית.","הבנאים הניחו נדבך על נדבך."]],["נִטַּשׁ",["התחולל, התפשט"],["קרב עז ניטש בין שני הצבאות.","ויכוח סוער ניטש בין המומחים."]],["נִכְמַר לִבּוֹ",["ריחם, חס"],["נכמר לבו כשראה את הילד הרעב.","נכמרו רחמיה על החתול הפצוע."]],["נָסַךְ",["יצק נוזלים לצורך פולחן דתי","התיך","השרה, יצר אוירה מסויימת"],["הכוהן נסך יין על המזבח.","המוזיקה נסכה אווירה רגועה בחדר."]],["נִקְהַל",["נקבץ, נאסף"],["הציבור נקהל בכיכר העיר.","התלמידים נקהלו סביב המורה."]],["נִקְרָה",["סדק רחב בסלע או בהר, נַקִיק","הזדמן, הגיע למקום או נפגש עם מישהו באקראי, באופן לא מתוכנן (נקרה בדרכו)"],["הציפור קיננה בנקרת הצוק.","נקרתה לו הזדמנות טובה והוא ניצל אותה."]],["סְבָרָה",["דעה רווחת, השערה"],["לפי הסברה המקובלת, המבנה שימש מקדש.","זו סברה שאין לה בסיס."]],["סוֹלְלָה",["גבעה מלאכותית מוארכת","יחידת תותחים"],["החיילים חפרו סוללה סביב העמדה.","סוללת התותחים ירתה לעבר האויב."]],["סָלַד",["הרגיש דחייה כלפי משהו, נגעל"],["היא סלדה מהריח של הדגים.","הוא סולד מאלימות."]],["סָעַד",["סייע, טיפל"],["האחות סעדה את החולה.","הם סעדו את הוריהם הזקנים."]],["סָעַד (אֶת) לִבּוֹ",["אכל, השביע רעבונו"],["האורחים סעדו את לבם בארוחה עשירה.","סעדו את לבכם לפני הדרך."]],["סָפַק אֶת כָּפָּיו",["מחא כף מתוך צער או אכזבה"],["המאמן ספק את כפיו כשהקבוצה החמיצה.","היא ספקה את כפיה בייאוש."]],["עַבְדְקָן",["בעל זקן עבה ומגודל"],["העבדקן ישב בפינה ועיין בספר.","לסבא היה מראה של עבדקן."]],["עֲבוֹט",["חפץ בעל ערך הניתן למִשכון בתמורה להלוואה, ערבון"],["הוא השאיר את שעונו כעבוט להלוואה.","התורה אוסרת להשאיר עבוט של עני אצלך בלילה."]],["עִוְעִים",["תעתועים, שיגעון (רעיונות עִוְעִים - רעיונות מטורפים)"],["הרעיונות העוועים שלו הביכו את כולם.","זו הייתה תוכנית עוועים."]],["עוֹפֶר",["אייל או צבי צעיר","כשנאמר על אדם: עלם חמד, צעיר"],["העופר קפץ בין הסלעים.","העופר הצעיר שיר את לב הנערות."]],["עַמוּד הַתָּוֶוך",["דבר מרכזי במשהו, מרכז הכובד"],["האב הוא עמוד התווך של המשפחה.","התיירות היא עמוד התווך של כלכלת העיר."]],["עֵרָה",["מזג, שפך נוזל","הרס, החריב","חשף, גילה"],["היא ערתה מים לכוס.","האויב ערה את העיר עד היסוד."]],["פֹּארָה",["ענף"],["העץ שלח פארות לכל עבר.","הציפור ישבה על פארה גבוהה."]],["פּוֹחֵז",["חסר אחריות, פזיז, נמהר"],["הנהג הפוחז גרם לתאונה.","הוא צעיר פוחז שאינו חושב על ההשלכות."]],["פֶּלֶך",["כְּישוֹר, מוט המשמש לטווית חוטים","אזור, מחוז"],["הסבתא טוותה צמר בפלך.","במחוזות האימפריה היו פלכים רבים."]],["פִּנְכָּה",["קערה, צלוחית, פלטה (מְלַחֵךְ פִּנְכָּה - מתחנף)"],["הם ליקקו את הפינכה עד שלא נותר דבר.","הוא מלחך פינכה של כל בעל כוח."]],["פַּס",["עבר מן העולם, תם"],["המנהג הישן פס מן העולם.","הסכנה פסה, ואפשר לצאת."]],["פָּקַד",["בא, ביקר מישהו","סָפַר, מנה","ציווה, הורה"],["המשפחה פקדה את קבר הסבא.","המפקד פקד על החיילים להתכונן."]],["צָבָא",["התאסף, התקהל"],["האנשים צבאו על פתח החנות.","מאות מעריצים צבאו על הכניסה."]],["צוֹעֵר",["חניך בית ספר לקצינים","עוזר, סגן"],["הצוער סיים את קורס הקצינים.","הצוערים עמדו במסדר."]],["צוּר",["סלע גדול"],["המבצר נבנה על צור גבוה.","מים נבעו מן הצור."]],["צוּר מַחְצַבְתּוֹ",["מקורו, מולדתו, המקום שממנו בא ואליו הוא משתייך"],["הוא חזר אל צור מחצבתו בכפר.","השיר מבטא געגועים לצור המחצבת."]],["צִיַה",["מדבר, שממון"],["הנוודים נדדו בארץ ציה.","העיר החרבה הפכה לציה."]],["צָנוּף",["מגולגל, מכורבל, מכווץ","כרוך סביב הראש"],["התינוק שכב צנוף בשמיכה.","ראשה היה צנוף בצעיף."]],["צַר",["אויב, שונא","חֲבָל, מצער","לא רחב, מצומצם"],["העם נלחם בצר שבא מן הצפון.","צר לי שלא יכולתי להגיע."]],["קַב",["מידת נפח קדומה"],["בימי קדם מדדו תבואה בקב.","עשרה קבים של חוכמה ירדו לעולם."]],["קְדֵרָה",["כלי לבישול, סיר"],["סבתא בישלה מרק בקדרה גדולה.","הקדרה עמדה על האש כל הלילה."]],["קוֹלֶגָה",["חבר למקצוע, עמית"],["הוא התייעץ עם קולגה מבית חולים אחר.","הקולגות שלה הפתיעו אותה ביום ההולדת."]],["קָטוּם",["שנכרת ונקצץ ראשו"],["העץ הקטום עמד לבדו בשדה.","לכלב היה זנב קטום."]],["קָם",["אויב","נבנה, יוסד","התעורר, פקח עינים"],["הם עמדו מול קמיהם בגבורה.","השכונה החדשה קמה בתוך שנה."]],["קַנְקַן זָפוּת",["בעל זיכרון טוב (כמו קנקן שחוריו סתומים בזפת ואינו דולף)"],["התלמיד הזה קנקן זפות, הוא זוכר כל תאריך.","הזקנה היא קנקן זפות של סיפורי העיר."]],["קְסַרְקְטִין / קְסַרְקָט",["מחנה צבאי, מגורי חיילים"],["החיילים הבריטים שהו בקסרקטין.","הקסרקטין הישן הפך למוזיאון."]],["קָרוּץ",["עשוי מ-"],["הוא קרוץ מחומר של מנהיגים.","היא לא קרוצה מאותו חומר כמו אחיה."]],["רָבַץ לְפִתְחוֹ",["נמצא בסביבתו הקרובה","ארב לו"],["הסכנה רובצת לפתחנו.","חטאת רובץ לפתחך."]],["רֵיאָלִי",["ישים, אפשרי","מציאותי"],["התוכנית שלך לא ריאלית, אין לנו מספיק זמן.","צריך להציב יעדים ריאליים."]],["רַעֲמָה",["המון שיער","שיער ארוך הגדל על העורף של בעל חיים"],["לאריה הייתה רעמה גדולה.","לזמר הייתה רעמת שיער מתולתלת."]],["רָצַע",["עשה חור (מַרְצֵע - מכשיר לניקוב חורים)"],["העבד רצע את אוזנו במרצע.","הסנדלר רצע חורים ברצועת העור."]],["שָׁוְא",["שקר וכזב (לרוב מופיע בצירופי סמיכות כגון “ תלונת שווא”)"],["הוא הגיש תלונת שווא נגד שכנו.","כל ההבטחות התבררו כשווא."]],["שָׁוֶוה לְכֹל נֶפֶשׁ",["כל אחד יכול להרשות לעצמו, זול","מתאים לכל אחד, פשוט"],["המחירים בשוק שווים לכל נפש.","הספר כתוב בשפה שווה לכל נפש."]],["שֶׁנֶץ",["רצועה, שרוך"],["הוא קשר את שנץ הסנדל.","השנץ של התיק נקרע."]],["שֶׁצֶף",["זרם חזק, שטף","כעס, זעם"],["הנהר זרם בשצף קצף.","הוא דיבר בשצף של כעס."]],["שְׁרִירוּת",["אופן התנהגותו של מי שפועל לפי גחמותיו גם אם הן פוגעות באחרים"],["העובדים התלוננו על שרירות המנהל.","השרירות של השלטון עוררה מחאות."]],["שְׁרִירוּת לֵב",["עקשנות, התנהגות חסרת הגיון והתחשבות"],["בשרירות לבו הוא סירב להתפשר.","הם פעלו בשרירות לב נגד רצון הציבור."]],["שְׁרִירוּתִי",["בנוי על דעה בלתי מבוססת או רצון עיקש שאין לו הצדקה אמיתית"],["ההחלטה לפטר אותו הייתה שרירותית.","המורה נתנה ציונים שרירותיים."]],["שָׂרָף",["כינוי לנחש ארסי","מלאך"],["משה עשה נחש שרף מנחושת.","השרפים עומדים סביב כיסא הכבוד."]],["תּוֹאֲנָה",["סיבה, תירוץ"],["הוא חיפש תואנה כדי להתחמק מהעבודה.","המלחמה פרצה בתואנה של הגנה עצמית."]],["תּוֹכָחָה / תּוֹכֵחָה",["דברי מוסר, עונש"],["הנביא נשא דברי תוכחה לעם.","הילד קיבל תוכחה מאביו."]],["תּוֹלָדָה",["תוצאה, מסקנה, דבר שהסתעף מדבר עיקרי"],["הקושי בעבודה הוא תולדה של תכנון גרוע.","המלחמה והרעב שבא בעקבותיה הם תולדות של אותה החלטה."]],["תְּכִיפוּת",["תדירות, נפיצות"],["תכיפות הרעידות באזור הדאיגה את המומחים.","המורה הזהירה מפני תכיפות האיחורים שלו."]],["תָּכַף",["התרחש לעתים קרובות, בתדירות גבוהה"],["ההתקפות תכפו בשבוע האחרון.","בחורף תוכפים הגשמים באזור ההרים."]],["תָּר",["ריגל, בלש אחרי, עקב","חיפש, ביקש","סייר, טייל"],["המרגלים תרו את הארץ ארבעים יום.","הם תרו אחר מקום שקט לבלות בו את החופשה."]],["תְּשׁוּרָה",["מתנה, מנחה, שי"],["האורחים הביאו תשורה לבעלי הבית.","בסוף הכנס קיבל כל משתתף תשורה קטנה."]],["אַבְנֵט",["חגורה רחבה"],["הכוהן חגר אבנט סביב מותניו.","הלוחם הצמיד את החרב אל האבנט."]],["אַבְקָן",["חלק בפרח המכיל אבקה המשמשת להפריית פרח"],["הדבורה נגעה באבקנים והעבירה אבקה לפרח אחר.","לשושן יש אבקנים ארוכים וצהובים."]],["אַבְרֵך",["כינוי לאיש צעיר, כיום נפוץ ככינוי לבחור הלומד בישיבה (אַבְרֵך - אָב בַּחָכְמָה רַךְ בְּשָׁנִים)"],["האברך יושב ולומד בישיבה כל היום.","אברכים רבים התפללו בבית הכנסת."]],["אוֹטוֹבִּיוֹגְרַפְיָה",["תולדות אדם הכתובות בידי עצמו"],["השחקן פרסם אוטוביוגרפיה על חייו בתיאטרון.","באוטוביוגרפיה שלה היא מתארת את ילדותה בכפר."]],["אוֹמְנִיפּוֹטֶנְטִי",["כל- יכול"],["המנהל מתנהג כאילו הוא אומניפוטנטי.","במיתולוגיה, זאוס אינו אומניפוטנטי."]],["אָשְׁיוֹת",["מסד, בסיס, יסוד"],["השחיתות מערערת את אושיות המדינה.","הוויכוח נגע באושיות האמונה שלו."]],["אָזַר עזֹ / כֹּחַ / אֹמֶץ",["הֵעֵז (אזר - התמלא)"],["הילד אזר אומץ וביקש מהמורה עזרה.","הוא אזר כוח והמשיך לרוץ."]],["אָחַז אֶת הַשּׁוֹר בְּקַרְנָיו",["פנה מיד לטפל בעניין"],["המנכ״לית אחזה את השור בקרניו וטיפלה בבעיה מיד.","במקום לחכות, הוא אחז את השור בקרניו."]],["אִידֵאָל",["שיא השלמות, דבר שרוצים להשיגו"],["הצדק הוא האידאל שלו.","היא מחפשת את בן הזוג האידאלי."]],["אִיּוּשׁ",["הצבת אנשים במקום מסוים על מנת שיבצעו מטלה מסוימת"],["הבעיה העיקרית בבית החולים היא איוש המשמרות.","איוש המשרה לקח שלושה חודשים."]],["אִינְהֶרֶנְטִי",["פנימי, טבוע (בתוך)"],["הסיכון הוא חלק אינהרנטי בהשקעות.","יש בעיה אינהרנטית בתוכנית."]],["אֵיפָה",["מידת נפח עתיקה"],["בימי קדם מדדו חיטה באיפה.","התורה מצווה על איפה צדק."]],["אִישׁ מָדוֹן / מְדָנִים",["סכסכן"],["השכן איש מדנים שמתווכח עם כולם.","הוא איש מדון שמסכסך בין חבריו."]],["אִכּוּל",["שריפה, בערה"],["האש גרמה לאיכול של כל הבניין.","איכול היער נמשך יומיים."]],["אֲנֶקְדּוֹטָה",["בדיחה, קוריוז"],["המרצה פתח באנקדוטה משעשעת.","הספר מלא אנקדוטות מחייו של הזמר."]],["אֲסוּפָה",["מקבץ מאמרים בנושא מסוים"],["יצאה לאור אסופה של מאמרים על היסטוריה.","האסופה כוללת סיפורים של סופרים צעירים."]],["אַפְסָר",["רסן, רתמה"],["הרועה משך את הסוס באפסר.","הוא קשר את החמור באפסר לעץ."]],["אָקוּטִי",["מהותי, חריף, חמוּר"],["בעיית הדיור היא בעיה אקוטית.","הוא סבל מכאב אקוטי בבטן."]],["אָרִיחַ",["לוח אבן בעל צורה מלבנית המשמש לכיסוי הרצפה או הקירות, מִרְצֶפֶת, בלטה"],["הרצפה רוצפה באריחים לבנים.","אריח אחד נשבר במקלחת."]],["אָרִיס",["אדם המקבל לידיו חזקה על אדמה ומעבד אותה בתמורה לאחוז מסוים מהיבול"],["האריס עיבד את האדמה ונתן לבעלים שליש מהיבול.","בעבר עבדו אריסים רבים באדמות האחוזה."]],["אֶשְׁכָּר",["מתנה, שי"],["המלך קיבל אשכר מהשגרירים.","הוא הביא אשכר למורו."]],["בְּחִישָׁה",["ערבוב"],["בחישת הרוטב מונעת ממנו להישרף.","אחרי בחישה קלה, העוגה נכנסה לתנור."]],["בִּיכֵּר",["העדיף"],["הוא ביכר ללמוד בחו״ל.","היא ביכרה להישאר בבית."]],["בִּכּוּרִים",["ראשית התבואה, היבול הראשון (פירות ראשונים ואף ספר ראשון של סופר)"],["בחג השבועות הביאו ביכורים למקדש.","ספר הביכורים של הסופרת זכה לשבחים."]],["בְּלִי מֵשִׂים",["בלי לשים לב, כבדרך אגב"],["בלי משים, הוא דרך על הרגל שלה.","בלי משים הם נעשו חברים טובים."]],["בִּלְתִּי נִלְאֶה",["נאמר על אדם שעושה משהו במרץ והתמדה ולא מראה סימני עייפות"],["המתנדבת הבלתי נלאית עבדה בבית החולים שנים.","הוא נאבק בצורה בלתי נלאית למען הצדק."]],["בִּמְבֵּם",["פיזם מנגינה ללא מילים, זמזם, המהם"],["הוא בימבם שיר תוך כדי עבודה.","הילדה בימבמה מנגינה כשהלכה ברחוב."]],["בְּצַוְותָּא",["ביחד, עם עוד אנשים"],["הם אכלו ארוחת ערב בצוותא.","השכנים חגגו בצוותא את החג."]],["בַּר-חֲלוֹף",["זמני וחולף, עראי"],["האופנה הזאת היא בת חלוף.","ההצלחה בת החלוף לא שינתה אותו."]],["בְּרַם",["אולם, אבל, אך, ועם זאת"],["התוכנית נראית טוב, ברם יש בה בעיות.","הוא ניסה, ברם לא הצליח."]],["גָבִין",["גַּבָּה (גבינים - גבות)"],["היא הרימה את גביניה בפליאה.","גביניו העבות הצלו על עיניו."]],["גַּחֲמָה",["קפריזה, שיגעון לדבר מסוים, דחף פתאומי למשהו (גחמני = קפריזי)"],["הוא קנה רכב חדש בגחמה של רגע.","המנהל הגחמני משנה את דעתו כל יום."]],["גְּלָלִים",["צואת בעלי החיים"],["האיכרים השתמשו בגללים לדישון השדות.","בשביל היו גללים של סוסים."]],["גָלְמוּד",["בודד, עזוב"],["הזקן הגלמוד חי לבדו בבית גדול.","היא הרגישה גלמודה בעיר הזרה."]],["גִנּוּנִים",["כללי התנהגות טקסית ומנומסת המקובלים בחברה כלשהי"],["החצר המלכותית מלאה בגינונים.","הוא לא אוהב גינונים ומעדיף פשטות."]],["גַשְׁמִי",["שניתן לתפיסה בעזרת החושים, חומרי, מוחשי, ממשי, ארצי"],["הם עסוקים רק בצרכים גשמיים.","העולם הגשמי לעומת העולם הרוחני."]],["דָּא עָקָא",["זו הצרה, זו הבעיה"],["רצינו לנסוע, דא עקא, הרכב התקלקל.","התוכנית טובה, דא עקא שאין לנו תקציב."]],["דָּהוּי",["שצבעו נחלש והחוויר"],["הוא לבש חולצה דהויה.","התמונה הישנה דהויה מאוד."]],["דּוֹבְרָה",["סירה להעברת משאות, רפסודה"],["הדוברה העבירה את המשא לחוף.","הם שטו בדוברה לאורך הנהר."]],["דְפוּס",["תבנית אופיינית להתנהגות אדם או תהליך שיטתי כלשהו, מודל, טיפוס"],["יש לו דפוס התנהגות קבוע כשהוא כועס.","המחקר מצא דפוס חוזר בנתונים."]],["דֹק",["שכבה דקה, קרום, ציפוי, כיסוי, מעטה"],["דוק של אבק כיסה את הרהיטים.","דוק של ערפל כיסה את העמק."]],["הֶאֱצִיל",["העביר סמכות לאחר, העביר תכונה לאחר"],["המנהל האציל סמכויות לסגניו.","האם האצילה מחוכמתה על ילדיה."]],["הֶגְמוֹנְיָה",["שליטה, שלטון עליון, עליונות"],["ההגמוניה של המעצמה נמשכה מאה שנה.","הקבוצה שומרת על ההגמוניה בליגה."]],["הוּדְרְכָה מְנוּחָתוֹ",["היה טרוד, משהו הפריע לו"],["מנוחתו הודרכה מאז ששמע על הפיטורים.","השמועות הדריכו את מנוחת התושבים."]],["הוֹלֵך בַּתֶּלֶם",["הולך לפי המקובל, נוהג בדיוק כפי שציוו עליו"],["הוא תמיד הולך בתלם ואינו מערער על ההוראות.","הם לא אוהבים עובדים שאינם הולכים בתלם."]],["הֵחִיל",["העניק תוקף לחוק או תקנה"],["הממשלה החילה את החוק על כל האזורים.","התקנות החדשות יוחלו מחודש הבא."]],["הָיָה בְּעוֹכְרָיו",["הדבר היה לרעתו, הכשיל אותו"],["הביטחון המופרז שלו היה בעוכריו.","הקמצנות הייתה בעוכריה."]],["הִכְפִּיף",["שם מישהו תחת מרותו של מישהו אחר"],["המחלקה הוכפפה למנהל החדש.","הממשלה הכפיפה את הרשות למשרד האוצר."]],["הַלָּה",["ההוא, המדובר"],["הלה סירב לענות לשאלות השוטרים.","פניתי לפקיד, אך הלה לא ידע דבר."]],["הִלִּין",["התלונן"],["התושבים הלינו על הרעש מהמפעל.","הוא הלין על השכר הנמוך."]],["הַלְמוּת",["דפיקה בקצב קבוע, מכה, נקישה"],["הלמות לבו נשמעה בשקט של החדר.","הלמות הפטישים באתר הבנייה העירה אותנו."]],["הִלְעִיז",["השמיץ, פרסם שקרים הפוגעים בשמו של מישהו"],["המתחרים הלעיזו עליו ברשתות.","הם הלעיזו על המשפחה החדשה."]],["הִמְצִיא",["הציג, נגיש"],["הנאשם המציא לבית המשפט את המסמכים.","יש להמציא אישור רפואי."]],["הִנְפִּיק",["הוציא שטרי כסף או איגרות חוב לציבור הרחב (לרוב נאמר על בנק)","המציא ומסר לידי מישהו תעודה רשמית כלשהי"],["הבנק הנפיק אגרות חוב חדשות.","משרד הפנים הנפיק לה דרכון."]],["הִסְתַּיֵּג",["לא הסכים עם משהו, טען נגד, דחה"],["השר הסתייג מההצעה.","היא הסתייגה מדבריו בפומבי."]],["הִשְׁלִיך יְהָבוֹ עַל",["תלה תקוותו ב-"],["הוא השליך יהבו על הרופא החדש.","המשפחה השליכה יהבה על הירושה."]],["הִתְבַּדְּרוּת",["השתעשע (מהמילה בִּידוּר)","התפזר (שיערה התבדר ברוח)"],["הם יצאו להתבדרות אחרי המבחן.","התבדרות השיער ברוח הסתירה את פניה."]],["הִתְחַקָּה",["ניתח ובחן, חקר","עקב אחריו, ריגל"],["החוקר התחקה אחר עקבות הגנב.","הם התחקו אחר שורשי המשפחה."]],["הִתְלַהֵם",["התכתש, השתולל, התנהג בתוקפנות"],["המפגינים התלהמו מול בניין העירייה.","הדיון בכנסת התלהם והפך לצעקות."]],["הִתְנוֹדֵד",["נע מצד לצד בחוסר יציבות"],["השיכור התנודד ברחוב.","המדף התנודד כשסגרתי את הדלת."]],["הִתְנוֹפֵף",["התנועע ברוח מצד לצד"],["הדגלים התנופפו ברוח.","שערה התנופף כשנסעה באופנוע."]],["הִתְקַשֵּׁט בְּנוֹצוֹת זָרִים",["התפאר בדבר מה שלא הוא עשה, או בדבר שאינו שלו"],["הוא התקשט בנוצות זרים והציג את הרעיון של חברו כשלו.","השר התקשט בנוצות זרים על הצלחת הפרויקט."]],["זִבְדָה",["שמנת"],["סבתא הקציפה זבדה לעוגה.","הקפה הוגש עם זבדה."]],["זְמָם",["מחסום ששמים בפי בהמה בכדי למנוע ממנה לאכול או לנשוך"],["לסוס שמו זמם כדי שלא יאכל מהתבואה.","הכלב חבש זמם בגן הציבורי."]],["חֲגָוִים",["נקיקים, סדקים, חריצים"],["היונים קיננו בחגווי הסלע.","מים זרמו בחגווים שבהר."]],["חֲוִילָה",["ווילה, קוטג'"],["הם גרים בחווילה עם גינה גדולה.","החווילה נבנתה על שפת הים."]],["חוֹסֶה",["מי שנמצא במוסד טיפולי (בשל נכות, זקנה וכו')"],["חוסי המוסד יצאו לטיול.","המתנדבים ביקרו את החוסים בבית האבות."]],["חִיוַּורְיָין",["מעט חיוור, לבנבן"],["פניה נראו חיוורייניות אחרי המחלה.","האור החיוורייני של הבוקר חדר לחדר."]],["חִיל (וּרְעָדָה)",["פחד גדול, אימה"],["חיל ורעדה אחזו בו כששמע את הפסק.","העם עמד בחיל מול המלך."]],["חַכְלִילִי",["אדמדם, אדמוני, סמוק"],["לחייו היו חכליליות מהקור.","השמיים היו חכליליים בשקיעה."]],["חָמָס",["שוד, גניבה, גזל"],["הפקיד הושחת ומילא את ביתו חמס.","הארץ התמלאה חמס בימי נח."]],["חָרוּל",["קוץ"],["השדה הנטוש התמלא חרולים.","הם נדקרו מן החרולים בדרך."]],["חֲרוּשׁ",["שיש בו, שיש בו סימנים של (חרוש קמטים, חרוש דאגה)"],["פניו של הזקן היו חרושות קמטים.","המצח שלה היה חרוש דאגה."]],["חֲרִיץ",["נתח, חתיכה, פרוסה (חָרִיץ גְבִינָה - חתיכת גבינה)"],["הוא אכל חריץ גבינה עם לחם.","ישי שלח לשר האלף חריצי חלב."]],["חִשּׁוּל",["עיצוב תכונות המתכת על ידי ליבונה","חיזוק אדם מבחינה מנטאלית, חיסון, הקשחה"],["חישול הפלדה נעשה בטמפרטורה גבוהה.","השירות הצבאי תרם לחישול אופיו."]],["טָרוּף",["חסר שקט (שינה טרופה - שינה לא שלווה)"],["הוא עבר לילה של שינה טרופה.","הים הטרוף סחף את הסירה."]],["יְהָב",["תקווה, סיכוי (השליך יהבו על מישהו - תלה בו תקוות)"],["כל יהבו היה על הניתוח.","הוא שם את יהבו על אחיו הגדול."]],["יוֹרֵד יָם",["יַמַּאי, סַפָּן, מַלָּח"],["יורדי הים נאבקו בסערה.","אביו היה יורד ים ששט בכל העולם."]],["כּוֹחוֹ יָפֶה",["יש לו תוקף"],["כוחו של החוזה יפה גם אם לא נחתם מול עורך דין.","ההחלטה כוחה יפה עד שתבוטל."]],["כִּיּוּר",["חריטה על הקיר לשם נוי","עיצוב צורות מחומר רך כלשהו (פלסטלינה, חמר.. .)"],["הכיור על קיר הכנסייה מתאר את חיי הקדושים.","בחוג כיור הילדים יצרו פסלים מחמר."]],["כִּינוּן",["הקמה, ביסוס"],["כינון היחסים בין המדינות לקח שנים.","כינון הממשלה החדשה אושר בכנסת."]],["כְּלוֹנָס",["מוט, קורה ארוכה ודקה"],["הם בנו סוכה מכלונסאות.","הבית נבנה על כלונסאות בטון."]],["כִּמֵּת",["מלשון כמות - ביצע מדידת כמות, מדד"],["החוקרים כימתו את הנזק במיליוני שקלים.","קשה לכמת רגשות."]],["כִּתֵּר",["הקיף מכל הצדדים"],["הצבא כיתר את העיר.","השוטרים כיתרו את הבניין."]],["לְאַלְתַּר",["באופן מיידי, על המקום, תכף ומיד"],["הוא נדרש להתייצב לאלתר.","השוטרים הורו לפנות את המקום לאלתר."]],["לִבָּה אֶת הַיְּצָרִים",["עורר סערת רגשות, הלהיט את הרוחות"],["הנאום ליבה את היצרים בקהל.","התקשורת ליבתה את היצרים סביב המשחק."]],["לִבְלוּב",["פריחת ניצנים (להיפך: קמל)","התפתחות מבטיחה של רגשות חיוביים"],["באביב העצים בלבלוב מלא.","לבלוב של אהבה החל בין השניים."]],["לְמֵישָׁרִין",["כמו שצריך, ללא כל בעיה"],["כל העבודה התנהלה למישרין.","הטיסה עברה למישרין."]],["לְסֵרוּגִין",["פעם כך ופעם אחרת, לא באופן רציף"],["הם עובדים מהבית ומהמשרד לסירוגין.","הגשם ירד לסירוגין כל היום."]],["מַבְכִּירָה",["אישה או בהמה המביאה לעולם את צאצאה הראשון (הבכור)"],["הפרה המבכירה המליטה עגל ראשון.","האם המבכירה הייתה נרגשת מאוד."]],["מִגְבַּעַת",["כובע רחב שוליים"],["הוא חבש מגבעת כדי להגן על עצמו מהשמש.","הקאובוי הרים את מגבעתו לשלום."]],["מַדְוֶה",["כאב"],["הוא סבל ממדווה בברך.","השיר מתאר את מדווה הלב."]],["מַדְמֵנָה",["מזבלה, אדמה בוצית"],["שקית האשפה הושלכה למדמנה.","השטח הפך למדמנה אחרי הגשמים."]],["מַהֲדִיר",["מי שמוציא ספר ישן במהדורה חדשה, מי שעורך ספר לדפוס"],["המהדיר הוציא מחדש את כתבי המשורר.","המהדיר הוסיף הערות לספר הישן."]],["מוֹעֵד",["זמן","חג"],["נקבע מועד חדש לבחינה.","במועדים אנו נוהגים להתכנס כמשפחה."]],["מוֹרֶך (לֵב)",["חולשה, פחד"],["מורך לבו גרם לו לברוח מהקרב.","הוא הראה מורך מול האתגר."]],["מִזְכָּר",["מכתב קצר ולא רשמי בנוגע לעניין מסוים"],["המנהלת שלחה מזכר לכל העובדים.","במזכר נכתב שהפגישה נדחתה."]],["מַחְמָל",["דבר המעורר חמלה ואהבה (מַחְמַל נַפְשׁוֹ = יקירו, אהובו)"],["התינוקת היא מחמל נפשם של הוריה.","היא מחמל נפשו."]],["מְטֻלָּל",["רטוב מטל"],["הדשא היה מטולל בבוקר.","הפרחים המטוללים נצצו בשמש."]],["מְטוּרְזָן",["הדור בלבושו, מגונדר"],["הוא הגיע למסיבה מטורזן בחליפה.","הזמר המטורזן עלה לבמה."]],["מְכוּרְכָּם",["בצבע צהוב- כתום (כצבע הצמח כורכום)"],["האורז המכורכם הוגש עם עוף.","השמיים נצבעו בגון מכורכם."]],["מִלְטָשָׁה",["בית מלאכה לליטוש שיש, אבני חן וכו'"],["היהלום עבר עיבוד במלטשה.","במלטשה עבדו עשרות אומנים."]],["מִסְדָּר",["התאחדות של אנשים על יסוד רקע משותף"],["הם הקימו מסדר של אבירים.","הנזירים חיו לפי כללי המסדר."]],["מַסָּה",["חיבור עיוני קצר"],["הוא כתב מסה על מקומה של השירה בחברה.","המסה פורסמה בכתב עת ספרותי."]],["מָש",["זז, נע"],["הוא לא מש ממיטת אמו.","העמוד לא מש ממקומו."]],["מַשְׂאַת לֵב / נֶפֶש",["שאיפתו ותקוותו של אדם, חלום"],["משאת נפשו הייתה להיות רופא.","ביקור בירושלים היה משאת לבה."]],["מִשֶּׁכְּבָר הַיָּמִים",["מלפני זמן רב"],["משכבר הימים גרו כאן איכרים.","משכבר הימים נהגו לכתוב בקולמוס."]],["מַתְמִיהַּ",["מעורר פליאה, מדהים","מוזר, תמוה"],["זה מתמיה שהוא לא התקשר.","התגלית המתמיהה עוררה סקרנות."]],["נֶאֱלָח",["מתועב, בזוי"],["זה מעשה נאלח לגנוב מעניים.","ריח נאלח עלה מהביוב."]],["נָגַשׂ",["דחק במישהו, רדה בו, דיכא אותו","דרש שהאדם שחייב כסף יחזיר את חובו"],["פרעה נגש בבני ישראל.","הנושה נגש בחייב שיחזיר את חובו."]],["נוֹחַ לַבְּרִיּוֹת",["שקל להסתדר איתו, טוב מזג"],["המורה נוחה לבריות, וכל התלמידים אוהבים אותה.","הוא אדם נוח לבריות."]],["נוֹפֶך",["אחת מאבני החושן","תוספת קלה ועדינה למשמעות או למראה של דבר מה, ניואנס"],["החגורה הוסיפה נופך אלגנטי לשמלה.","ההומור שלו הוסיף נופך מיוחד להרצאה."]],["ניוּאַנְס",["הבדל דק"],["יש ניואנס דק בין שתי המילים.","המתרגם הקפיד על כל ניואנס."]],["נִיחָר",["יבש, בעיקר בהקשר של גרון יבש מדיבור"],["אחרי שעות של נאום גרונו ניחר.","גרונם ניחר מצעקות."]],["נִכְסָף",["דבר רצוי מאוד, שמשתוקקים אליו, נחשק"],["הוא הגיע אל היעד הנכסף.","הרגע הנכסף הגיע, והם נפגשו."]],["נִפְרַע",["שולם","נקם (במישהו)"],["החוב נפרע במלואו.","הוא נפרע מאויביו."]],["נִצַּחַת",["נחרצת, מכרעת"],["הקבוצה ניצחה בתוצאה ניצחת.","היא ענתה תשובה ניצחת."]],["סִדּוּר",["ספר המכיל את התפילות"],["הוא הוציא את הסידור והתחיל להתפלל.","סבא נתן לנכדו סידור לבר המצווה."]],["סָדוּר",["מסודר, מאורגן"],["יש לו סדר יום סדור.","החיים שלה סדורים ורגועים."]],["סוּרֵיאָלִיסְטִי",["לא מציאותי"],["הציור הסוריאליסטי מראה שעונים נמסים.","זה היה מצב סוריאליסטי."]],["סָמוּך עַל שוּלְחָנוֹ",["נהנה מחסדיו, נתמך על ידו"],["הוא סמוך על שולחן הוריו.","העובד היה סמוך על שולחנו של המנהל."]],["סָמַךְ יָדוֹ על (משהו)",["אישר, הסכים"],["השר סמך את ידו על ההצעה.","ההורים סמכו ידיהם על ההחלטה."]],["סָר מֵרַע",["מי שנמנע מלחטוא"],["האדם הצדיק ירא אלוהים וסר מרע.","הוא ידוע כסר מרע."]],["סְרָק",["ריקנות, חוסר תועלת (רעיון סרק - רעיון בלתי מעשי)"],["הרעיון הזה הוא רעיון סרק.","זו הייתה אזעקת סרק."]],["עָלָה בְּקָנֶה אֶחָד",["תאם, השתלב"],["העדות שלו לא עולה בקנה אחד עם הראיות.","ההחלטה לא עולה בקנה אחד עם ערכי החברה."]],["עָמִיל",["סוכן"],["עמיל המכס שחרר את הסחורה בנמל.","הוא עובד כעמיל ביטוח."]],["עֲנָק",["תכשיט לצוואר, מחרוזת"],["היא ענדה ענק של פנינים.","הענק הוצג במוזיאון."]],["עַרְכָּאָה",["שם לדרגה בבית המשפט (שלום, מחוזי או עליון), שלב, רמה"],["התיק עבר לערכאה גבוהה יותר.","ההחלטה ערוערה בכל הערכאות."]],["פַּג",["תינוק שנולד לפני הזמן המיועד"],["הפג הושם באינקובטור.","הפגים זקוקים לטיפול מיוחד."]],["פָּג",["התנדף, הסתיים (פג תוקף - עבר התוקף, לא בתוקף), נעלם"],["הריח פג אחרי שפתחנו את החלון.","תוקף הדרכון פג."]],["פּוֹרֵק עֹל",["מי שנוהג בהפקרות ואינו מקבל מרות, כללים וחוקים"],["הנער פורק העול לא מקשיב לאף אחד.","הם נחשבו לפורקי עול."]],["פִּזּוּר דַּעַת / נֶפֶש",["בלבול, חוסר ריכוז"],["בגלל פיזור דעת, הוא שכח את המפתחות.","פיזור הנפש שלה גרם לה לאבד את הארנק."]],["פִּכָּה",["התפרץ וזרם החוצה, נבע"],["מים פיכו מן הסלע.","דמעות פיכו מעיניה."]],["פְּעָמָיו",["צעדיו (פַּעַם= צעד= שַׁעַל)"],["הוא הפנה את פעמיו לעבר הים.","פעמיו נשמעו במסדרון."]],["פָּרָדוֹקְס",["סתירה פנימית"],["זה פרדוקס: ככל שהוא עובד יותר, כך הוא מרוויח פחות.","הפרדוקס של הזמן העסיק את הפילוסופים."]],["פְּרִישוּת",["התנזרות מתענוגות, חיי צניעות"],["הנזיר חי חיי פרישות.","היא בחרה בפרישות."]],["פֶּרְמָנֶנְטִי",["קבוע"],["הוא עשה פרמננט לשיער.","הם מחפשים פתרון פרמננטי."]],["פָּרַף",["סגר באמצעות כפתורים או רוכסן"],["הוא פרף את כפתורי המעיל.","הילדה פרפה את רוכסן התיק."]],["פַּשְׁטָנִי",["שטחי ולא מעמיק, רדוד"],["הכתבה הציגה תמונה פשטנית של הבעיה.","זה הסבר פשטני מדי."]],["צָבָה",["תפח, התנפח"],["הבצק צבה בחום.","אחרי העקיצה הזרוע צבתה."]],["צֶדַע / צְדָעַיִם / צְדָעוֹת",["רקה/רקות, כל אחד מצדי המצח ליד האוזן"],["הוא עיסה את רקותיו כדי להקל על כאב הראש.","שיער לבן הופיע בצדעיו."]],["צוֹנֵן",["קריר, לא חם"],["הוא שתה מים צוננים ביום החם.","היא קיבלה את החדשות בצורה צוננת."]],["צָלַח",["הצליח","חצה תעלת מים או נהר"],["התוכנית לא צלחה.","החיילים צלחו את התעלה בלילה."]],["צְנִיפָה",["צהלת הסוס"],["צניפת הסוס נשמעה מן האורווה.","הסוסים צנפו בשמחה."]],["קָבַל",["התלונן, רטן"],["התושבים קבלו על הרעש.","הוא קבל בפני המנהל על היחס."]],["קֳבָל עַם וְעֵדָה",["בגלוי, לעיני כל"],["הוא הודה קבל עם ועדה בטעותו.","הם התחייבו קבל עם ועדה לשנות את החוק."]],["קוּנְדֵּסוּת",["מעשה שובבות"],["הקונדסות של הילד הצחיקה את כולם.","מעשה קונדסות קטן הפך לסיפור משפחתי."]],["קִילּוּחַ",["זרם דק, טפטוף"],["קילוח המים מהברז לא פסק.","קילוח של שמן זית נשפך על הסלט."]],["קַל דַּעַת",["נמהר, פזיז"],["הוא קל דעת ומוציא את כל כספו.","ההחלטה נראתה קלת דעת."]],["קַל תְּפִיסָה",["כינוי למי שמבין דברים במהירות"],["התלמיד קל התפיסה הבין את התרגיל מיד.","היא קלת תפיסה ולומדת מהר."]],["קָפַח",["הכה, הלם (שמש קופחת - שמש מחממת מאוד, שמש \"מכה\")"],["השמש קופחת על הראש.","הוא קפח במקל על הדלת."]],["קְרֵי",["דהיינו, כלומר"],["הם יגיעו בסוף החודש, קרי בעוד שבועיים.","צריך לקנות מצרכים, קרי חלב ולחם."]],["קָרַם עוֹר וְגִידִים",["החל להיעשות ממשי, התממש"],["התוכנית קרמה עור וגידים.","החלום לפתוח מסעדה קורם עור וגידים."]],["קָשִׁישׁ",["זקן מאוד, ישיש"],["הקשיש ישב על הספסל בפארק.","המתנדבים עוזרים לקשישים בשכונה."]],["רְבָבָה",["עשרת אלפים"],["רבבות אנשים השתתפו בהפגנה.","רבבה של כוכבים נצצו בשמיים."]],["רָמָה / עָלְתָה קַרְנוֹ",["נחל הצלחה וזכה לכבוד"],["קרנו של הסופר עלתה אחרי ספרו השני.","קרנה של החברה רמה בשוק."]],["רִפְרֵף",["בחן משהו באופן שִטחי ומהיר מבלי להתעמק בו, העיף מבט","ריחף, גלש"],["הוא רפרף על הכתבה ולא הבין את עיקרה.","הפרפר רפרף מעל הפרחים."]],["שְׁאֵר בָּשָׂר",["קרוב, בן משפחה"],["כל שאר בשרו הגיעו לחתונה.","היא לא הכירה את שאר בשרה."]],["שׁוּמָה",["בליטה בגוף (דומה לנקודת חן גדולה)","הערכה, אומדן (פקיד שומה - פקיד מס)"],["הרופא בדק את השומה בגבו.","פקיד השומה קבע את המס."]],["שְׁכִיב מְרַע",["חולה אנוש, גוסס"],["המלך שכב שכיב מרע ושלח לקרוא לבניו.","הוא כתב צוואה כשהיה שכיב מרע."]],["שָׂם נַפְשוֹ בְּכַפּוֹ",["סיכן את עצמו"],["הכבאי שם נפשו בכפו ונכנס לבית הבוער.","העיתונאית שמה נפשה בכפה בדיווח מהקרב."]],["שָׁנוּן",["חריף, פיקח","חד, מושחז"],["יש לו מוח שנון.","הסכין השנונה חתכה את החבל."]],["שָנַק / שִנֵק",["חנק"],["העשן שנק אותו.","הכלב נשנק מהקולר."]],["שִׁעוּר",["גודל, מידה"],["שיעור הירידה במחירים הפתיע את כולם.","שיעור הצמיחה השנה היה גבוה."]],["שִׁפּוּל",["תחתית, החלק הנמוך (שיפולי ההרים - המדרונות התחתיים)"],["הכפר נמצא בשיפולי ההר.","בשיפולי השמלה היה כתם."]],["שָׁת",["שם, הניח"],["הוא שת את ידו על כתפה.","הם שתו לבם לסכנה."]],["תִּמּוּכִין",["מקור מוסמך כתוב, אסמכתא","גיבוי, חיפוי"],["החוקר מצא תימוכין לטענתו במסמכים.","אין תימוכין לשמועה."]],["תָּמִיר",["גבוה, זקוף"],["עצי הדקל התמירים התנשאו מעל החוף.","הוא עמד תמיר וזקוף."]],["תַּעַר",["סכין גילוח"],["הספר גילח את הלקוח בתער.","הוא התגלח בתער חד."]],["תָּפֵל",["חסר טעם עקב מחסור בתבלינים, סר טעם","סתמי, חסר משמעות"],["המרק היה תפל, צריך להוסיף מלח.","השיחה הייתה תפלה ומשעממת."]],["תֶּקֶר",["חור בצמיג הגורם לבריחת האוויר ממנו ולהשבתת הגלגל, פנצ'ר"],["הנהג עצר בצד הדרך בגלל תקר.","הם תיקנו את התקר בתחנת הדלק."]]], en: [["about",["אודות","ליד, בערך"],["The book is about a family that moves to a new country.","הספר עוסק במשפחה שעוברת לארץ חדשה."]],["as",["כמו","כאשר, כש-"],["She works as a nurse in a large hospital.","היא עובדת כאחות בבית חולים גדול."]],["both",["שניהם"],["Both of my brothers live in Tel Aviv.","שני האחים שלי גרים בתל אביב."]],["comparatively",["באופן יחסי"],["The test was comparatively easy this year.","המבחן היה קל באופן יחסי השנה."]],["correspondingly",["בהתאמה"],["Prices rose, and salaries rose correspondingly.","המחירים עלו, והמשכורות עלו בהתאמה."]],["e.g.",["לדוגמה"],["Some fruits, e.g. oranges and lemons, are rich in vitamin C.","חלק מהפירות, לדוגמה תפוזים ולימונים, עשירים בוויטמין C."]],["equally",["במידה שווה"],["The two teams played equally well.","שתי הקבוצות שיחקו טוב במידה שווה."]],["for example",["לדוגמה"],["Many animals, for example bears, sleep during the winter.","בעלי חיים רבים, לדוגמה דובים, ישנים במהלך החורף."]],["for instance",["לדוגמה"],["Some cities, for instance Paris, attract millions of tourists.","ערים מסוימות, לדוגמה פריז, מושכות מיליוני תיירים."]],["identically",["באופן זהה"],["The twins were dressed identically.","התאומים היו לבושים באופן זהה."]],["in other words",["במילים אחרות"],["He failed the exam; in other words, he must take it again.","הוא נכשל במבחן; במילים אחרות, הוא חייב לגשת אליו שוב."]],["in the same way",["באותו אופן"],["Birds build nests in the same way their parents did.","ציפורים בונות קנים באותו אופן שהוריהן בנו."]],["just as",["בדיוק כמו"],["Just as I was leaving, the phone rang.","בדיוק כשיצאתי, הטלפון צלצל."]],["like",["כמו","לחבב, להעדיף"],["She sings like a professional.","היא שרה כמו זמרת מקצועית."]],["likewise",["כמו-כן, באותו אופן"],["He left early, and his friends did likewise.","הוא יצא מוקדם, וחבריו עשו כמו-כן."]],["similarly",["באופן דומה"],["Cats hunt at night; similarly, owls are active in the dark.","חתולים צדים בלילה; באופן דומה, ינשופים פעילים בחושך."]],["such as",["כמו למשל"],["I enjoy outdoor sports such as hiking and cycling.","אני נהנה מספורט בחוץ, כמו למשל טיולים ורכיבה על אופניים."]],["that",["ש-"],["I know that you are telling the truth.","אני יודע שאתה אומר את האמת."]],["above all",["מעל לכל"],["Above all, remember to stay calm during the exam.","מעל לכל, זכור להישאר רגוע במהלך המבחן."]],["absolutely",["לחלוטין"],["I am absolutely sure that I locked the door.","אני בטוח לחלוטין שנעלתי את הדלת."]],["both... and…",["גם... וגם..."],["The movie is both funny and moving.","הסרט גם מצחיק וגם מרגש."]],["certainly",["בהחלט, בוודאי"],["She will certainly pass the test.","היא בהחלט תעבור את המבחן."]],["chiefly",["בעיקר"],["The region is known chiefly for its wine.","האזור ידוע בעיקר בזכות היין שלו."]],["either... or…",["או... או..."],["You can either call me or send me an email.","אתה יכול או להתקשר אליי או לשלוח לי מייל."]],["especially",["במיוחד"],["I love fruit, especially strawberries.","אני אוהב פי function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function addDays(s,n){const d=parseDs(s);d.setDate(d.getDate()+n);return ds(d);}
function lastSaturday(s){return addDays(s,-((parseDs(s).getDay()+1)%7));}

function migrate(s){
  if(s.v===1){
    const n=s.dayCount||1, d=s.day, review={};

}

}
function save(){if(!S||!R.current)return;S.updatedAt=Date.now();try{localStorage.setItem(skey(R.current,L),JSON.stringify(S));}catch(e){}}
const me=()=>R.profiles.find(p=>p.id===R.current);

/* ---------- day round ---------- */
function autoFinalize(){if(S.day&&S.day.stage!=="done"&&S.day.date!==todayStr())finishDay();}
const needNewDay=()=>!S.day||(S.day.stage==="done"&&S.day.date!==todayStr());
function startDay(){
  if(S.pos>=TOTAL)return;
  const ids=S.order.slice(S.pos,S.pos+S.perDay);
  S.pos+=ids.length;S.dayCount++;
  S.day={n:S.dayCount,date:todayStr(),ids,stage:"learn",learnIdx:0,reviewIds:null,attempts:[],score:null};
  save();
}
function stripParens(t){return t.replace(/\([^)]*\)/g,"").replace(/\s+([,.;])/g,"$1").replace(/\s+/g," ").replace(/[\s,;-]+$/,"").trim();}
function cleanDefs(id){return W[id][1].map(d=>stripParens(d)||d).join("; ");}
function label(id,type){return type==="w2d"?cleanDefs(id):W[id][0];}
function parts(id){return W[id][1].flatMap(d=>stripParens(d).split(/[,;]/)).map(x=>x.trim()).filter(Boolean);}
function overlaps(a,b){const pa=new Set(parts(a));return parts(b).some(x=>pa.has(x))||W[a][0].toLowerCase()===W[b][0].toLowerCase();}
function makeQ(id,review){
  const type=Math.random()<0.5?"w2d":"d2w",opts=[id],seen=new Set([label(id,type)]);let guard=0;
  while(opts.length<4&&guard++<800){const r=Math.floor(Math.random()*TOTAL);if(opts.includes(r)||opts.some(o=>overlaps(o,r)))continue;const L2=label(r,type);if(seen.has(L2))continue;seen.add(L2);opts.push(r);}
  return {id,type,review,opts:shuffle(opts),pick:null};
}
function startTest(){
  const d=S.day;
  if(!d.reviewIds)d.reviewIds=Object.keys(S.review).map(Number).filter(id=>!d.ids.includes(id)).sort((a,b)=>S.review[a]-S.review[b]).slice(0,REVIEW_MAX);
  d.attempts.push({items:shuffle(d.ids.map(id=>makeQ(id,false)).concat(d.reviewIds.map(id=>makeQ(id,true)))),idx:0});
  d.stage="test";save();
}
function finishDay(){
  const d=S.day,last={};
  d.attempts.forEach(a=>a.items.forEach(q=>{if(q.pick!==null)last[q.id]=q.pick===q.id;}));
  d.ids.concat(d.reviewIds||[]).forEach(id=>{
    if(last[id]===true){delete S.review[id];S.mastered[id]=d.n;}
    else if(last[id]===false||d.ids.includes(id)){delete S.mastered[id];S.review[id]=S.review[id]||d.n;}
  });
  const done=d.attempts.filter(a=>a.score), ls=done.length?done[done.length-1].score:null;
  d.score=ls;d.stage="done";
  S.history.push({n:d.n,date:d.date,ids:d.ids,correct:ls?ls.correct:null,total:ls?ls.total:null,tries:done.length});
  save();
}

/* ---------- weekly test ---------- */
function weeklyPool(sat){const from=addDays(sat,-7),set=new Set();S.history.forEach(h=>{if(h.ids&&h.date>=from&&h.date<sat)h.ids.forEach(id=>set.add(id));});return [...set];}
function weeklyDue(){
  if(!needNewDay())return false;
  if(S.weekly&&!S.weekly.passed)return true;
  const sat=lastSaturday(todayStr());
  if(S.lastWeekly&&S.lastWeekly>=sat)return false;
  if(!weeklyPool(sat).length){S.lastWeekly=sat;save();return false;}
  return true;
}
function startWeeklyAttempt(){
  if(!S.weekly||S.weekly.passed){const sat=lastSaturday(todayStr());S.weekly={sat,pool:weeklyPool(sat),attempts:[],passed:false};}
  const w=S.weekly,ids=shuffle([...w.pool]).slice(0,WEEKLY_SIZE);
  w.attempts.push({items:shuffle(ids.map(id=>makeQ(id,false))),idx:0});
  save();
}

/* ---------- tests (shared) ---------- */
const ctxObj=ctx=>ctx==="weekly"?S.weekly:S.day;
function cur(ctx){const o=ctxObj(ctx);return o&&o.attempts[o.attempts.length-1];}
function answer(ctx,optId){const z=cur(ctx),q=z.items[z.idx];if(q.pick!==null)return;q.pick=optId;save();render();}
function nextQ(ctx){
  const z=cur(ctx);
  if(z.idx<z.items.length-1){z.idx++;save();window.scrollTo(0,0);render();return;}
  const correct=z.items.filter(q=>q.pick===q.id).length;
  z.score={correct,total:z.items.length};
  if(ctx==="weekly"){
    if(correct/z.items.length>=PASS){
      z.items.forEach(q=>{if(q.pick!==q.id){delete S.mastered[q.id];S.review[q.id]=S.review[q.id]||S.dayCount;}});
      S.weekly.passed=true;S.lastWeekly=S.weekly.sat;
    }
    save();go("wresult");return;
  }
  S.day.stage="learn";
  if(correct===z.items.length)finishDay();else save();
  go("result");
}

function wordTitle(id){return `<p class="word"><span><bdi>${esc(W[id][0])}</bdi></span></p>`;}
function defsHtml(id){const d=W[id][1];return d.length>1?`<ol class="defs">${d.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<ul class="defs single"><li>${esc(d[0])}</li></ul>`;}

}

function missList(items){const miss=items.filter(q=>q.pick!==q.id);return miss.length?`<h2>מילים שטעית בהן</h2><ul class="miss">${miss.map(q=>`<li><div class="mw"><bdi>${esc(W[q.id][0])}</bdi></div>${esc(W[q.id][1].join("; "))}</li>`).join("")}</ul>`:"";}

  <div class="foot">

function deckIds(deck){
