דיף לא לקנות את הרכב.","ההחלטה אושרה בדיעבד, אחרי שהעבודה כבר הסתיימה."]],["בּוּר",["שדה לא מעובד שלא נחרש או נזרע"],["השדה עמד בור במשך שנים.","המתיישבים הפכו את אדמת הבור לגן פורח."]],["בּוּר (וְעַם הָאָרֶץ)",["חסר השכלה, אנאלפבית"],["בענייני פוליטיקה הוא בור ועם הארץ.","אל תהיה בור, תקרא קצת על הנושא לפני שאתה מתווכח."]],["בֵּיבָר",["גן- חיות"],["בביבר הספארי ראינו אריות, ג׳ירפות וזברות.","הביבר העירוני נסגר והחיות הועברו לשמורה."]],["בְּכִי תַּמְרוּרִים",["בכי מר על אסון, התייפחות"],["כשקיבלה את הבשורה המרה, פרצה בבכי תמרורים.","בבית האבל נשמע בכי תמרורים."]],["בֶּכֶר",["גמל צעיר"],["הבכר הלך צמוד לאמו הגמלה.","הבדואי מכר בכר צעיר בשוק."]],["בִּמְשוּרָה",["כמות קטנה ומצומצמת (לקוח מהביטוי “ מים במשורה ”)"],["המנהל מחלק מחמאות במשורה.","בתקופת הבצורת חילקו את המים במשורה."]],["בָּעֲרָה חֲמָתוֹ",["זעם, כעס, רגז"],["כשגילה שהמכונית שלו נשרטה, בערה חמתו.","חמתו של המלך בערה בו כששמע על הבגידה."]],["בַּר-כִּבּוּשׁ",["שאפשר לכבוש אותו"],["הפסגה נחשבה בלתי ברת כיבוש בגלל הסלעים החלקים.","המבצר היה בר כיבוש רק בזכות שער סודי."]],["גֵּאוּת",["עליית מפלס מי הים"],["בשעות הגאות המים מכסים את הסלעים שבחוף.","בזמן הגאות אי אפשר ללכת לאי ברגל."]],["גִּבֵּב",["אסף חפצים שונים וערם אותם בערימה, שם דברים זה על גבי זה ללא סדר"],["הוא גיבב את כל הבגדים בערימה על הכיסא.","במאמר גובבו עובדות לא קשורות בלי סדר."]],["גָּדִיד",["קטיף תמרים"],["בעונת הגדיד עובדים בקיבוץ גם מתנדבים רבים.","הגדיד נעשה בעזרת מנופים שמגיעים לראש הדקל."]],["גוּמְחָה",["שֶקַע בקיר"],["בגומחה שבקיר עמד פסל קטן.","הם הניחו נרות בגומחות שבמערה."]],["גִּידֵּף",["קִלֵל"],["הנהג הזועם גידף את הנהג שחסם אותו.","השחקן הורחק מהמגרש אחרי שגידף את השופט."]],["גַלְעֶד",["יד, אנדרטה, מצבה"],["במקום הקרב הוקם גלעד לזכר הנופלים.","על הגבעה עומד גלעד לזכר החלוצים."]],["דָּווּי",["מיוסר, כואב, מעונה"],["האם הדוויה בכתה על בנה החולה.","הם הלכו בשורה דוויה אחרי ארון המת."]],["דִּכְדּוּךְ",["דיכאון, עצב, מועקה נפשית"],["בימי החורף האפורים הוא שקע בדכדוך.","אחרי הפיטורים עבר עליה תקופה של דכדוך."]],["דַּש",["קפל בבגד"],["היא הכניסה את המכתב לדש המעיל.","דשי החליפה שלו היו רחבים ומיושנים."]],["דָּשׁ בַּעֲקֵבָיו",["מזלזל"],["הוא דש בעקביו את הוראות הבטיחות.","אל תדוש בעקביך את עצות ההורים שלך."]],["הֵאִיץ",["הוסיף מהירות, זירז"],["הנהג האיץ כשהרמזור התחלף לירוק.","המאמן האיץ בשחקנים לרוץ מהר יותר."]],["הִגְלָה",["גירש מישהו ממולדתו"],["האימפריה הבבלית הגלתה את תושבי יהודה.","הדיקטטור הגלה את מתנגדיו לאי מרוחק."]],["הַדְלִיף",["גילה למישהו דבר שהיה אמור להישאר חסוי"],["מישהו הדליף את פרטי ההסכם לעיתונות.","העובד פוטר אחרי שהדליף מידע סודי למתחרים."]],["הוֹנָה",["רימה, הטעה"],["המוכר הונה את הקונים ומכר להם סחורה פגומה.","הנוכל הונה קשישים והוציא מהם את חסכונותיהם."]],["הוּעַם",["הפך לקהה, טושטש, עורפל"],["עם השנים הועם זיכרון הילדות שלו.","האור בחדר הועם כשהתחיל הסרט."]],["הֶחְטִיא",["גרם למישהו לבצע חטא"],["החבורה הרעה החטיאה את הנער וגררה אותו לגניבות.","הנחש החטיא את חוה, לפי סיפור גן עדן."]],["הִקָּווּת",["היאספות של מים במקום מסוים (מקווה מים)"],["הקווות מים בשטח עלולה למשוך יתושים.","התעלה נועדה למנוע הקווות מים ליד הבתים."]],["הִלְבִּין פָּנִים",["בייש, העליב"],["המורה הלבינה את פני התלמיד כשצחקה עליו מול הכיתה.","בתורה נאמר שהמלבין פני חברו ברבים כאילו שופך דמים."]],["הָלַךְ עִמּוֹ בְּקֶרִי",["פעל נגדו, פעל באופן שיעצבן אותו, \"עשה לו דווקא\""],["השכן הלך עמנו בקרי וחנה בכוונה מול השער שלנו.","הילד הולך בקרי עם הוריו ועושה בדיוק את מה שאסרו עליו."]],["הֲלָצָה",["בדיחה"],["הנואם פתח בהלצה שהצחיקה את כל הקהל.","ההלצות של הדוד כבר מוכרות לכל בני המשפחה."]],["הֵנִיא",["גרם לו לא לעשות את שתכנן, מנע בעדו"],["החברים הניאו אותו מלעזוב את הלימודים.","מזג האוויר הסוער הניא אותנו מלצאת לשייט."]],["הִסְבִּיר פָּנִים",["האיר פנים, התנהג בצורה נחמדה"],["המארחת הסבירה פנים לכל אורח שנכנס.","הפקידה הסבירה פנים וענתה על כל השאלות בסבלנות."]],["הִסְתּוֹדֵד",["התלחש עם מישהו"],["שתי החברות הסתודדו בפינת הכיתה.","העובדים הסתודדו במסדרון על הפיטורים הצפויים."]],["הֶעְתִּיר",["העניק בנדיבות וברוחב לב"],["סבתא העתירה מתנות על נכדיה.","המבקרים העתירו שבחים על הסרט."]],["הִצְנִיעַ",["הניח דבר מה כך שלא יבלוט, החביא, הסתיר"],["היא הצניעה את התכשיטים בתוך קופסה בארון.","למרות הצלחתו, הוא נוהג להצניע את הישגיו."]],["הֵצֵר צְעָדָיו",["הגביל, הפריע לו ומנע את התקדמותו"],["הביורוקרטיה הצרה את צעדי היזמים הצעירים.","השלטון הצר את צעדיהם של העיתונאים."]],["הִקְשָה אֶת לִיבּוֹ / עָרְפּוֹ",["התעקש, לא וויתר, המשיך לסרב"],["למרות הבקשות, המנהל הקשה את ליבו ולא אישר את החופשה.","פרעה הקשה את ליבו ולא שילח את בני ישראל."]],["הֶרֶף עַיִן",["פרק זמן קצר מאוד, רגע"],["בהרף עין הכול השתנה.","הגנב נעלם בהרף עין."]],["הִשְׁתַּנֵּק",["התקשה לבלוע או לדבר בגלל התרגשות שמנעה מעבר תקין של האוויר, נחנק, מעבר האוויר אליו נחסם"],["הילד השתנק מבכי ולא הצליח לדבר.","הוא השתנק מהעשן וברח מהחדר."]],["הִתְוַדֵּעַ",["ערך היכרות עם מישהו/משהו חדש, הכיר לראשונה"],["בטיול התוודענו לתרבות המקומית.","היא התוודעה לשכנים החדשים במסיבת השכונה."]],["הִתְפַּלֵּשׁ",["התגלגל בעפר או בלכלוך"],["החזירים התפלשו בבוץ.","הילדים התפלשו בחול ביום הכיף."]],["הִתְרַפֵּס",["התחנף למישהו, לחך את עפר רגליו"],["העובד התרפס בפני המנהל כדי לקבל קידום.","לא נעים לראות אותו מתרפס מול כל אדם חשוב."]],["זָלַג",["נטף, נזלו ממנו טיפות","זרם במקום בלתי רצוי"],["דמעות זלגו על לחייה.","המים זלגו מהתקרה אל המטבח."]],["זָעוּם",["מעט מאוד"],["הוא קיבל שכר זעום על עבודה קשה.","הסיכוי שהטיסה תמריא בזמן הוא זעום."]],["זַרְזִיף",["זרם דק"],["זרזיף מים דק יצא מהברז.","רק זרזיף של לקוחות נכנס לחנות ביום הגשום."]],["חַבּוּרָה",["סימן כחול / נפיחות כתוצאה ממכה"],["אחרי הנפילה הופיעה חבורה כחולה על הברך.","המתאגרף יצא מהקרב מכוסה חבורות."]],["חוּצוֹת",["שטחים פתוחים, רחובות"],["לילדים אסור לשוטט בחוצות העיר בלילה.","בחוצות העיר נתלו דגלים לכבוד החג."]],["חִיבּוּץ",["תהליך הכנת החמאה והשמנת"],["בחיבוץ המסורתי מנערים את השמנת עד שנוצרת חמאה.","במפעל החלב עוסקים בחיבוץ ובייצור גבינות."]],["חַלּוּק נַחַל",["אבן חלקה שנשחקה על ידי זרימת מים"],["הילדים אספו חלוקי נחל צבעוניים בחוף.","הוא החזיק חלוק נחל חלק בכיסו למזל."]],["חֶנְוָנִי",["בעל מכולת"],["החנווני השכונתי מכיר את כל לקוחותיו בשמם.","החנווני מכר לנו לחם וחלב על ההקפה."]],["חַרְטוֹם",["החלק הקדמי של חפץ כלשהו, כלי שייט/טייס, בעל- חיים"],["חרטום הספינה חתך את הגלים.","לציפור היה חרטום ארוך ומחודד."]],["חָשׁ",["הרגיש","הזדרז, מיהר, נחפז, נבהל, נזעק, אצה לו השעה"],["היא חשה כאב חד בגב.","השכנים חשו לעזרת המשפחה כשפרצה השריפה."]],["חֲתִימַת שָׂפָם",["ראשית צמיחתו של השפם"],["בתמונה נראה הנער עם חתימת שפם ראשונה.","הנער התגאה בחתימת השפם הדקה שלו."]],["טָמִיר",["נסתר, סודי, בלתי מוכר"],["במערה נמצא מקום טמיר שבו הוחבא הכסף.","הוא חשף את הרגשות הטמירים ביותר שלו ביומנו."]],["טָף",["שם כולל לילדים קטנים/תינוקות"],["הנשים והטף פונו מהעיר לפני הקרב.","בגן הציבורי שיחקו טף ומבוגרים."]],["טַרְחָן",["טרדן, נודניק, אדם שמטריח אחרים"],["הלקוח הטרחן התקשר עשר פעמים ביום.","אל תהיה טרחן, תן לי לסיים את העבודה."]],["יְבָבָה",["יללה, בכי ממושך או מקוטע (על פי רוב לא חזק)"],["מהחדר נשמעה יבבה של תינוק.","הכלב השמיע יבבות כשנשאר לבד בבית."]],["יְדִיד נֶפֶשׁ",["חבר נפש, חבר טוב"],["הם ידידי נפש עוד מימי בית הספר.","בשעה קשה היא פנתה אל ידידת נפשה."]],["יִלּוֹד",["תינוק רך (בשבועות הראשונים לחייו)"],["האחות עטפה את הילוד בשמיכה.","בבית החולים נולדו השבוע שלושים ילודים."]],["יָצוּעַ",["מיטה, משכב, כלי מיטה שמציעים לשכיבה"],["הוא עלה על יצועו מוקדם בגלל עייפות.","החולה שכב על יצועו ולא קם במשך ימים."]],["יָרֵא",["פוחד, מבועת"],["הילד היה ירא לצאת לבד בחושך.","העם היה ירא מפני השליט האכזר."]],["יָרַד לַטִּמְיוֹן",["הלך לאיבוד, אבד (משמש בהתייחסות לדבר שקרה לאחר כישלון)"],["כל ההשקעה בעסק ירדה לטמיון.","המאמצים לשכנע אותו ירדו לטמיון."]],["יְשׁוּעָה",["הצלה"],["הניצולים חיכו לישועה במשך שלושה ימים.","הגשם שירד אחרי הבצורת היה ישועה לחקלאים."]],["כּוֹנֵן",["ייסד, הקים"],["בני הזוג כוננו בית חם לילדיהם.","אחרי המהפכה כוננה ממשלה חדשה."]],["כִּחְכּוּחַ",["השמעת קול חיכוך בגרון"],["המרצה השמיע כחכוח לפני שהתחיל לדבר.","מהשורה האחורית נשמע כחכוח של אורח שהשתעמם."]],["כִּיסוּפִים",["געגועים, השתוקקות"],["במכתביו מהנכר הוא הביע כיסופים לבית.","השיר מלא כיסופים לארץ ישראל."]],["כְּלָיָה",["חיסול, השמדה"],["האויב זמם להביא כליה על העם.","המין הזה של הצפרדעים עומד בסכנת כליה."]],["כְּמִיהָה",["השתוקקות"],["בעיניה נראתה כמיהה עמוקה לחזור הביתה.","השיר מבטא כמיהה לאהבה אמיתית."]],["כְרוֹנוֹלוֹגִי",["ערוך בסדר זמנים עוקב"],["בספר ההיסטוריה האירועים מסודרים בסדר כרונולוגי.","היא סיפרה את הסיפור בסדר כרונולוגי, מההתחלה ועד הסוף."]],["כִּתֵּת אֶת רַגְלָיו",["הלך הרבה"],["כיתתי את רגליי בין המשרדים כדי לקבל אישור אחד.","הוא כיתת את רגליו בכל חנויות העיר בחיפוש אחר המתנה המושלמת."]],["לַהַב",["החלק החד של כלי חיתוך, סכין, פגיון, חרב"],["להב הסכין היה חד מאוד.","הלוחם הניף את להב החרב."]],["לָקָה",["חלה במשהו, נפל למשכב"],["סבא לקה בשפעת ונשאר במיטה שבוע.","העץ לקה במחלה והתייבש."]],["מְאוּבָּן",["דבר שנתקשה כאבן","נדהם, משותק"],["במוזיאון מוצגים שלדים מאובנים של דינוזאורים.","היא עמדה מאובנת כששמעה את הבשורה."]],["מְבוֹאָה",["לובי, אולם כניסה"],["האורחים חיכו במבואה עד שייפתחו דלתות האולם.","במבואת הבניין יש שולחן לשומר."]],["מַהַתַלָה",["שובבות, מעשה קונדסות"],["התלמידים ערכו מהתלה למורה ביום האחרון של השנה.","הוא נפל קורבן למהתלה של חבריו."]],["מְזָוֶוה",["ארון או חלל קטן המיועד לאחסון מוצרי מזון"],["סבתא שמרה במזווה צנצנות של ריבה.","המזווה היה מלא בשקי קמח ואורז."]],["מְחִית",["מאכל עשוי מפירות או ירקות מעוכים, פירה"],["לתינוק הגישו מחית תפוחים.","היא הכינה מחית בטטה לארוחת הערב."]],["מָחַל",["סלח"],["היא מחלה לו על השקר.","אחרי שנים של נתק, הוא מחל לאחיו."]],["מַחְצָב",["חומר שחוצבים מן האדמה כגון: אבנים, פחם, מתכת וכו'"],["ישראל ענייה במחצבים כמו נפט וזהב.","מלחי ים המלח הם מהמחצבים החשובים באזור."]],["מַחְצָבָה",["מקום בו חוצבים אבנים לבניין וכו'"],["הרעש מהמחצבה הפריע לתושבי הכפר.","האבנים לבניית העיר נחצבו במחצבה סמוכה."]],["מְטִיל",["גוש מתכת יצוקה בצורה כלשהי"],["המפעל מייצר מטילי זהב.","מטילי ברזל נערמו במחסן הנמל."]],["מַטָף",["מיכל שמשמש לכיבוי אש"],["המלצר כיבה את האש במטבח בעזרת מטף.","ליד כל יציאה בבניין מותקן מטף."]],["מִיכֵּן",["התקין מכונות במקום מסוים לצורך ביצוע עבודות שעד כה נעשו באופן ידני"],["המפעל מיכן את פס הייצור ופיטר חלק מהעובדים.","החקלאים מיכנו את הקציר ברבע המאה האחרונה."]],["מְכוּנָף",["שיש לו כנפיים"],["בתמונה נראה סוס מכונף שדואה מעל העננים.","נמלים מכונפות יוצאות מהקן אחרי הגשם."]],["מַכּוֹת נֶאֱמָנוֹת / נִמְרָצוֹת",["מכות חזקות מאוד"],["הבריון הכה את הנער מכות נמרצות.","הקבוצה ספגה מכות נאמנות מהיריבה."]],["מִכְסָה",["כמות מסוימת שנקבעה מראש"],["לכל מדינה נקבעה מכסה של כרטיסים למשחקים.","הדייגים חרגו ממכסת הדגים שהותרה להם."]],["מַעֲטֶה",["כיסוי, כְּסוּת, מעטֶפֶת"],["מעטה של שלג כיסה את ההרים.","מאחורי מעטה של אדיבות הסתתרה כוונה רעה."]],["מְפַעְפֵּעַ",["מחלחל, חודר","מעלה בועות משמיע רשע של מים רותחים, מבעבע"],["מים מפעפעים דרך הסדקים בקיר.","המים בקומקום מפעפעים ומוכנים לתה."]],["מַצְבִּיא",["מפקד צבאי בכיר, קצין"],["נפוליאון היה אחד המצביאים הגדולים בהיסטוריה.","המצביא הוביל את צבאו לניצחון."]],["מַקְרֵן",["רדיאטור","מכשיר להקרנת שקופיות"],["בחורף הדלקנו את המקרן כדי לחמם את החדר.","המורה הקרינה את התמונות על הקיר בעזרת מקרן."]],["מִקְשָׁה",["שדה דלועים (אבטיחים, דלעות, קישואים או מלונים)"],["הם שתלו במקשה אבטיחים ומלונים.","שומר המקשה גירש את הילדים שגנבו אבטיחים."]],["מַרְזֵב",["צינור לניקוז מים מגג הבניין לאדמה או לביוב"],["המרזב נסתם בעלים והמים גלשו על הקיר.","מים זרמו מהמרזב אל הגינה."]],["מַרְשֶה",["מי שנתן ייפוי כוח לאדם אחר כדי שייצג אותו (לרוב הכוונה ללקוח של עורך הדין)"],["עורך הדין הגן על מרשהו בלהט.","הפרקליטה נפגשה עם מרשתה לפני הדיון."]],["מְשׁוּבָה",["מעשה קונדס, שובבות"],["הילדים ביצעו משובה והחביאו את נעלי המורה.","הצחוק שלו היה מלא משובה."]],["מְשׁוּבַת נְעוּרִים",["מעשה שנובע מקלות דעת או משובבות"],["את הכתובת על הקיר כתב במשובת נעוריו.","השופט התחשב בכך שהמעשה היה משובת נעורים."]],["מָשַׁח",["מרח (בד\"כ שמן)","יצק שמן על דבר בכדי לקדשו"],["האופה משח את הבצק בחלמון.","שמואל הנביא משח את דוד למלך."]],["מִשְׁלַח יָד",["עבודה, עיסוק, מקצוע"],["משלח ידו הוא נגרות.","בטופס התבקשנו לציין את משלח ידנו."]],["מִשְׁעוֹל",["דרך עפר צרה, שביל"],["הלכנו במשעול הצר שבין הכרמים.","המשעול התפתל במורד הגבעה."]],["מִשְׁתָּלָה",["מקום בו מגדלים ומוכרים שתילים"],["קנינו במשתלה שתילי עגבניות ופרחים.","במשתלה העירונית מגדלים את העצים לשדרות העיר."]],["מִתְרָס",["מחסום מאולתר מחפצים שונים"],["המפגינים בנו מתרס מצמיגים וארגזים.","השוטרים פינו את המתרסים מהכביש."]],["נְחוּשְתַּיִים",["שלשלאות שנועדו למנוע את חופש התנועה של האסירים, כבלים"],["האסיר הובל לבית המשפט כבול בנחושתיים.","העבדים עבדו בשדות בנחושתיים."]],["נַיָּח",["קבוע, מקובע, שאינו נייד, לא ניתן להזיזו ממקום למקום"],["הטלפון הנייח כמעט נעלם מהבתים.","המצלמה הנייחת מתעדת את מה שקורה בכניסה."]],["נִיחוֹח",["ריח נעים וטוב"],["ניחוח של לחם טרי עלה מהמאפייה.","בגינה עמד ניחוח של פריחת הדרים."]],["נִיתֵּץ",["ניפץ לרסיסים, ריסק"],["הסערה ניתצה את חלונות הבית.","משה ניתץ את לוחות הברית כשראה את עגל הזהב."]],["נִכְנַס בָּעֳבִי הַקוֹרָה",["התמודד עם הבעיה, ירד לעומקו של עניין"],["לפני שנחליט, צריך להיכנס בעובי הקורה ולבדוק את כל הפרטים.","השרה החדשה נכנסה בעובי הקורה והכירה את כל הבעיות."]],["נָס",["נעלם, התפוגג","ברח, נמלט"],["הצבע נס מהבגד אחרי כביסות רבות.","הגנב נס על נפשו כששמע את הסירנה."]],["נָפַל עַל אוֹזְנַיים עֲרֵלוֹת",["לא הקשיבו למה שאמר, דיבר אל העצים והאבנים"],["האזהרות של המומחים נפלו על אוזניים ערלות.","ההסברים שלי לילד נופלים על אוזניים ערלות."]],["נִפְתָּל",["עקלקל, פתלתל","ערמומי, תחבולני"],["הדרך הנפתלת עלתה אל הכפר.","הוא תכנן מזימה נפתלת כדי לקבל את הירושה."]],["נִצָּב",["ידית של חרב, קת","עמד, מוקם","אנך","שחקן בתפקיד שולי שמשמש כתפאורה, סטטיסט"],["הוא אחז בניצב החרב בשתי ידיו.","בסרט השתתפו מאות ניצבים בסצנות הקרב."]],["נְקִי כַּפַּיִים",["ישר, הגון, צדיק"],["השופט ידוע כאדם נקי כפיים.","הציבור רוצה נבחרים נקיי כפיים."]],["נִקְלֶה",["בזוי, נחות, בעל ערך נמוך"],["הוא נאלץ לעבוד בעבודות נקלות.","נקלה בעיניו לבקש עזרה מאחיו."]],["נְקָפוֹ לִבּוֹ / מַצְפּוּנוֹ",["נתקף ייסורי מצפון, התחרט"],["לא נקפו לבו כששיקר לחברים הכי טובים שלו.","כשראה את הילד בוכה, נקפו מצפונו."]],["נִשְׂגָב מִבִּינָתוֹ",["אינו יכול להבין את הדבר"],["המתמטיקה הזאת נשגבת מבינתי.","מה שקרה באותו יום נשגב מבינתם של החוקרים."]],["סָבַב אוֹתוֹ בְּכַחַשׁ",["שיקר לו, רימה אותו"],["הוא סבב אותה בכחש ולקח ממנה כסף.","היועץ סבב את לקוחותיו בכחש במשך שנים."]],["סוֹאֵן",["רועש"],["הם גרים ברחוב סואן במרכז העיר.","מהבית ליד הכביש הסואן לא שומעים את הציפורים."]],["סוּמָא",["עיוור"],["הסומא מצא את דרכו בעזרת כלב נחייה.","גם סומא רואה שמשהו כאן לא בסדר."]],["סִיכָה",["מריחה בשמן, משיחה"],["המכונאי ביצע סיכה לחלקי המנוע.","סיכת הצירים של הדלת הפסיקה את החריקה."]],["סִמְטָה",["רחוב צדדי וצר"],["החנות הקטנה נמצאת בסמטה צדדית.","הם הלכו לאיבוד בסמטאות העיר העתיקה."]],["סַף",["מפתן בדלת הכניסה, אדן","התנאי או הכמות המינימאלית להתרחשותו של דבר מה"],["האורחים חיכו על סף הדלת.","כדי לעבור את הבחינה צריך לעבור את סף הציון שקבע משרד החינוך."]],["סִפּוּן",["תקרה, חלקה העליון של האוניה (התקרה של בטן האוניה)"],["המלחים עמדו על סיפון האונייה.","הנוסעים עלו לסיפון ויצאו להפלגה."]],["סָפוּן",["צפון, נסתר"],["בזיכרונו ספונות חוויות רבות מהמלחמה.","המכתב היה ספון במגירה שנים רבות."]],["עוּל יָמִים",["צעיר"],["הוא התקבל לעבודה כשהיה עדיין עול ימים.","המלך עול הימים לא ידע כיצד לנהל את הממלכה."]],["עָכוּר",["לא צלול, דלוח","עצוב, מדוכדך","לא תקין, משובש"],["מי הנהר היו עכורים אחרי השיטפון.","במצב רוח עכור הוא הגיע לעבודה."]],["עַל כַּרְעֵי תַּרְנְגוֹלֶת",["רעוע ובלתי יציב"],["הבית הישן עומד על כרעי תרנגולת.","ההסכם בין המפלגות נשען על כרעי תרנגולת."]],["עַל מֵי מְנוּחוֹת",["ברוגע, בשלווה"],["הם ניהלו את חייהם על מי מנוחות, בלי דרמות.","הדיון עבר על מי מנוחות, בלי ויכוחים."]],["עָלַץ",["שמח, התמלא שמחה"],["הקהל עלץ כשהקבוצה זכתה באליפות.","לבה עלץ כשראתה את בנה חוזר הביתה."]],["עָמַד עַל דַּעְתוֹ",["הפך לבר דעת, התחיל להבין","התעקש, המשיך להחזיק בדעתו, עמד על שלו"],["מאז שעמד על דעתו, הוא רצה להיות טייס.","התלמיד עמד על דעתו ולא הסכים לשנות את התשובה."]],["עִמְעוּם",["גרימה למשהו להיות מעורפל או מטושטש, הפיכתו לפחות ברור משהיה","החלשת האור והפיכתו לעמום יותר"],["עמעום האורות סימן שההצגה מתחילה.","הדוח הואשם בעמעום האחריות של המנהלים."]],["עָנָיו",["צנוע"],["למרות הצלחתו, הוא נשאר אדם עניו.","היא ענתה בענווה ובקול שקט."]],["עֲקֵב בְּצַד אֲגוּדָל",["צעד אחר צעד, בזהירות יתרה"],["החוקרים התקדמו עקב בצד אגודל עד שחשפו את האמת.","התינוק למד ללכת עקב בצד אגודל."]],["עָשָׂה שַׁמּוֹת",["הרס משהו, החריב"],["הסערה עשתה שמות בשדות.","הילדים עשו שמות בסלון בזמן שההורים לא היו בבית."]],["פַּדַחַת",["מצח"],["הילד קיבל מכה בפדחת כשנתקל בדלת.","הוא מחה את הזיעה מפדחתו."]],["פִּדְיוֹן",["המרה של שטר התחייבות בכסף","הכנסה המתקבלת בפרק זמן כלשהו","שחרור אדם או דבר מה בערבות כספית או שוות ערך אחרת"],["הפדיון בחנות עלה בתקופת החגים.","הוא הלך לבנק לפדיון החיסכון."]],["פּוֹשֵׁט יָד",["קבצן"],["פושט יד ישב ליד הכניסה לתחנה.","ברחובות העיר ראינו פושטי יד רבים."]],["פִּכְפּוּך",["זרימה, נביעה"],["פכפוך המים בנחל הרגיע אותנו.","שמענו את פכפוך המעיין מבין הסלעים."]],["פִּסְגָּה",["החלק הגבוה ביותר בהר"],["המטפסים הגיעו לפסגת האוורסט.","הנשיא השתתף בוועידת פסגה של מנהיגי העולם."]],["פְּצִירָה",["מכשיר המשמש לשיוף והחלקה (של עץ, מתכת וכו')","כלי לטיפוח הציפורניים"],["הנגר החליק את שולי הלוח בפצירה.","היא שייפה את ציפורניה בפצירה."]],["פְּרִימָה",["התרת קשרים"],["פרימת הסוודר הישן הניבה כדור צמר גדול.","פרימת הקשרים ברשת לקחה שעות."]],["פְּרַקְדָן",["שכוב על הגב"],["הוא שכב פרקדן על החול והביט בכוכבים.","התינוק ישן פרקדן בעריסה."]],["פָּשַׁט יָד",["ביקש נדבה, קיבץ נדבות"],["הזקן נאלץ לפשוט יד ברחובות.","בזמן המשבר אנשים רבים פשטו יד."]],["פְּתִית",["פרור"],["פתיתי שלג ירדו על העיר.","הציפורים אכלו פתיתי לחם שנפלו על הרצפה."]],["צָחִיחַ",["מחוסר מים, יבש"],["הצמחים לא שרדו באדמה הצחיחה.","ים המלח מוקף במדבר צחיח."]],["צַחֲנָה",["סירחון, עיפוש"],["צחנה עלתה מהפח שלא רוקן שבוע.","צחנת הביוב מילאה את הרחוב."]],["צִיטָטָה",["קטע המובא לשם חיזוק או הדגמה (לרוב ממקור כתוב כלשהו), מובאה"],["הוא פתח את הנאום בציטטה מדברי בן גוריון.","העבודה מלאה ציטטות מספרים שונים."]],["צָלוּל",["לא עכור, שקוף"],["מי האגם היו צלולים וראינו את הדגים.","אחרי השינה הוא הרגיש צלול ורענן."]],["צָפוּן",["נסתר, נעלם"],["האוצר היה צפון במעמקי המערה.","איש לא יודע מה צפון לנו בעתיד."]],["קֵהֶה",["לא חד","עמום, מעורפל","שאינו בשל, בוסר"],["הסכין קהה מדי ואינה חותכת את הלחם.","אחרי הניתוח הרגיש כאב קהה בגב."]],["קָטֵגוֹר",["עורך הדין שתובע את הנאשם"],["הקטגור דרש מבית המשפט להטיל על הנאשם עונש כבד.","הקטגורית הציגה ראיות חדשות במהלך הדיון."]],["קְלִיָּה",["חריכה של גרגרי תבואה"],["ריח הקלייה של הקפה מילא את החנות.","אחרי הקלייה, גרגרי החיטה מקבלים צבע חום."]],["קָמוּר",["מעוקם בצורת קערה כלפי מעלה, קשתי (להיפך: קעור)"],["המראה הקמורה ברכב מגדילה את שדה הראייה.","לגשר העתיק יש קשת קמורה מאבן."]],["קָנָה (לוֹ) שְׁבִיתָה",["התמקם, השתקע"],["משפחה של ציפורים קנתה לה שביתה על עץ החצר.","הם עזבו את העיר וקנו להם שביתה בכפר קטן בגליל."]],["קָתֶדְרָה",["שמו של הכיסא עליו יושבים הבישופים","במה עליה עומד הנואם, דוכן","יחידה מדעית במוסד להשכלה גבוהה"],["הבישוף ישב על הקתדרה בכנסייה.","הפרופסור קיבל קתדרה לחקר ההיסטוריה של ארץ ישראל."]],["רִדֵּד",["שיטח"],["הטבח ריקע את הבשר ורידד אותו לשכבה דקה.","היא רידדה את הבצק במערוך לפני שחתכה עוגיות."]],["רָדוּד",["לא עמוק"],["הילדים שיחקו בחלק הרדוד של הבריכה.","השיחה איתו הייתה רדודה, בלי שום עומק."]],["רִיק",["וָואקוּם, אֶפֶס"],["בחלל החיצון יש כמעט ריק מוחלט.","אחרי שעזב, היא הרגישה ריק גדול בחייה."]],["רִקֵּעַ",["הפך לשטוח (יצר צורות על ידי שיטוח מתכת)"],["הצורף ריקע את הכסף ויצר עליו דוגמאות של פרחים.","האומן ריקע את הנחושת לצלחת דקה ומעוטרת."]],["רָקַע",["דרך בחוזקה על הקרקע"],["הילד רקע ברגליו בכעס כשלא קיבל את הצעצוע.","הרקדנים רקעו ברגליהם על הבמה בקצב התופים."]],["רָתַח",["כעס מאוד"],["כששמע שהטיסה בוטלה, הוא רתח מזעם.","המנהל רתח על העובד שאיחר שוב."]],["שְׁאָר רוּחַ",["יכולות רוחניות ונפשיות גדולות כגון רגישות, פתיחות וכדומה"],["המורה, איש שאר רוח, עודד אותנו לקרוא שירה.","הסופרת הייתה אישה בעלת שאר רוח ורגישות רבה."]],["שְׁבִיתַת נֶשֶׁק",["הפסקת אש, הפסקה מוסכמת של כל פעולות הלחימה"],["אחרי חודשים של לחימה, הוסכם על שביתת נשק.","שביתת הנשק הופרה כעבור יומיים."]],["שְׂדֵרָה",["שכבה חברתית, מעמד, סטטוס","שיירה (בד\"כ של כלי רכב), שורה","רחוב רחב, סימטה"],["הרפורמה פגעה בעיקר בשדרה הבינונית של החברה.","שדרת כלי רכב צבאיים עברה בכביש."]],["שִׁנֵּן",["למד היטב, חזר שוב ושוב על משהו כדי לזכור אותו"],["הוא שינן את הנאום כל הלילה.","הילדים שיננו את לוח הכפל עד שידעו אותו בעל פה."]],["שַׁלְשֶׁלֶת",["שרשרת כבדה עשויה טבעות מתכת"],["הכלב נקשר בשלשלת לעמוד.","השער הגדול ננעל בשלשלת ומנעול."]],["שָׂם לְאַל",["מנע את התגשמותו של משהו, סיכל"],["הגשם שם לאל את התוכניות לפיקניק.","הפציעה שמה לאל את חלומו להיות כדורגלן."]],["שָׁפַךְ לִבּוֹ",["השתפך, חשף את כל צרותיו בפני מישהו"],["היא שפכה את לבה בפני חברתה הטובה.","הוא ישב מול הפסיכולוג ושפך את לבו על הגירושים."]],["שָׁרָב",["מזג אוויר חם מאוד"],["ביום של שרב כדאי להישאר בבית ולשתות הרבה מים.","השרב הכבד נמשך שלושה ימים."]],["שְׁרַפְרַף",["כסא נמוך, הדום"],["הילד עמד על שרפרף כדי להגיע למדף.","סבא ישב על שרפרף עץ נמוך ליד הדלת."]],["תָּהָה עַל קַנְקַנּוֹ",["עמד על טיבו, בחן אותו"],["לפני שנתתי לו את המפתחות, תהיתי על קנקנו.","המנהלת תהתה על קנקנה של המועמדת בראיון ארוך."]],["תּוֹרֶן",["מוט גבוה בספינה לקשירת המפרשים","עמוד גבוה לתליית דגל"],["המלחים טיפסו על התורן כדי לתקן את המפרש.","הדגל הונף בראש התורן ביום העצמאות."]],["תֵּל",["גבעה מלאכותית, ערמה, גל"],["הארכאולוגים חפרו בתל העתיק ומצאו שרידי עיר.","אחרי הסערה נותר מהסוכה רק תל של ענפים."]],["תָּמַהּ",["הטיל ספק, התחבט לגבי נכונותו של הדבר","התפלא, מוזר ומפתיע"],["הוא תמה אם באמת כדאי להשקיע בחברה הזאת.","תמהני כיצד הצליח לסיים את העבודה בזמן כה קצר."]],["תַּסְכִּית",["יצירה דרמתית שעובדה לשידור ברדיו"],["ברדיו שודר תסכית על חייו של משורר ידוע.","השחקנים הקליטו תסכית בשידור חי באולפן."]],["תָּעַה",["איבד את הדרך"],["המטיילים תעו במדבר ונמצאו רק למחרת.","הילד תעה בשוק ההומה ולא מצא את אמו."]],["תַּרְעוֹמֶת",["תחושת כעס, רוגז"],["התרעומת של העובדים על הקיצוצים גברה.","היא לא הסתירה את תרעומתה על ההחלטה."]],["תְּשׁוּקָה",["רצון עז, תאווה עזה"],["הייתה לו תשוקה עזה למוזיקה מגיל צעיר.","התשוקה לכוח הביאה אותו לבגוד בחבריו."]],["אֵבוּס",["כלי להגשת אוכל לבהמות"],["האיכר מילא את האבוס בשחת.","הסוסים עמדו ליד האבוס ואכלו."]],["אָבוּס",["מפוּטם"],["הם שחטו את העגל האבוס לכבוד החג.","הכבשים האבוסות לא הצליחו לרוץ."]],["אֶבֶן בּוֹחַן",["אמת מידה, מדד"],["הבחירות יהיו אבן בוחן ליכולתו של השר.","שביעות רצון הלקוחות היא אבן הבוחן של כל עסק."]],["אוּרְבָּנִי",["עירוני (עירוני - urban)"],["התחבורה הציבורית היא אתגר אורבני מרכזי.","היא מעדיפה את הנוף האורבני על פני שקט הכפר."]],["אוֹתִיוֹת קִדּוּשׁ לְבָנָה",["אותיות גדולות במיוחד (להיפך: אותיות טַל וּמָטָר)"],["השם של המנצח נכתב באותיות קידוש לבנה על הלוח.","העיתון פרסם את הידיעה בכותרת באותיות קידוש לבנה."]],["אֵיד",["צרה, אסון"],["האויב שמח לאידם של תושבי העיר הנצורה.","יום אידו של הרודן הגיע כשהעם התקומם."]],["אַיֵּה?",["איפה?"],["איה הספר שהשארתי על השולחן?","איה הם חברי הילדות שלי?"]],["אֵין-אוֹנִים",["אי יכולת להתמודד, חולשה מוחלטת"],["הוא עמד באין אונים מול האש שבלעה את ביתו.","ההורים חשו אין אונים מול מחלת בנם."]],["אִיפּוּל",["איסור פרסום ברבים, צנזורה, עמימות"],["הצבא הטיל איפול על פרטי המבצע.","הפרשה נחשפה רק אחרי שהוסר האיפול."]],["אֲלוּנְטִית",["מגבת"],["אחרי המקלחת הוא התנגב באלונטית.","הם שכחו לארוז אלונטיות לים."]],["אִלְפָּס",["סיר עמוק עם ידית ומכסה, מחבת עמוקה"],["סבתא בישלה את התבשיל באלפס גדול.","היא טיגנה בצל באלפס על אש קטנה."]],["אָמָה",["משרתת, שפחה","מידת אורך קדומה (מהמרפק עד שורש כף היד)"],["האמה הביאה מים לגברתה.","אורך המזבח היה חמש אמות."]],["אֶמְפִּירִי",["שמבוסס על ניסוי (להיפך: תיאורטי)"],["הטענה הזאת הוכחה במחקר אמפירי.","התיאוריה יפה, אבל אין לה תמיכה אמפירית."]],["אִמְרָה",["שולי האריג, שפת הבגד","פתגם"],["החייטת תיקנה את אמרת השמלה.","סבא נהג לצטט אמרות של חכמים."]],["אַסְדָּה",["סירה קטנה, רפסודה"],["הדייג יצא לים באסדה קטנה.","אסדת הקידוח הוצבה במרחק מהחוף."]],["אַסְקופָּה",["סף"],["הם עמדו על האסקופה ולא העזו להיכנס.","הכלב שכב על אסקופת הדלת."]],["אַסְקופָּה הַנִּדְרֶסֶת",["כינוי לאדם שכולם מתעמרים בו, אדם חלש אופי"],["בכיתה הוא היה אסקופה נדרסת, וכולם צחקו עליו.","נמאס לה להיות אסקופה נדרסת בעבודה."]],["אָרְכָה לוֹ הַשָּׁעָה",["הזמן נדמה בעניו כנצח, היה חסר סבלנות"],["כשחיכה לתשובה מהרופא, ארכה לו השעה.","לילדים ארכה השעה בנסיעה הארוכה."]],["אַרְכּוֹף",["סד עינויים בו נקשרות הרגליים והידיים","טבעת לרגלו של הרוכב"],["הרוכב הכניס את רגליו לארכופים ודהר.","ארכוף אחד נקרע, והרוכב כמעט נפל מהסוס."]],["אַרְכָנִי",["ארוך שלא לצורך"],["המכתב הארכני היה יכול להיות קצר בהרבה.","הסרט היה ארכני ומשעמם."]],["אַשְׁמוֹרֶת",["שליש מהלילה, חלק מהלילה"],["החיילים שמרו במחנה באשמורת הלילה.","באשמורת הבוקר יצאו הדייגים לים."]],["אָתֵאִיסְט",["מי שכופר בקיום האל, מי שמביע חוסר אמונה באל עליון כלשהו"],["הוא אתאיסט ואינו מאמין באלוהים.","הפילוסוף האתאיסט כתב ספר נגד הדת."]],["בָּא בַּיָּמִים",["זקן, קשיש"],["סבי כבר בא בימים, אך עדיין הולך כל בוקר לשחות.","האיש הבא בימים סיפר על ימי העלייה."]],["בֶּדֶק בַּיִת",["בקרה עצמית, בדיקה לצורך שיפור"],["אחרי הכישלון, המפלגה ערכה בדק בית.","הארגון עשה בדק בית כדי לגלות מה השתבש."]],["בְּהֶנֵף יָד",["בקלות, כלאחר יד, ללא מחשבה"],["המנהל ביטל את הפרויקט בהנף יד.","אי אפשר לפתור בעיה כזאת בהנף יד."]],["בּוֹר סוּד (שֶׁאֵינוֹ מְאַבֵּד טִפָּה)",["בעל זיכרון טוב (סוּד - מְסוּיָּד, שהמים לא נספגים בקירותיו ונשארים בתוכו)"],["התלמיד הזה הוא בור סוד, הוא זוכר כל מילה שהמורה אמר.","סבתא היא בור סוד של סיפורי משפחה."]],["בָּזִיךְ",["סוג של כוס, גביע","סוג של קערה"],["הכוהן מילא את הבזיך בשמן.","על השולחן הונחו בזיכי כסף עתיקים."]],["בִּזְעֵיר אֲנְפִּין",["בקנה מידה קטן, מוקטן"],["המודל הוא העיר בזעיר אנפין.","המשפחה שלהם היא המדינה בזעיר אנפין."]],["בִּזֵּר",["האציל סמכויות, פיזר האחריות"],["המנכ״לית ביזרה את הסמכויות בין מנהלי המחלקות.","הממשלה החליטה לבזר את השירותים לרשויות המקומיות."]],["בָּחַשׁ בַּקַּלַּחַת",["סכסך"],["הוא בחש בקלחת והפיץ שמועות בין החברים.","מישהו בוחש בקלחת כדי שהשותפים יריבו."]],["בֵּין הַמְּצָרִים",["במצב דחוק, באין מוצא"],["המדינה נמצאת בין המצרים בגלל המשבר הכלכלי.","הם נקלעו בין המצרים ולא ידעו מה לעשות."]],["בֵּין הַשִּׁיטִין",["בין השורות, במרומז, לא באופן מפורש"],["המכתב היה מנומס, אבל בין השיטין הורגשה ביקורת.","צריך לקרוא בין השיטין כדי להבין את כוונתו."]],["בֵּית גְּנָזִים",["מקום אכסון למסמכים"],["המסמכים נשמרו בבית הגנזים הלאומי.","כתבי היד של המשורר נמצאים בבית גנזים."]],["בֵּית נְכוֹת",["מוזיאון"],["בבית הנכות מוצגים ממצאים מהתקופה הרומית.","ביקרנו בבית נכות קטן לתולדות העיר."]],["בֵּית עֲבוֹט",["מקום בו ניתן למשכן חפצים תמורת הלוואה, בית משכונות"],["הוא משכן את השעון בבית העבוט.","בבית העבוט נערמו חפצים שבעליהם לא חזרו לפדות."]],["בְּלִיל",["תערובת"],["המנה היא בליל של ירקות, גבינות ותבלינים.","השפה שלו היא בליל של עברית ואנגלית."]],["בֶּן-דְּמוּתוֹ",["דומה לו"],["הבן הוא בן דמותו של אביו.","הבובה הייתה בת דמותה של הילדה."]],["בֶּן-כִּלְאַיִים",["בעל חיים או צמח שהוא תוצר של שילוב בין שני מינים שונים"],["הפרד הוא בן כלאיים של סוס וחמור.","המדענים גידלו בן כלאיים של שני זני עגבנייה."]],["בְּעָלְמָא",["ללא סיבה מיוחדת"],["הוא לא אמר את זה בעלמא, יש לו סיבה טובה.","זו לא התראה בעלמא, כדאי להתייחס אליה ברצינות."]],["בְּעָתָה",["פחד פתאומי, בהלה, חרדה"],["כשנשמע הפיצוץ, בעתה אחזה בנוכחים.","הילד התעורר מבעתה בגלל חלום רע."]],["בְּצוֹק הָעִתִּים",["בזמנים קשים, בזמן מצוקה"],["בצוק העתים, המשפחה נאלצה למכור את הבית.","בצוק העתים חשוב לשמור על אחדות."]],["בְּשָׂפָה רָפָה",["בקול חלש, במלמול","אמר את שאמר בחוסר רצון ומתוך הכרח"],["הוא הודה בשפה רפה שטעה.","התלמיד ענה בשפה רפה, כמעט בלחישה."]],["גֶזֶם",["הענפים שנגזמו, הפסולת שנשארה לאחר הגיזום"],["אחרי הגיזום פינו את הגזם מהגינה.","העירייה אוספת גזם פעם בשבוע."]],["גִּילָּה אֶת אָזְנוֹ",["סיפר לו סוד"],["החבר גילה את אוזנו שהמנהל עומד לעזוב.","היא גילתה את אוזנה של אחותה על התוכנית."]],["גָמָא / גָמַע",["לגם, שתה"],["הצמא גמע את המים בבת אחת.","הוא גמא מהקפה החם לאט."]],["גֶּפֶת",["פסולת הזיתים לאחר הסחיטה"],["את הגפת משמשים לעתים כמזון לבהמות.","ליד בית הבד נערמה ערימה של גפת."]],["גֶּרֶם",["עצם (כמו עצמות השלד)","גוף בעל צורה ונפח (גרם מדרגות - סדרה רצופה של מדרגות, גרם שמים - גוף שְׁמֵימִי)"],["בעקבות התאונה נשבר גרם בכף ידו.","גרם המדרגות העתיק הוביל אל ראש המגדל."]],["דְּבָרִים בְּעָלְמָא",["דברים סתמיים, ללא כוונה מיוחדת"],["אלה דברים בעלמא, אין מאחוריהם שום דבר.","אל תתייחס לדבריו, הם דברים בעלמא."]],["דָּחַק אֶת הַקֵּץ",["ביקש לקרב את הסוף קודם זמנו"],["התלמיד דחק את הקץ והגיש את המבחן אחרי חמש דקות.","אל תדחק את הקץ, בוא נחכה לתוצאות."]],["דָּחַק אֶת הַשָּעָה",["עשה משהו לפני זמנו, נהג בפזיזות"],["החברה דחקה את השעה והשיקה מוצר שלא היה מוכן.","אנחנו לא רוצים לדחוק את השעה ולהתחתן מהר מדי."]],["דָּחַק אֶת רַגְלָיו",["תפס את מקומו, נישל אותו מתפקידו"],["העובד הצעיר דחק את רגלי המנהל הוותיק.","החברות הגדולות דוחקות את רגליהן של החנויות הקטנות."]],["דִּנְדֵּן",["צלצל בפעמון"],["ילדי הכיתה דנדנו בפעמון בסוף ההפסקה.","העגלון דנדן בפעמון כדי שהעוברים יזוזו."]],["דַּעְתָּן",["מי שיודע להביע את דעתו בצורה נחרצת ויכול לדבוק בעמדותיו, אסרטיבי"],["הבת שלהם דעתנית ולא מפחדת להתווכח עם המורים.","השחקן הדעתן הביע את דעתו בגלוי מול כולם."]],["דָּרְבָּן",["גלגל שיניים קטן המחובר לעקב המגף ונועד לדרבן את הסוס (על ידי דקירתו)"],["הרוכב נגע בסוס בדרבנות כדי שידהור.","לרגלי הקאובוי היו מגפיים עם דרבנות."]],["הֶאֱבִיס",["נתן אוכל רב מדי","האכיל בעלי חיים"],["בחג, סבתא האביסה אותנו במאכלים.","החוואי האביס את הפרות בתערובת מזון."]],["הֶאֱנִישׁ",["ייחס תכונות אנושיות למי שאינו אנושי"],["בסרט המצויר האנישו את החיות, והן מדברות כמו בני אדם.","משוררים נוהגים להאניש את הירח ואת הים."]],["הֶדוֹנִיזְם",["נהנתנות, רדיפת תענוגות"],["המבקרים ראו בסרט ביטוי להדוניזם של החברה המודרנית.","לפי ההדוניזם, ההנאה היא הערך העליון."]],["הוֹלֵך עַל קֶרַח דַּק",["נמצא במצב קשה ומסוכן תחת נסיבות שאינן לחלוטין בשליטתו"],["החברה, שחייבת מיליונים, הולכת על קרח דק.","עם הציונים האלה אתה הולך על קרח דק."]],["הִזָּה",["התיז נוזל, טפטף, הזליף"],["הכוהן הִזָּה מים על המזבח.","היא הזתה בושם על פרקי ידיה."]],["הִידֵס",["הלך בצורה לא יציבה כשהוא נוטה מצד לצד"],["השיכור הידס ברחוב.","התינוק הידס לעבר אביו בצעדיו הראשונים."]],["הִיפּוֹתֶטִי",["משוער, לא ודאי, תאורטי"],["זו שאלה היפותטית: מה היית עושה אילו זכית בלוטו?","בינתיים מדובר רק בתרחיש היפותטי."]],["הֵלִיט",["כיסה, הסתיר (לוֹט - כיסוי)"],["היא הליטה את פניה בידיה.","ענן כבד הליט את השמש."]],["הָלַך עַל חֶבֶל דַּק",["מצוי במצב שבו כל טעות קטנה יכולה להסב לו נזק"],["השר הולך על חבל דק בין הלחצים של שני הצדדים.","העסק הולך על חבל דק, וכל טעות עלולה להפיל אותו."]],["הֲלָנַת שָׂכָר",["עיכוב תשלום השכר לעובד"],["העובדים תבעו את המעסיק על הלנת שכר.","החוק מטיל קנס כבד על הלנת שכר."]],["הִפְטִיר",["קרא הפטרה (הפטרה - קטע מספרי הנביאים שקוראים בבית כנסת)","אמר משהו ללא תשומת לב מיוחדת, \"זרק\" משהו לאוויר"],["נער הבר מצווה הפטיר בבית הכנסת.","״נתראה מחר,״ הפטיר ויצא מהחדר."]],["הִפְרִיט",["העביר בעלות מהמדינה לידיים פרטיות (להיפך: הלאים)"],["הממשלה הפריטה את חברת הדואר.","הם מתנגדים להפרטת שירותי הבריאות."]],["הִקְדִּיחַ",["בישל יתר על המידה"],["היא הקדיחה את התבשיל, והבית התמלא עשן.","הטבח המתחיל הקדיח את האורז."]],["הַרְרֵי זָהָב",["דמיונות וגוזמאות"],["המועמד הבטיח לבוחרים הררי זהב.","אל תאמין להררי הזהב שהוא מבטיח."]],["הִתְחַוֵּר",["התברר ללא ספק, הסתבר"],["במהלך החקירה התחוור שהחשוד דובר אמת.","רק למחרת התחוור לנו גודל הנזק."]],["הִתַּמֵּם",["עשה עצמו תמים, התנהג כאילו אינו יודע במה מדובר"],["כשהמורה שאלה מי שבר את החלון, הילד התמם.","אל תתמם, אתה יודע בדיוק על מה אני מדבר."]],["וָאדִי",["אפיק נחל סלעי (מרבית השנה הוא יבש)"],["בחורף הוואדי מתמלא מים שוצפים.","המטיילים הלכו לאורך הוואדי היבש."]],["ווּלְגָרִי",["המוני, גס, פשוט ביותר"],["הבדיחות הוולגריות שלו הביכו את כולם.","הקהל התלונן על השפה הוולגרית בתוכנית."]],["זוֹג",["החלק החיצון בפעמון, דפנותיו של פעמון (מה שמַכֶּה בזוג הוא העִנְבָּל)"],["הענבל פגע בזוג הפעמון, וצלצול נשמע בכל הכפר.","על זוג הפעמון נחרטה כתובת ישנה."]],["חֲדַל פֵּרָעוֹן",["מי שלא מסוגל לשלם את חובו"],["החברה הוכרזה חדלת פירעון.","הבנק תבע את הלווה, שהיה חדל פירעון."]],["חוֹרֵשׁ מְזִמּוֹת",["זומם, מתכנן להרע"],["הנבל בסיפור חורש מזימות נגד המלך.","אל תסמוך עליו, הוא תמיד חורש מזימות."]],["חִלּוּפֵי גַּבְרֵי",["החלפת בעלי תפקידים"],["בחברה היו חילופי גברי בהנהלה.","אחרי הבחירות צפויים חילופי גברי במשרדי הממשלה."]],["חֵלֶב",["שעוות נר","שומן המצוי בגופם של בעלי חיים"],["נרות החלב דלקו בבית הכנסת.","הקצב הסיר את החלב מהבשר."]],["חָלַט",["יצק מים חמים"],["היא חלטה את השקדים במים רותחים כדי לקלף אותם.","חולטים את העשבים ומקבלים חליטה מרגיעה."]],["חֲלִיפַת מִכְתָּבִים",["התכתבות בין שני אנשים או גופים"],["בין שני המשוררים התנהלה חליפת מכתבים ארוכה.","חליפת המכתבים בין השרים פורסמה בעיתון."]],["חֵמָה",["כעס, זעם, רוגז"],["המלך התמלא חמה כששמע על המרד.","הוא שפך את חמתו על העובדים."]],["חָנוּט",["מומיה"],["במוזיאון מוצג חנוט מצרי עתיק.","החנוט נמצא בתוך ארון אבן."]],["חֲנִיטָה",["השריית גופת אדם או חיה בחומר מיוחד המונע ממנה להירקב"],["המצרים הקדמונים שלטו באמנות החניטה.","יוסף ציווה לבצע חניטה לגופת אביו."]],["חֲפוּי רֹאשׁ",["נבוך, מבויש, נכלם"],["הנער עמד חפוי ראש מול המנהל.","השחקנים ירדו מהמגרש חפויי ראש אחרי ההפסד."]],["חֻרְשָף",["ארטישוק"],["לארוחה הוגשו לבבות חורשף במילוי בשר.","החורשף פורח בפרחים סגולים גדולים."]],["טִכֵּס עֵצָה",["התייעץ, חיפש תחבולה"],["שני הגנבים טיכסו עצה כיצד לברוח מהכלא.","ההורים טיכסו עצה איך להפתיע את הילדים."]],["טְפָחוֹת",["הקורות העליונות של מבנה"],["הסופה החריבה את הבית מן היסוד ועד הטפחות.","הוא בדק את הבניין מהמסד ועד הטפחות."]],["טְרוּט עֵינַיִם",["בעל עיניים עצומות למחצה בשל עייפות, חוסר שינה או חולי"],["התלמיד הגיע לשיעור טרוט עיניים אחרי לילה ללא שינה.","הנהג טרוט העיניים עצר בצד הדרך לנוח."]],["טְרוּנְיָה",["תלונה, תרעומת, טענה קשה"],["המנהל שמע את טרוניות העובדים.","יש לו טרוניה על כל דבר."]],["יָגוֹן",["תסכול, דכדוך, דיכאון"],["היגון על מות אביו לא הרפה ממנו.","בני המשפחה ישבו ביגון וחיכו לחדשות."]],["יוֹבֵל",["חמישים שנה"],["העיר חגגה יובל להיווסדה.","הזוג חגג יובל לנישואיו."]],["יוּבַל",["נחל, זרוע של נהר"],["הנהר מקבל מים מכמה יובלים.","היובל הקטן מתחבר לנהר ליד הכפר."]],["יוֹגֵב",["איכר, עובד אדמה, חקלאי"],["היוגבים עבדו בשדות מבוקר ועד ערב.","השיר מתאר את חיי היוגב בעמק."]],["יוֹשֵׁב קְרָנוֹת",["בטלן, הולך בטל (קרן = פינה), אוכל לחם חסד"],["במקום לחפש עבודה, הוא יושב קרנות כל היום.","הוריו התרגזו שהבן שלהם יושב קרנות."]],["יֵש דְּבָרִים בְּגוֹ",["יש טעם בדבר, יש בזה היגיון"],["יש דברים בגו בטענה שהמחירים גבוהים מדי.","בהתחלה צחקתי עליו, אבל בסוף הבנתי שיש דברים בגו."]],["כָּאוֹטי",["במצב של אי סדר"],["התנועה בכביש הייתה כאוטית אחרי התקלה ברמזורים.","הבית היה כאוטי אחרי מסיבת יום ההולדת."]],["כָּאוֹס",["ערבוביה, תוהו ובוהו"],["אחרי רעידת האדמה שרר בעיר כאוס.","החדר שלו הוא כאוס של בגדים וספרים."]],["כְּבוּדָּה",["מטען, משא"],["המטיילים העמיסו את הכבודה על החמורים.","בשדה התעופה הם חיכו לכבודה שלהם."]],["כּוֹרֵם",["בעל מקצוע שמגדל גפנים וענבים"],["הכורם בדק את הגפנים לקראת הבציר.","כורמי הגליל מגדלים זנים משובחים."]],["כּוֹתֶרֶת",["העלים הצבעוניים של הפרח","אדריכלות - החלק העליון של עמוד אבן, בדרך כלל כותרת העמוד מקושטת במוטיב צמחי"],["לפרח היו עלי כותרת ורודים.","כותרות העמודים בבית הכנסת העתיק מעוטרות בעלי אקנתוס."]],["כְּזַיִת",["קצת, מעט, קמעה"],["הוא אכל כזית מהעוגה רק כדי לא להעליב.","אין בדבריו כזית של אמת."]],["כִּישוֹר",["קנה שנכרכים עליו חוטי הצמר או הפשתן הנטווים"],["הסבתא סובבה את הכישור והחוט נכרך עליו.","במוזיאון הוצג כישור עשוי עצם."]],["כִּמְטַחֲוֵי קֶשֶׁת",["קרוב, בהישג יד, בקרבת מקום (בטווח ירייה של חץ מקשת)"],["המלון נמצא כמטחווי קשת מהים.","הניצחון היה כמטחווי קשת, אך נחמק מהם."]],["כָּפִיס",["קרש, קורת עץ"],["הנגר חיבר כפיסי עץ לארגז.","הילדים בנו רפסודה מכפיסים ישנים."]],["לַבְלָר",["פקיד, מזכיר"],["הלבלר רשם את פרטי המבקשים בספר.","הוא עבד כלבלר בעירייה במשך שלושים שנה."]],["לוֹיָאלִי",["נאמן, שומר אמונים"],["הכלב לויאלי לבעליו.","העובדת הלויאלית סירבה להצעה של המתחרים."]],["לָטֶנְטי",["חבוי, כמוס, רדום (להיפך: אוֹבֵרְטִי)"],["המחלה הייתה לטנטית במשך שנים.","בחברה היה מתח לטנטי שהתפרץ בהפגנות."]],["לְעֵילָא וּלְעֵילָא",["הטוב ביותר, המובחר"],["המורה הזאת היא מחנכת לעילא ולעילא.","השירות במלון היה לעילא ולעילא."]],["מַבּוּעַ",["מעיין, מקור, יסוד"],["מבוע מים זכים פרץ מן הסלע.","הספרים היו לו מבוע של השראה."]],["מוֹנוֹגַמְיָה",["נשיאת אשה אחת בלבד (להיפך: ביגמיה, פוליגמיה)"],["ברוב מדינות העולם מקובלת מונוגמיה.","ברבורים ידועים כבעלי חיים שנוהגים במונוגמיה."]],["מוֹנוֹתֵאִיזְם",["אמונה באל אחד"],["היהדות נחשבת לדת הראשונה שהביאה את המונותאיזם.","המעבר מפוליתאיזם למונותאיזם שינה את העולם העתיק."]],["מַזְלֵף",["משפך"],["הגנן השקה את השתילים בעזרת מזלף.","היא מילאה את המזלף במים."]],["מְחַרְחֵר (רִיב)",["סכסכן, איש מדון"],["הוא מחרחר ריב בכל ישיבה.","המחרחרים בשכונה ניסו להסית את התושבים זה בזה."]],["מִיטַת סְדוֹם",["מקום או מצב שאין בו חופש פעולה"],["המנהל הכניס את העובדים למיטת סדום של כללים נוקשים.","התקנון החדש הוא מיטת סדום שאינה משאירה מקום ליוזמה."]],["מָלַק",["ערף את ראשו של בעל חיים"],["הכוהן מלק את ראש התור.","בסיפור הישן מלקו את ראש העוף לפני הבישול."]],["מַסָּד",["בסיס, יסוד"],["האמון הוא המסד לכל מערכת יחסים.","הבניין עומד על מסד אבן."]],["מְסוּפָּק",["מלא ספקות, שרוי בספק","בא על סיפוקו"],["אני מסופק אם הוא יגיע בזמן.","הלקוח יצא מסופק מהשירות."]],["מְעֻקָּר",["שעבר חיטוי מוחלט מכל החיידקים שבו, סטֶרילי"],["המנתחים השתמשו בכלים מעוקרים.","צריך להרתיח את הבקבוקים כדי שיהיו מעוקרים."]],["מַקְצוּעָה",["אחד מכליו של הנגר המשמש להחלקת עצים"],["הנגר החליק את הלוח במקצועה.","שבבי עץ נפלו מהמקצועה לרצפה."]],["מַרְבֵּק",["מקום בו מפטמים בעלי חיים"],["בעלי החיים הועברו למרבק לפני השחיטה.","העגל של המרבק היה שמן במיוחד."]],["מַרְחֶשֶׁת",["מחבת לטיגון"],["סבתא טיגנה לביבות במרחשת.","בבית המקדש הכינו מנחות במרחשת."]],["מַרְצֵע",["מכשיר ניקוב (עבד נרצע - עבד עולם שסומן ע\"י ניקוב אוזנו)"],["הסנדלר ניקב חור ברצועה במרצע.","הוא השתמש במרצע כדי לתפור את העור."]],["מָשַׁךְ בְּעֵט",["עסק בכתיבה, כתב דברי ספרות"],["בנעוריו הוא משך בעט ופרסם שירים בעיתון.","היא מושכת בעט כבר שלושים שנה."]],["מַשְׂכִּית",["קישוט, תכשיט","ציור, תמונה"],["על הקיר נתלתה משכית מעשה ידי אמן.","הכלה ענדה משכית זהב על צווארה."]],["נְאָקָה",["אנחת כאב, גניחה"],["מן החדר נשמעה נאקה של חולה.","הנאקות של הפצוע קרעו את הלב."]],["נָאקָה",["הנקבה של הגמל"],["הנאקה הניקה את הבכר שלה.","הבדואי חלב את הנאקה."]],["נֶחְבָּא אֶל הַכֵּלִים",["מי שאינו יהיר ואינו מתרברב, צנוע"],["הזוכה בפרס היה נחבא אל הכלים ולא רצה לנאום.","שאול נחבא אל הכלים כשביקשו להמליכו."]],["נָס לֵחוֹ",["איבד מערכו, איבד מכוחו"],["הרעיון הזה נס לחו, כבר אף אחד לא מתלהב ממנו.","השחקן הוותיק לא נס לחו והוא ממשיך להופיע."]],["נֶקֶב / נַקְבּוּבִית",["חור קטן, חריר"],["בחולצה היה נקב קטן.","דרך הנקבוביות בעור יוצאת זיעה."]],["סַדָן",["בסיס מעץ או מתכת עליו מניחים חומרים שונים כדי לעבדם (בין הפטיש לסדן - נמצא במצב ללא מוצא)","הקטע הבולט מן הקרקע של העץ לאחר שנכרת, גדם, גדע"],["הנפח הניח את הברזל על הסדן והלם בו.","העובד נמצא בין הפטיש לסדן."]],["עוֹלָל / עוֹלֵל",["תינוק"],["האם חיבקה את העולל.","העוללים ישנו בעריסותיהם."]],["עָטָה",["לבש, התכסה"],["היא עטתה שמלה לבנה.","ההרים עטו שלג."]],["עָיִר",["חמור צעיר"],["העיר הלך אחרי האתון.","הילד רכב על עיר קטן בחצר."]],["עָרַג",["זעק, התחנן","רצה מאוד, השתוקק, התגעגע"],["האייל ערג אל המים.","היא ערגה אל הימים שבהם גרה ליד הים."]],["עֲרִירִי",["חסר צאצאים","בודד, גלמוד, מיותם"],["הזקן העריר השאיר את רכושו לעמותה.","אחרי מות משפחתו נשאר ערירי לגמרי."]],["עֲשָׂבִים שּׁוֹטִים",["דברים שליליים שיש להיפטר מהם, עשבים רעים"],["המנהל רצה לעקור את העשבים השוטים מהארגון.","השחיתות היא עשב שוטה שצריך לעקור מהשלטון."]],["פוֹרְס מָז'וֹר",["אירוע שנמצא מעבר לשליטתנו ושלא ניתן לצפות מראש, יד הגורל"],["סגירת השמיים בגלל המגפה נחשבה לפורס מז׳ור.","החוזה קבע שבמקרה של פורס מז׳ור לא ישולם פיצוי."]],["פּוֹשֵט עוֹרוֹת",["מי שגובה מחיר מופקע על מרכולתו או שירותיו, נצלן"],["המוכרים ליד האטרקציה הם פושטי עורות.","הקבלן פשט את עורם של הדיירים."]],["פַּרְגּוֹל",["שוט"],["העגלון הצליף בפרגול על גב הסוס.","השומר האכזר נשא פרגול בידו."]],["פְּרֶמְיֵירָה",["הצגת הבכורה, ההופעה הראשונה"],["לפרמיירה של הסרט הגיעו כוכבים רבים.","הפרמיירה של ההצגה נערכה בתיאטרון הלאומי."]],["צִיקְלוֹן",["סופה","תרמיל"],["הציקלון החריב כפרים רבים לאורך החוף.","השואב עובד בשיטת ציקלון."]],["צַיְקָן",["קמצן, צר עין"],["הצייקן לא הזמין אף פעם את חבריו לכוס קפה.","אל תהיה צייקן, תשאיר טיפ למלצר."]],["צָפִיר",["תַּיִשׁ"],["הצפיר נגח בגדר.","בעדר היה צפיר גדול עם קרניים ארוכות."]],["קֻבַּעַת",["גביע, כוס או קערה עם \"רגל\""],["הם שתו יין בקובעת כסף.","הזוכה הרים את הקובעת לאוויר."]],["קוֹהֶרֶנְטִי",["שיש קשר בין חלקיו, רציף, עקבי"],["המאמר לא היה קוהרנטי, והיה קשה לעקוב אחרי הטיעון.","הוא דיבר בצורה קוהרנטית למרות הלחץ."]],["קוֹקֵטִי",["גנדרן, מתחנחן"],["היא חייכה חיוך קוקטי מול המצלמה.","הכובע הקוקטי התאים לשמלה."]],["קוֹרֶקְטִי",["נאות, ענייני"],["המורה נהג בה ביחס קורקטי אך קר.","השחקנים שמרו על יחסים קורקטיים."]],["קִלְטֵר",["הפך את האדמה, פורר את האדמה"],["החקלאי קלטר את האדמה לפני הזריעה.","צריך לקלטר את הגינה כדי שהמים יחלחלו."]],["קָפָא עַל שְׁמָרָיו",["היה שמרני, לא התקדם"],["המפעל קפא על שמריו ולא עדכן את המכונות כבר עשרים שנה.","מי שקופא על שמריו נשאר מאחור בעולם המשתנה."]],["קצֶֹר רוּחַ",["חוסר סובלנות"],["הנוסעים הביעו קוצר רוח כשהרכבת התעכבה.","המורה סירבה לקבל את קוצר הרוח של התלמידים."]],["קֶרֶת",["עיר, קריה"],["הם עזבו את הכפר ועברו לגור בקרת הגדולה.","הסיפור מתרחש בקרת קטנה בגליל."]],["קַרְתָן",["כינוי גנאי לאדם שמרן (קַרְתָּנוּת = פרובינציאליות)"],["הוא קרתן שמתנגד לכל רעיון חדש.","הקרתנות של ראשי הכפר מנעה ממנו להתפתח."]],["קַרְתָּנִי",["בן עיר קטנה"],["הנערה הקרתנית הגיעה לעיר הגדולה בפעם הראשונה.","הוא התבייש במבטא הקרתני שלו."]],["רוֹדֵף שְׂרָרָה",["כינוי לתאב כוח והשפעה"],["המנהל החדש הוא רודף שררה שרוצה לשלוט בכל דבר.","רודפי השררה במפלגה נאבקו על כל תפקיד."]],["שִׁבּלֶֹת",["גבעול התבואה עצמו","סוג של תפרת המורכבת מגרגרים צמודים","זרם מים חזק מאוד, מערבולת"],["השיבולים הבשלות התנועעו ברוח.","השחיין נסחף בשיבולת הנהר ונלחם לצאת ממנה."]],["שָׁדוּד",["עייף מאוד, מדוכא,"],["אחרי יום של עבודה בשמש הוא חזר הביתה שדוד.","היא נראתה שדודה ומיואשת אחרי הכישלון."]],["שׁוֹבֵב אֶת נַפְשׁוֹ",["עודד אותו, דרבן אותו"],["הנאום של המאמן שובב את נפשם של השחקנים.","המוזיקה השקטה שובבה את נפשה אחרי יום קשה."]],["שָׂטַם",["שנא, תיעב"],["הוא שטם את אחיו מאז הריב על הירושה.","עשו שטם את יעקב על שלקח את הברכה."]],["שֶׂכְוִי",["תרנגול"],["השכווי קרא עם עלות השחר.","בחצר החווה הסתובבו שכווי ותרנגולות."]],["שְׁנָתוֹת",["קווי סימון על כלי למדידת כמות"],["המדידה נעשתה לפי השנתות שעל כוס המדידה.","מלא את הבקבוק עד השנתה העליונה."]],["שָׁעָה קַלָּה",["פרק זמן קצר"],["הוא נח שעה קלה ואז חזר לעבודה.","לאחר שעה קלה הגיעו האורחים."]],["שַׁפִּיר",["טוב, בסדר, מניח את הדעת"],["הציון שלך שפיר, אבל אפשר עוד לשפר.","המצב בבית החולים שפיר, והחולה מתאושש."]],["שָׂפַת",["שם כלי לחימום על האש (שפת את הקומקום - שם את הקומקום על האש)"],["סבתא שפתה את הקומקום כדי להכין תה.","הם שפתו סיר גדול על המדורה."]],["שָׁקַט עַל שְׁמָרָיו",["היה שמרני, לא התקדם"],["החברה שקטה על שמריה ופספסה את המהפכה הדיגיטלית.","אסור לנו לשקוט על שמרינו אחרי הניצחון."]],["תּוּגָה",["דכדוך, דכאון"],["מבט של תוגה עלה בעיניה כשנזכרה באביה.","השיר נכתב בתוגה על ימי הילדות שחלפו."]],["תּוֹפֶת",["גיהינום, מקום נורא אשר יש בו סכנת חיים"],["החיילים תיארו את שדה הקרב כתופת.","האש הפכה את הבניין לתופת."]],["תַּרְוָוד",["כף מבשלים, מצקת"],["הטבח מזג את המרק בתרווד.","היא ערבבה את הריבה בתרווד עץ."]],["אֶבֶן דֶּרֶךְ",["נקודת ציון המסמנת אירוע משמעותי בהשתלשלות של מאורעות"],["הקמת המדינה הייתה אבן דרך בהיסטוריה של העם.","סיום התואר הוא אבן דרך חשובה בחייו."]],["אֶבֶן רֵחַיִים עַל צַוָּוארוֹ",["אחריות כבדה שמעיקה עליו וממנה לא יכול להשתחרר, קושי רב"],["החוב הגדול הוא אבן ריחיים על צווארו.","הבניין הישן הפך לאבן ריחיים על צוואר העירייה."]],["אֲבַק אָדָם",["אדם חסר ערך"],["הרודן התייחס לנתיניו כאל אבק אדם.","הוא מרגיש כמו אבק אדם מאז שפוטר."]],["אַדֶּרֶת",["גלימה, מעיל עליון רחב (בעיקר של איש עשיר או מכובד)"],["המלך לבש אדרת ארגמן.","אליהו השליך את אדרתו על אלישע."]],["אוּד",["גזיר (חתיכת) עץ שלא נשרף כולו"],["סבא שרד את המלחמה כאוד מוצל מאש.","אוד עשן נותר מהמדורה בבוקר."]],["אוֹפּוֹרְטוּנִיזְם",["ניצול הזדמנויות (בדרך כלל בהקשר שלילי) (הזדמנות - opportunity)"],["האופורטוניזם של הפוליטיקאי הביא אותו לעבור מפלגה פעמיים.","מבקריו האשימו אותו באופורטוניזם."]],["אוֹרֶךְ רוּחַ",["סבלנות, מתינות"],["המורה הפגינה אורך רוח מול התלמידים המפריעים.","צריך אורך רוח כדי לגדל צמחים מזרעים."]],["אֲחוּז תְּזָזִית",["חסר מנוחה, בעל מרץ בלתי נדלה ובלתי נשלט, נסער"],["הוא הסתובב בבית אחוז תזזית לפני הטיסה.","הילדים היו אחוזי תזזית בערב יום ההולדת."]],["אֵימָתַי",["מתי?"],["אימתי תגיע התשובה מהאוניברסיטה?","אימתי נפגשנו לראשונה?"]],["אֵין יָדוֹ מַשֶּׂגֶת",["אין ביכולתו להשיג, אינו יכול לרכוש או לממן"],["אין ידו משגת לקנות דירה במרכז העיר.","המשפחה רצתה לשלוח את הבן לחו״ל, אבל אין ידה משגת."]],["אִישׁ קְּצָווֹת",["אדם קיצוני"],["הוא איש קצוות, או שהוא אוהב מישהו מאוד או ששונא אותו.","בפוליטיקה יש יותר מדי אנשי קצוות."]],["אִלְחוּשׁ",["גרימה לחוסר תחושה בחלק בגוף, הרדמה"],["לפני עקירת השן הרופא ביצע אלחוש מקומי.","האלחוש פג, והכאב חזר."]],["אַלְיָה וְקוֹץ בָּהּ",["דבר טוב שיש בו פגם קטן"],["הדירה החדשה מרווחת, אבל אליה וקוץ בה: היא רחוקה מהעבודה.","ההטבה נשמעת טוב, אבל יש אליה וקוץ בה."]],["אַמְבָּר",["אסם, מחסן תבואה"],["התבואה נאספה אל האמבר.","העכברים נכנסו לאמבר ואכלו את החיטה."]],["אִמֵּץ אֶת יָדָיו",["עודד אותו, דרבן אותו"],["המאמן אימץ את ידי השחקנים לפני הגמר.","המכתב של אמו אימץ את ידיו בשעה הקשה."]],["אַרְכָאִי",["מיושן, עתיק, קדום, ששייך לעבר"],["השפה בספר ארכאית וקשה להבנה.","המשרד עדיין משתמש בשיטות עבודה ארכאיות."]],["אַרְכִיפֶּלָג",["קבוצת איים"],["יוון כוללת ארכיפלג של מאות איים.","הם הפליגו בין איי הארכיפלג."]],["אֶשְׁנָב",["חלון קטן, פתח"],["הקופאית ישבה מאחורי האשנב בקולנוע.","דרך האשנב של המטוס ראינו את העננים."]],["אַשְׁפָּרָה",["גימור איכותי ומשופר של מוצר (בדרך כלל טקסטיל או בטון)","עיבוד ושיפור האריג"],["הבד עבר אשפרה כדי שיהיה רך יותר.","אחרי היציקה, הבטון זקוק לאשפרה במים."]],["בָּא בִּדְבָרִים",["דיבר עמו, שוחח"],["המנהל בא בדברים עם העובדים לפני שקיבל החלטה.","השכנים באו בדברים ופתרו את הסכסוך."]],["בָּא כֹּחַ",["מורשה, נציג"],["בא כוחו של הנאשם ביקש לדחות את הדיון.","העמותה שלחה בא כוח לפגישה עם השר."]],["בָּאוּ לְעֵמֶק הַשָּׁוֶוה",["התפשרו, הסכימו, השתוו"],["אחרי ויכוח ארוך, שני הצדדים באו לעמק השווה.","העובדים וההנהלה באו לעמק השווה בעניין השכר."]],["בּוּסְתָן",["גן של עצי פרי"],["בבוסתן של סבא גדלו תאנים ורימונים.","הילדים שיחקו בבוסתן בין עצי הפרי."]],["בַּחֲרוּת",["תחילת תקופת הבגרות (מהמילה בחור)"],["בימי בחרותו הוא טייל בעולם.","שירי הבחרות של המשורר מלאי תשוקה."]],["בֵּין הַעַרְבַּיִם",["הזמן בין שקיעת השמש ועד שמחשיך, לפנות ערב"],["בין הערביים יצאו הרועים עם העדר הביתה.","ישבנו על המרפסת בין הערביים והבטנו בשמיים."]],["בֵּין הַשְׁמָשוֹת",["בין ערביים, בזמן דמדומים, לפנות ערב"],["בין השמשות הדליקה אמא את נרות השבת.","העטלפים יוצאים ממערותיהם בין השמשות."]],["בֵּית מִטְבָּחַיִם",["משחטה"],["הפרות הובלו לבית המטבחיים.","בית המטבחיים העירוני נמצא מחוץ לעיר."]],["בֵּית נְתִיבוֹת",["אולם נוסעים בשדה תעופה או בתחנת רכבת"],["נוסעים רבים המתינו בבית הנתיבות של שדה התעופה.","בבית הנתיבות של תחנת הרכבת נפתחה מסעדה."]],["בֵּית תַּמְחוּי",["מקום שמחלק אוכל לעניים בחינם או תמורת תשלום סמלי"],["בחורף בית התמחוי מחלק מאות ארוחות חמות.","הם התנדבו בבית תמחוי לפני החג."]],["בִּמְחִי יָד",["בלי מאמץ, בהינף יד"],["הנשיא ביטל במחי יד את ההסכם.","במחי יד נמחקו כל החסכונות שלו."]],["בֶּן-לְוָיָה",["מי שמתלווה לאדם אחר, שהולך איתו"],["הנשיא הגיע עם בני לוויה רבים.","הכלב היה בן לוויה נאמן לזקן."]],["בַּעֲלֵי שְׂרָרָה",["אנשים הנושאים בתפקיד רשמי כלשהו, אנשים רמי דרג בשלטון (בנימת גנאי)"],["בעלי השררה התעלמו מבקשות התושבים.","המשורר לעג לבעלי השררה בשיריו."]],["בַּעֲרוֹב יָמָיו",["בסוף חייו, לעת זקנתו"],["בערוב ימיו כתב את זיכרונותיו.","בערוב ימיה היא עברה לגור ליד ילדיה."]],["בְּשׂוֹרָה",["ידיעה חשובה"],["הם קיבלו את הבשורה על הולדת הבן בשמחה.","הבשורה על שחרור השבויים נפוצה במהירות."]],["גֶּבֶר",["תרנגול"],["קריאת הגבר העירה את כל הכפר.","לפני שהגבר קורא, הדייגים כבר בים."]],["גּוּזְמָה",["הגזמה, הפרזה"],["זו גוזמה לומר שהוא הזמר הטוב בעולם.","בלי גוזמה, זה היה הסרט הכי מצחיק שראיתי."]],["גּוּשְׁפַּנְקָה",["אישור סופי","חותמת רשמית של אדם רם מעלה"],["הממשלה נתנה גושפנקה לתוכנית.","ההסכם קיבל גושפנקה רשמית מבית המשפט."]],["גָּזַר",["פסק, קבע את גזר הדין","הסיק"],["השופט גזר עליו חמש שנות מאסר.","מדבריו גזרתי שהוא לא מרוצה."]],["גְּזֵרָה שָׁוָוה",["השוואה בין שני דברים ולמידה על האחד מן האחר"],["אי אפשר לעשות גזרה שווה בין שני המקרים, הם שונים מאוד.","החוקר עשה גזרה שווה בין שתי המגפות."]],["גַּיִס חֲמִישִׁי",["כינוי לבוגדים מבית, גורם פנימי המסייע לאויב"],["בזמן המלחמה חששו מפני גיס חמישי בתוך העיר.","המנהיג האשים את מתנגדיו שהם גיס חמישי."]],["גָּמַר בְּדַעְתּוֹ / בְּלִבּוֹ / אוֹמֶר",["החליט"],["הוא גמר בדעתו לעזוב את העבודה.","היא גמרה אומר ללמוד לבחינה כל יום."]],["דּכִֹי",["רעש הגלים כשהם מתנפצים"],["שמענו את דוכי הים מהחלון.","דוכי הגלים על הסלעים הרדימו אותנו."]],["דִּיאָלוֹג",["דו שיח"],["המורה פתחה בדיאלוג עם התלמידים על הנושא.","המחזה בנוי כדיאלוג בין שתי דמויות."]],["דְּיוֹטָה",["קומה בבית"],["הם גרים בדיוטה העליונה של הבניין.","המשרדים נמצאים בדיוטה השנייה."]],["דיוֹתָה",["כלי קיבול לדיו"],["הסופר טבל את העט בדיותה.","על שולחן הכתיבה עמדה דיותה מזכוכית."]],["דַלְפוֹן",["עני"],["הדלפון לא יכול היה לשלם את שכר הדירה.","הוא עזר לדלפונים בעיר בכל דרך שיכול."]],["הִבְרִיחַ",["הכניס פנימה בניגוד לחוק","נעל, סגר באמצעות בריח"],["הסוחר הבריח סחורה דרך הגבול.","לפני השינה הבריח את הדלת."]],["הִגִיר",["שפך, הזיל"],["היא הגירה דמעות על אובדן חברתה.","הם הגירו מים על הצמחים היבשים."]],["הוֹלֵךְ בָּטֵל",["בטלן"],["הבן שלו הולך בטל כבר שנה.","העירייה ניסתה לגייס את ההולכים הבטלים לעבודות ציבוריות."]],["הוֹקִיעַ",["תקף מילולית, מתח ביקורת, גינה","המית מישהו בפומבי בצליבה או בתלייה"],["האו״ם הוקיע את הפגיעה באזרחים.","העיתונאי הוקיע את השחיתות בעירייה."]],["הֵזֵם",["הוכיח כי דבריו של אדם אחר אינם נכונים"],["עורך הדין הזים את עדותו של השכן.","המחקר החדש הזים את התיאוריה הישנה."]],["הֶחְפִּיץ",["התייחס לאדם כאילו היה חפץ"],["המבקרים טענו שהפרסומת מחפיצה נשים.","היא הרגישה שהמנהל מחפיץ אותה ולא רואה את כישוריה."]],["הִכָּה עַל חֵטְא",["התחרט על מעשה רע, הודה, חזר בתשובה"],["הפוליטיקאי היכה על חטא על ההבטחות שלא קיים.","התלמיד היכה על חטא והתנצל בפני המורה."]],["הִלֵּך אֵימִים",["הפחיד אותו מאוד, אִיֵּם, הרתיע"],["הכלב הגדול הילך אימים על עוברי האורח.","השליט הילך אימים על מתנגדיו."]],["הֵנֵץ",["הוציא פרחים או ניצנים, לבלב, פרח"],["עצי השקדים הנצו באמצע החורף.","באביב הנצו כל הפרחים בגינה."]],["הִשְלִיך אַחֲרֵי גֵּווֹ",["התנער ממנו והתכחש לקשר אליו, הפנה לו עורף (גֵּווֹ= גופו)"],["אחרי שהתעשר, הוא השליך את משפחתו אחרי גוו.","הממשלה השליכה את ההבטחות לבוחרים אחרי גוה."]],["הִתְבַּשֵּׂם",["השתכר, התבסם","הזליף בושם על הגוף"],["האורחים התבשמו ביין ושרו עד הבוקר.","היא התבשמה בבושם יקר לפני הערב."]],["הִתְפַּקֵּר",["חזר בשאלה, כפר"],["הוא התפקר בגיל עשרים ועזב את הישיבה.","הקהילה לא סלחה לה על כך שהתפקרה."]],["זִבּוּרִית",["אדמה גרועה שאינה טובה לשימוש חקלאי","החלק הגרוע, סחורה גרועה"],["בזיבורית לא צומח כמעט דבר.","המוכר נתן לנו את הזיבורית ושמר את הפירות הטובים לעצמו."]],["זַג",["קליפת הפרי (בדרך כלל משמש בהתייחסות לקליפת הענב)"],["מזגי הענבים נזרקו אחרי הסחיטה.","הוא ירק את הזג ואכל את הענב."]],["זְחִיחוּת דַּעַת",["שביעות רצון עצמית הגובלת ביהירות"],["זחיחות הדעת של השחקן הביאה להפסד הקבוצה.","הוא דיבר בזחיחות דעת על ההצלחה שלו."]],["חָוָוק",["מדרגה, שלב בסולם"],["החווק התחתון של הסולם נשבר.","הוא טיפס חווק אחר חווק."]],["חִילָּה",["המתיק"],["היא חילתה את התה בדבש.","הרוקח חילה את התרופה המרה בסוכר."]],["חִילָּה אֶת פָּנָיו",["התחנן (חילה - המתיק)"],["הנאשם חילה את פני השופט שיקל בעונשו.","היא חילתה את פניו שישאר."]],["חִישוּר",["מוט המחבר את מרכז הגלגל עם החישוק","אחת העצמות בכף היד"],["החישור של האופניים נשבר בנסיעה.","בנפילה נשבר לו החישור ביד."]],["חָמַד לָצוֹן",["שם מישהו לצחוק, התלוצץ"],["החברים חמדו לצון והחביאו את התיק שלו.","הוא חמד לצון מהמורה החדשה."]],["חֲמַרְמרֶֹת",["האנג- אובר"],["אחרי המסיבה הוא קם עם חמרמורת.","בגלל החמרמורת הוא לא הגיע לעבודה."]],["חָרֵד",["מפחד, מבוהל, מזועזע"],["האם הייתה חרדה לשלום בנה החייל.","הוא התעורר חרד מהרעש."]],["חֶרְמֵשׁ",["כלי לקצירת תבואה המורכב מסכין בצורת קשת המחוברת למקל ארוך"],["האיכר קצר את החיטה בחרמש.","בציור מופיעה דמות המוות אוחזת בחרמש."]],["חָתוּל בַּשַּׁק",["כינוי לדבר שטיבו לא ידוע"],["לקנות רכב משומש בלי בדיקה זה כמו לקנות חתול בשק.","המועמד הזה הוא חתול בשק, אף אחד לא מכיר אותו."]],["טַס",["מגש"],["המלצר הגיש את הכוסות על טס כסף.","על הטס נערמו עוגיות."]],["טַפְסָן",["פועל בניין מומחה בהתקנת תבניות ליציקת בטון"],["הטפסנים בנו את התבניות לפני יציקת הבטון.","הוא עובד כטפסן באתר בנייה."]],["טַפְסָר",["דרגת קצונה במכבי- אש","פקיד"],["הטפסר פיקד על צוות הכבאים.","הטפסר הזה אחראי על כל התחנה."]],["טָרַף",["ערבב (טרף קלפים)"],["הוא טרף את הקלפים וחילק לשחקנים.","טרפו את הביצים עם הסוכר."]],["יָגוֹר",["פוחד, חושש (אשר יגורתי בא - הדבר ממנו חששתי קרה)"],["אשר יגורתי בא: הטיסה בוטלה.","הוא יגור מפני העונש."]],["יוֹשֵׁב עַל הַגָּדֵר",["נמנע מלנקוט עמדה, נמנע מלצדד"],["בוויכוח על הבחירות הוא יושב על הגדר.","אי אפשר לשבת על הגדר כשמדובר בצדק."]],["יִחֵל",["קיווה"],["המשפחה ייחלה לשובו של הבן.","הם ייחלו לגשם אחרי חודשים של בצורת."]],["יִצְהָר",["שמן זך"],["הנר נדלק בשמן יצהר.","במקדש השתמשו בשמן יצהר זך."]],["יָשַׁב עַל הַמְּדוֹכָה",["התלבט, התחבט (מדוכה - קערה לכתישת תבלינים בעזרת עֵלִי - \"כתש\" את הבעיה)"],["הוועדה ישבה על המדוכה במשך שעות.","לפני שבחר מקצוע, הוא ישב על המדוכה חודשים."]],["כְּבָרָה",["מסננת, כלי שתשתיתו עשויה רשת"],["היא ניפתה את הקמח בכברה.","אחרי הסינון בכברה נותרו רק האבנים הגדולות."]],["כִּיוּל",["כיוון, איפוס"],["הטכנאי ביצע כיול למשקל.","לפני כל טיסה מבצעים כיול למכשירים."]],["כִּיפֵחַ",["גבוה מאוד"],["ביקרנו בעיר עם מגדלים כיפחים.","עצי הארז הכיפחים התנשאו מעלינו."]],["כִּלְאַחַר יָד",["בלי כוונה מיוחדת, כבדרך אגב"],["הוא הזכיר כלאחר יד שהוא עומד להתחתן.","אי אפשר להתייחס לבעיה הזאת כלאחר יד."]],["לֹא בִּכְדִי",["לא לשווא, לא לחינם"],["לא בכדי זכתה במדליה, היא התאמנה שנים.","לא בכדי הזהירו אותנו מהדרך הזאת."]],["לְהַוָּתִי",["לצערו הרב, למזלו הרע"],["להוותי, לא הספקתי להיפרד ממנו.","להוותו, הכספים שהשקיע אבדו."]],["לוֹקָלִי",["מקומי (local), אזורי"],["החדשות הלוקליות מעניינות רק את תושבי העיר.","זו בעיה לוקלית שלא משפיעה על כל המדינה."]],["לֵיל שִמּוּרִים",["לילה לבן, לילה שערים בו (בדרך כלל מתוך דאגה)"],["לפני הניתוח עבר עליה ליל שימורים.","הם העבירו ליל שימורים ליד מיטת התינוק."]],["מָאוֹר",["גוף מפיץ אור, זוהר"],["השמש והירח הם המאורות הגדולים בשמיים.","חיוכה היה מאור בחייו."]],["מַגְלֵב",["שוט"],["השומר הצליף במגלב.","העבדים עבדו תחת מגלב המשגיחים."]],["מְדוּשָן עוֹנֶג",["מרוצה מאוד, מלא נחת, מסופק"],["החתול שכב על הספה מדושן עונג.","אחרי הארוחה החגיגית ישבנו מדושני עונג."]],["מוּג לֵב",["פחדן, רַך לֵב"],["הוא מוג לב מכדי להתעמת עם הבוס.","מוגי הלב ברחו מהקרב."]],["מוֹנוֹלוֹג",["נאום, שיח יחיד"],["השחקן נשא מונולוג ארוך באמצע ההצגה.","השיחה איתו הייתה מונולוג, הוא לא נתן לאף אחד לדבר."]],["מוֹץ",["קליפת גרגירי הדגנים"],["הרוח נשאה את המוץ והשאירה את הגרעינים.","הרשעים דומים למוץ שהרוח נושאת."]],["מוּשְׂכָּל רִאשׁוֹן",["הנחת יסוד שאינה ניתנת להוכחה, אולם מתייחסים אליה כאילו היא נכונה ולא ניתנת לערעור"],["השוויון בפני החוק הוא מושכל ראשון בדמוקרטיה.","במתמטיקה יש מושכלות ראשונים שעליהם נבנית ההוכחה."]],["מָט",["זז במקומו בחוסר יציבות","מטושטש, עמום"],["הכיסא הישן מט כשהתיישבתי עליו.","אורו המט של הנר האיר את החדר."]],["מַט לִנְפּוֹל",["לא יציב, רעוע"],["הבניין הישן מט ליפול.","השלטון של הדיקטטור מט ליפול."]],["מַכְלֵב",["מהדק, שדכן"],["הוא חיבר את הדפים במכלב.","אזלו הסיכות במכלב."]],["מִלְּגוֹ / מִלְגַו",["מבפנים, מתוך (להיפך: מִלְבַּר)"],["השינוי צריך לבוא מלגו, לא מבחוץ.","מלגו הבית נראה חדש לגמרי."]],["מִלְּגוֹ וּמִלְבַּר",["מבפנים ומבחוץ"],["הם שיפצו את הבית מלגו ומלבר.","הוא אדם ישר מלגו ומלבר."]],["מֶלוֹדִי",["בעל מנגינה נעימה"],["השיר החדש שלו מלודי ונעים לאוזן.","ילדים אוהבים שירים מלודיים ופשוטים."]],["מְלִיצָה",["דברי חכמה, לעתים בסגנון פיוטי עם חריזה","דיבור גבוה, לעתים תוך ציטוט פסוקים"],["הרב שילב מליצות מהמקורות בדרשה.","מאמרו היה מלא מליצות ריקות."]],["מַמְגוּרָה",["אסם תבואה גדול"],["החיטה אוחסנה בממגורה ליד הנמל.","הממגורות הגדולות נראו מרחוק."]],["מְסוּקָס",["מחוספס, מיובל"],["הם ישבו בצל עץ זית מסוקס.","ידיו המסוקסות של הזקן סיפרו על שנות עבודה."]],["מִסְרוֹן",["אס- אם- אס, הודעת טקסט"],["היא שלחה לו מסרון שהיא מאחרת.","הבנק שולח מסרון על כל חיוב."]],["מְעוּשֶׂה",["לא אמיתי, מזויף, מלאכותי"],["החיוך שלו היה מעושה.","הם דיברו בנימוס מעושה."]],["מָרָה שְחוֹרָה",["דיכאון, ראיית שחורות, פסימיות"],["הוא שקע במרה שחורה אחרי הכישלון.","אל תיכנס למרה שחורה, עוד יהיו הזדמנויות."]],["מָרִית",["כלי מריחה הדומה לסכין עם להב קהה, שפכטל"],["הטייח החליק את הטיח במרית.","היא מרחה את הקרם על העוגה בעזרת מרית."]],["מַשׂוֹא פָּנִים",["העדפה של אחד הצדדים, אפליה"],["השופט חייב לפסוק בלי משוא פנים.","ההורים הואשמו במשוא פנים כלפי הבן הצעיר."]],["מַשְכּוּכִית",["כינוי לאייל המושך את העדר אחריו"],["המשכוכית הובילה את העדר אל המכלאה.","התלמיד הזה הוא המשכוכית של הכיתה, כולם הולכים אחריו."]],["נָבוּב",["חלול, ריק. בהשאלה: ריקני, שטחי"],["גזע העץ היה נבוב.","ההבטחות שלו היו נבובות."]],["נִיבוֹן",["אוסף ניבים ופתגמים, מילון ניבים"],["המורה המליצה לנו על ניבון לתלמידים.","בניבון מצאתי את פירוש הביטוי."]],["נִמְלַך בְּדַעֲתוֹ",["חשב והתלבט לגבי סוגיה כלשהי","שינה את דעתו, התחרט"],["הוא נמלך בדעתו והחליט לא לנסוע.","אחרי לילה של מחשבה, היא נמלכה בדעתה."]],["נִמְלַךְ בּוֹ",["התייעץ איתו, נועץ בו"],["המלך נמלך ביועציו לפני שיצא למלחמה.","לפני שקנה את הדירה, נמלך בעורך דין."]],["נָפִיל",["ענק"],["הנפיל גולית עמד מול דוד.","החברה הקטנה התחרתה בנפילי התעשייה."]],["נִצְרָך",["אדם עני שזקוק לעזרה"],["העמותה מסייעת לנצרכים בעיר.","לקראת החג חולקו סלי מזון לנצרכים."]],["נֶקְטָר",["משקה האלים, משקה פירות \"איכותי\" יותר ממשקאות תרכיז למיניהם"],["הדבורים אוספות צוף ונקטר מהפרחים.","בארוחת הבוקר הוגש נקטר אפרסקים."]],["סְגַלְגַל",["אליפטי, בצורת ביצה"],["לחלון יש צורה סגלגלה.","פניה הסגלגלות הזכירו את פני אמה."]],["סָר",["פנה, זז, יצא","פקד, בא, לבקר"],["הנהג סר ימינה בצומת.","החבר סר אלינו לביקור קצר."]],["סִרְהֵב",["הפציר, ביקש","עמד על התנגדותו למשהו, לא הסכים"],["היא סירהבה להצעה ולא הסכימה לשמוע עליה.","הם סירהבו לקבל את הפשרה."]],["עוֹקֵר הָרִים",["בעל שכל חריף, כינוי לאדם חריף בדברי תורה"],["הרב הזה עוקר הרים ויודע כל פרט בתלמוד.","התלמיד החדש הוא עוקר הרים במתמטיקה."]],["עוּר!",["קום! התעורר!"],["עורי, עורי, קומי לחיים חדשים!","עור! הגיע הזמן לקום."]],["עִזָבוֹן",["ירושה"],["האחים רבו על העיזבון של אביהם.","העיזבון הועבר לקרן צדקה."]],["עִידִּית",["אדמה משובחת. בהשאלה: דבר משובח, החלק המובחר"],["הם קנו חלקת עידית בעמק.","הצבא מקבל את העידית של הבוגרים."]],["עֵינַיִים טְרוּטוֹת",["עיניים סגורות למחצה (לרוב עקב מחסור בשינה)"],["התלמיד ישב בכיתה בעיניים טרוטות.","אחרי המשמרת הלילית הגיעה האחות בעיניים טרוטות."]],["עָלֶה נִידָּף",["חלש וחסר אונים, חדל ישע"],["מול הבירוקרטיה הוא הרגיש כעלה נידף.","הממשלה נראתה כעלה נידף מול המשבר."]],["עַפְרָה",["סלע המכיל מתכת, מחצב"],["מהעפרה הזאת מפיקים נחושת.","העפרה הועברה למפעל להתכה."]],["עַפְרוֹת זָהָב",["שכבות של אדמה המכילה זהב"],["המכרה מלא בעפרות זהב.","החופרים גילו עפרות זהב בנהר."]],["עִקֵּר",["גרם לו להיות עקר (חסר יכולת להביא צאצאים)","חיטא, טיהר"],["הווטרינר עיקר את החתולה.","צריך לעקר את כלי הניתוח."]],["עָקַר",["היגר, ירד (מהארץ)","תלש, שלף, קרע אותו ממקומו"],["המשפחה עקרה לארצות הברית.","הסערה עקרה עצים מן השורש."]],["עָקָר",["חסר טעם או תועלת","שאינו פורה, לא מסוגל להוליד צאצאים"],["הוויכוח העקר נמשך שעות.","האדמה העקרה לא הניבה יבול."]],["עָקַר אֶת רַגְלָיו",["הלך"],["הם עקרו את רגליהם מהמסיבה מוקדם.","אחרי שהחנות נסגרה, עקרו את רגליהם משם."]],["עַרְדָלַיים",["נעליים שנועלים על נעליים כדי שלא יירטבו"],["בחורף הגשום נעלו ערדליים מעל הנעליים.","הילדים קפצו בשלוליות עם ערדליים."]],["פֶּה מֵפִיק מַרְגָּלִיוֹת",["כינוי לאדם בעל כושר ביטוי יוצא מן הכלל"],["הנואם הוא פה מפיק מרגליות.","השופטת הייתה פה מפיק מרגליות, וכל משפט שלה צוטט."]],["פּוֹלִיגַמְיָה",["נישואי גבר למספר נשים (פולי - הרבה)"],["בחלק מהמדינות הפוליגמיה אסורה בחוק.","המחקר עסק בפוליגמיה בחברות מסורתיות."]],["פָּלוּש",["פרוזדור, מסדרון"],["הילדים רצו לאורך הפלוש הארוך.","המעילים נתלו בפלוש."]],["פָּסַח עַל שְׁתֵּי הַסְּעִיפִּים",["היסס, לא היה עקבי"],["המפלגה פוסחת על שתי הסעיפים ואינה מחליטה.","אל תפסח על שתי הסעיפים, תבחר צד."]],["פַרְהֶסְיָה",["לעיני כל, בפומבי"],["הוא אכל בפרהסיה ביום הכיפורים.","הזוג התנשק בפרהסיה."]],["פְּרַקְלִיט",["עורך דין, טוען"],["הפרקליט הגיש את כתב האישום.","הוא שכר פרקליט מוכר כדי להגן עליו."]],["צִחְצוּחַ חַרָבוֹת",["התנצחות, ויכוח סוער"],["בישיבה היו צחצוחי חרבות בין השרים.","אחרי צחצוחי החרבות בתקשורת, הם נפגשו לשיחה."]],["צִינָּה",["מגן","קור"],["הלוחם הרים את הצינה מול החצים.","צינת הבוקר חדרה לעצמותינו."]],["צִלְצָל",["כידון המחובר לחבל ומשמש לציד ימי"],["הדייגים צדו את הלווייתן בעזרת צלצל.","הצלצל ננעץ בדג הגדול."]],["קִבּוֹרֶת",["שריר הזרוע"],["המתעמל גאה בקיבורת שלו.","הוא כיווץ את הקיבורת והראה את כוחו."]],["קְדִימוֹן",["פרומו"],["הקדימון של הסרט החדש שודר בטלוויזיה.","הקדימון גרם לכולם לחכות לתוכנית."]],["קוֹטֵל קָנִים",["אדם פשוט, חסר השכלה (מופיע בעיקר בביטוי: אינו קוטל קנים - מומחה)"],["הוא אינו קוטל קנים, הוא מומחה בתחומו.","אל תזלזל בו, הוא לא קוטל קנים."]],["קוּרְנָס",["פטיש כבד"],["הנפח הלם בקורנס על הברזל.","הפועלים שברו את הקיר בקורנס."]],["קְטַן אֱמוּנָה",["ספקן, סקפטי"],["קטני האמונה לא האמינו שהפרויקט יצליח.","אל תהיה קטן אמונה, הכול יסתדר."]],["קִיצֵּץ אֶת כְּנָפָיו",["הפריע לו במשהו ומנע את חופש פעולתו, הגביל","הפיג את התלהבותו"],["התקציב הקטן קיצץ את כנפי הצוות.","ההורים קיצצו את כנפיו ולא נתנו לו לנסוע."]],["קִיתוֹן",["כד, כלי לנוזלים"],["המשרתת מזגה מים מהקיתון.","הוא שפך עליה קיתון של ביקורת."]],["קָץ",["מאס, נמאס עליו"],["הוא קץ בעבודה המשרדית.","היא קצה בשקרים שלו."]],["קִרְקֵעַ",["אסר להמריא, ריתק לקרקע","ריתק לבית"],["הטייס קורקע אחרי התקרית.","ההורים קרקעו את הבן לשבוע אחרי הציון."]],["רֵחַיִים",["מתקן משתי אבנים לטחינת גרגרי תבואה (רֶכֶב ושֶכֶב - האבן העליונה והאבן התחתונה)"],["בכפר טחנו את החיטה בריחיים.","אבני הריחיים העתיקות מוצגות במוזיאון."]],["רֵיחַיִים עַל צַוָּארוֹ",["אחריות כבדה שמעיקה עליו וממנה לא יכול להשתחרר, קושי רב"],["החוב הגדול הוא ריחיים על צווארו.","הטיפול בהורים החולים היה ריחיים על צווארה."]],["שְבִיב",["ניצוץ. בהשאלה: מעט מאד, שמץ (שביב תקווה - ניצוץ של תקווה, תקווה מועטה אך קיימת)"],["שביבי אש עפו מהמדורה.","נותר שביב של תקווה שהנעדר יימצא."]],["שָׁדוּף",["ריק, חסר תוכן","דק, רזה"],["השיחה איתו הייתה שדופה ומשעממת.","השיבולים השדופות לא נתנו גרעינים."]],["שׁוּר",["הבט, ראה, הסתכל (בציווי)"],["שור כמה יפה השקיעה!","שורו מסביב, הכול פורח."]],["שָׁח / שָׁחָה",["התכופף (שחוח - כפוף)","קד קידה, השתחווה, השתטח"],["הזקן שח מתחת למשא הכבד.","המשרתים שחו בפני המלך."]],["שִׂחֲקָה לוֹ הַשָּׁעָה",["התמזל מזלו"],["שיחקה לו השעה, והוא זכה בפרס הראשון בהגרלה.","לא לכל אחד משחקת השעה כמו שהיא שיחקה לה."]],["שִיוָּוה (בְּנַפְשוֹ)",["דמיין"],["הוא שיווה בנפשו את הרגע שבו יעלה לבמה.","שווי בנפשך מה היה קורה אילו לא הגענו בזמן."]],["שִׂיחוֹן",["ספרון המכיל משפטים ותרגומם לצורך לימוד שפה או ככלי עזר לתיירים"],["לפני הטיול ליפן קנינו שיחון יפנית.","התייר חיפש בשיחון איך שואלים על הדרך לתחנה."]],["שְׂרָרָה",["שלטון, סמכות"],["האצילים ניסו לשמור על השררה שלהם.","הוא לא רצה שררה, רק לעזור לאנשים."]],["תּוּפִין",["מאפה, עוגיה"],["לצד הקפה הוגשו תופינים ביתיים.","סבתא אפתה תופינים לכבוד החג."]],["תְּזָזִית",["שיגעון, טירוף"],["בערב הבחירות אחזה במטה תזזית.","התזזית שלו לפני הטיסה הדביקה את כל המשפחה."]],["אֶבְיוֹן",["עני, חסר- כל"],["לפני החג חילקו לאביונים חבילות מזון.","המשפחה ירדה מנכסיה ונעשתה אביונה."]],["אִבֵּק",["ניקה מאבק, הוציא אבק","פיזר אבקה על משהו"],["היא איבקה את המדפים לפני האורחים.","האופה איבק את העוגה באבקת סוכר."]],["אוּרִים וְתֻמִּים",["מומחה, מקור מוסמך שאין לערער עליו, סמכות עליונה"],["בענייני היסטוריה, הפרופסור הוא האורים והתומים.","אל תחשוב שאתה האורים והתומים בכל נושא."]],["אֶזוֹטֶרִי",["פנימי, כמוס, ידוע רק לחוג מצומצם","שולי, חסר עניין לציבור"],["המחקר עוסק בנושא אזוטרי שמעניין רק מומחים מעטים.","זו שאלה אזוטרית שאין לה חשיבות לרוב הציבור."]],["אִילוּחַ",["זיהום, מוגלה"],["הרופא חשש מאילוח בפצע וטיפל בו באנטיביוטיקה.","צריך לחטא את החתך כדי למנוע אילוח."]],["אִינְטֶגְרָלִי",["חלק חיוני ובלתי נפרד, שאי- אפשר בלעדיו","שלם, שכל חלקיו נמצאים"],["המוזיקה היא חלק אינטגרלי מההצגה.","התחבורה הציבורית היא חלק אינטגרלי מתכנון העיר."]],["אֶפִּילוֹג",["קטע קצר שנוסף לספר לאחר סיומו","סוף, סיום"],["באפילוג של הספר מסופר מה קרה לגיבורים שנים אחר כך.","הנאום שלו היה מעין אפילוג לקריירה הארוכה."]],["אִצְטְלָה",["כבוד, גדולה או משרה חשובה שהם בדרך כלל מדומים","גלימה, בגד עליון רחב שנלבש לרוב על ידי אנשים מכובדים"],["הוא עוטה אצטלה של מומחה, אבל אין לו שום הכשרה.","השופט לבש את אצטלת הכבוד שלו לטקס."]],["אִשְׁרוּר",["אישור סופי"],["האמנה קיבלה אשרור בפרלמנט.","ההסכם ייכנס לתוקף רק אחרי אשרורו."]],["אֶתְנָן",["במקור: שכר יצאנית. בהשאלה: שכר בתמורה לדבר לא מוסרי, מתנה או טובת הנאה בכדי להשיג רווח לא הוגן"],["התפקיד ניתן לו כאתנן על תמיכתו בשר.","המבקרים טענו שההטבות לחברה הן אתנן פוליטי."]],["בְּאִיבּוֹ",["בראשית דרכו, בצעירותו (נקטף באיבו - מת בגיל צעיר)"],["החייל נקטף באיבו בגיל עשרים.","הרעיון נגנז עוד באיבו."]],["בְּדוּתָה",["שקר, דבר בדוי"],["הסיפור על האוצר הקבור הוא בדותה.","העיתון פרסם בדותה על הזמר."]],["בְּדַיָה",["שקר (בָּדָה - המציא)"],["כל הסיפור שלו היה בדיה מתחילתו ועד סופו.","השמועה התבררה כבדיה."]],["בּוּלְמוּס",["רעב חזק","תאווה, חשק עז"],["אחרי הצום תקף אותו בולמוס, והוא אכל הכול.","היא נתקפה בולמוס קניות בעונת המבצעים."]],["בַּחֲטָף",["בחופזה, במהירות","ללא סימן מוקדם, לפתע"],["הוא אכל בחטף ויצא לעבודה.","הגשם הגיע בחטף, בלי שום התראה."]],["בִּיגַמְיָה",["נשואי גבר אחד לשתי נשים בו זמנית, נישואים כפולים"],["בישראל ביגמיה אסורה על פי חוק.","הוא נעצר בחשד לביגמיה."]],["בָּלוּם",["סתום, אטום, סגור","מלא עד הסוף, עמוס, עשיר ב-"],["הצינור היה בלום, והמים לא זרמו.","הוא מדבר בלי הפסקה, אבל הראש שלו בלום ידע."]],["בַּרְדָס",["כיסוי ראש המחובר אל הבגד מאחור, \"קפוצ'ון\""],["הוא הרים את הברדס כשהתחיל לרדת גשם.","במעיל יש ברדס מחומם."]],["גָחוֹן",["בטן (בעיקר של בעלי חיים, מקובל גם בכלי רכב, גחון הטנק - החלק התחתון של הטנק)"],["הנחש זחל על גחונו.","המטוס נחת על גחונו אחרי שגלגליו לא נפתחו."]],["גִילְדָה",["קבוצת אנשים בעלי אינטרס משותף"],["גילדת הצורפים שלטה על מסחר התכשיטים בעיר.","הוא חבר בגילדת התסריטאים."]],["דְּבוּקָּה",["צרור פצצות המשוגרות יחדיו","קבוצת צנחנים הצונחים יחדיו"],["דבוקת צנחנים נחתה בשדה.","הרוכבים נסעו בדבוקה צפופה לאורך המסלול."]],["דְּבֵלָה",["גוש של תאנים מיובשות"],["המטיילים אכלו דבלה ותמרים בדרך.","אביגיל הביאה לדוד מאתיים דבלים."]],["דָּגָן",["כל תבואת השדה"],["החקלאים גידלו דגן בעמק.","הלחם עשוי משבעה סוגי דגן."]],["דוּאָלִי",["בעל שני צדדים"],["לתוכנית יש תפקיד דואלי: לחנך ולבדר.","יש לו אזרחות דואלית, ישראלית וצרפתית."]],["דּוֹרוֹן",["מתנה"],["האורחים הביאו דורון לבעלי הבית.","הילדים הכינו דורון לאם ליום הולדתה."]],["דֶּחִי",["כישלון, מעידה"],["הכישלון היה דחי זמני, והוא התאושש במהרה.","הקבוצה ספגה דחי בתחילת העונה."]],["דָּלוּחַ",["לא צלול, עכור"],["המים בבור היו דלוחים ולא ראויים לשתייה.","בשלולית הדלוחה לא ראינו את הקרקעית."]],["דִּמְדּוּמִים",["אור חיוור שניתן לראות לאחר השקיעה"],["בדמדומים יצאו הצבאים לרעות.","העיר נראתה יפה במיוחד באור הדמדומים."]],["דִמְעוֹת שָׁלִישׁ",["בכי גדול, בדמעות ובתחנונים רבים"],["היא התחננה בדמעות שליש שיחזור.","הילד בכה דמעות שליש כשהכלב שלו אבד."]],["דֹּפִי",["פגם, ליקוי"],["לא מצאו דופי במעשיו.","השופט הוא אדם ללא דופי."]],["דַפְתָר",["פנקס, מחברת"],["הסוחר רשם את החובות בדפתר.","המורה הוציאה את הדפתר ורשמה את הנוכחים."]],["דֵרָאוֹן",["בושה, חרפה"],["המעשה שלו היה דראון לכל המשפחה.","העיר זכתה לדראון עולם בגלל הטבח."]],["דַרְגָש",["שרפרף, כסא נמוך, ספסל נמוך לשכיבה"],["הם ישנו על דרגשים בצריף.","החייל התיישב על הדרגש ונעל נעליים."]],["הָבִיל",["ספוג הבל, מלא אדי מים"],["האוויר במקלחת היה הביל.","הם יצאו מהבית אל הבוקר ההביל."]],["הִבְלִיעַ",["אמר דברים בצורה מרומזת","הסתיר דבר בתוך דבר, הכמין"],["הוא הבליע בדבריו ביקורת על המנהל.","היא הבליעה את הגלולה בתוך פרוסת גבינה לכלב."]],["הָגִיג",["מחשבה, הרהור, שרעפים, חקרי לב"],["הוא שקע בהגיגים על משמעות החיים.","בטור שלו הוא משתף את הגיגיו על העיר."]],["הִגִּיהַּ",["תיקן שגיאות בטקסט כתוב"],["העורכת הגיהה את הספר לפני ההדפסה.","מישהו צריך להגיה את המכתב, יש בו שגיאות."]],["הִגְלִיד",["התאחה, נרפא"],["השריטה הגלידה אחרי כמה ימים.","עם הזמן, הפצע בלב הגליד."]],["הִדִּיר",["מנע, שלל, אסר"],["הריב הדיר אותו מבית הוריו.","החוק החדש הדיר נשים מתפקידים בכירים."]],["הַזָחָה",["הרווח שבתחילת פיסקה חדשה"],["המורה ביקשה להוסיף הזחה בתחילת כל פסקה.","בלי הזחה, קשה לראות איפה מתחילה פסקה חדשה."]],["הֵזִיחַ",["הזיז משהו ממקום למקום, הסיט"],["הם הזיחו את הארון כדי לנקות מאחוריו.","הרוח הזיחה את העננים."]],["הִילֵּךְ",["שוטט, הלך לאיטו ללא מטרה מסוימת"],["הוא הילך לאורך החוף, שקוע במחשבות.","הזוג הילך בשבילי הגן."]],["הִכָּה גַּלִּים",["עורר עניין, התפרסם","הביא לשינוי משמעותי בחשיבה המקובלת"],["התגלית המדעית היכתה גלים בעולם.","הסרט היכה גלים והפך לשיחת היום."]],["הִכָּה שׁוֹרֵש",["נעשה נפוץ ורווח, התקבל"],["המנהג החדש היכה שורש בקהילה.","הביטוי הזה היכה שורש בשפה העברית."]],["הֶעֱתִיק",["הזיז, העביר ממקום למקום"],["החברה העתיקה את משרדיה לעיר אחרת.","המלך העתיק את בירתו מצפון לדרום."]],["הֶקְהִיל",["גרם לאנשים להתאסף, גם להם להפוך לקהל"],["הזמר הקהיל אלפי מעריצים בכיכר.","ההודעה הקהילה את התושבים מול העירייה."]],["הֶרֶף",["הפסק! די! (ללא הרף - ללא הפסקה, כל הזמן)"],["הרף! אל תמשיך לדבר בזמן השיעור.","הגשם ירד ללא הרף כל הלילה."]],["הִתִּיק",["הזיז, העביר ממקום למקום, הסיט"],["הוא התיק את הכיסא לפינת החדר.","השלג התיק את הרכבים ממקומם."]],["זָב",["מטפטף, נוזל"],["מהברז הישן זב מים כל הלילה.","דם זב מהחתך באצבע."]],["זָב חֹטֶם",["אדם פחות ערך","כינוי גנאי לאדם חסר ניסיון, צעיר"],["מה יבין זב חוטם כמוך בפוליטיקה?","המנהל הוותיק התייחס לעובד החדש כאל זב חוטם."]],["זֶבֶד",["מתנה, שי"],["השכנים הביאו לה זבד קטן לרגל הולדת בתה.","השי שהביאו האורחים היה זבד נאה."]],["זוֹט",["קרקעית, תחתית של כלי"],["המשקעים שקעו בזוט הבקבוק.","בזוט הסיר נותר מעט אורז."]],["זוּטָא",["קטן מאוד, זעיר, פעוט, שולי"],["זו רק תקלה זוטא, נתקן אותה מהר.","הם התווכחו על עניין זוטא."]],["זוּטוֹת",["דברים של מה בכך, אפסי, זניח, חסר משמעות"],["אל תתעכב על זוטות, התמקד בעיקר.","הזוג התווכח על זוטות."]],["זוּלָת",["חוץ מ-, פרט ל-","אדם או בני אדם, שאר האנשים"],["כולם הגיעו לטיול זולת דני.","צריך להתחשב ברגשות הזולת."]],["זוּלָתָן",["אדם המעדיף את טובת האחר על פני טובתו שלו"],["האחות הזולתנית נשארה לעבוד שעות נוספות כדי לעזור.","ילד זולתן חולק את הממתקים שלו עם כולם."]],["זָח",["זז, זע, נע"],["השולחן לא זח ממקומו למרות הרעידה.","דעתו לא זחה מאז הריב."]],["חֵבֶל",["ייסורים, מכאוב, בציפייה לדבר חיובי (חבלי לידה)"],["המדינה החדשה עברה חבלי לידה קשים.","הצוות חווה חבלי קליטה בשבועות הראשונים."]],["חֶבֶל",["אזור, מחוז"],["חבל לכיש נמצא בדרום הארץ.","יישובי חבל הבשור מגדלים ירקות."]],["חֲבַרְבָּר",["בעל חברבורות, מנומר"],["החתול החברבר נרדם בשמש.","הם ראו נחש חברבר בין הסלעים."]],["חָג",["נע במעגלים סביב דבר מה, הסתובב","צייר עיגול (מחוגה - מכשיר לסרטוט מעגל)"],["הנשר חג מעל הבקעה.","התלמיד חג עיגול במחוגה."]],["חוֹזֵר",["הודעה המופצת ברבים, תצהיר"],["משרד החינוך שלח חוזר לכל בתי הספר.","לפי החוזר, הלימודים יתחילו מאוחר יותר."]],["חֲטָף",["מהירות גבוהה (מבט חטוף - מבט מהיר)"],["הוא העיף מבט חטוף בשעון.","אחרי ביקור חטוף בעיר, חזרנו הביתה."]],["חִיגֵּר",["בעל מום ברגליו, צולע"],["החיגר הלך בעזרת קביים.","אחרי הפציעה נותר חיגר ברגלו השמאלית."]],["חֲכִירָה",["השכרת אדמה או נכס כלשהו למשך תקופת זמן ידוע מראש בתמורה לתשלום כספי"],["החברה חתמה על חכירה של הקרקע לארבעים ותשע שנים.","חוזה החכירה מסתיים בעוד שנה."]],["חֵלְכָּאִי",["עני, אדם חלש ועלוב"],["הוא לא התבייש לעזור לחלכאים ולנדכאים.","החלכאי ישב בפינת הרחוב וביקש נדבה."]],["חָרֵב",["יבש","הרוס, שומם, נטוש"],["הבאר הייתה חרבה אחרי הבצורת.","הכפר נותר חרב אחרי המלחמה."]],["חָרָבָה",["אדמה שאינה מכוסה מים, יבשה"],["בני ישראל עברו את ים סוף בחרבה.","אחרי שהמים נסוגו, נחשפה חרבה רחבה."]],["טַבּוּלָה רָאסָה",["אינו יודע דבר בתחום מסוים, חסר דעה בנושא מסוים"],["בנושא המשפטי הזה אני טבולה ראסה.","התלמידים הגיעו לקורס כטבולה ראסה."]],["יוֹקֵב",["בעל יקב"],["היוקב הוותיק הזמין אותנו לטעום יין.","היוקב סיפר על השנה הטובה לענבים."]],["יוֹרֶה",["הגשם הראשון"],["החקלאים חיכו ליורה כדי להתחיל לזרוע.","היורה ירד השנה כבר באוקטובר."]],["יַנוּקָא",["תינוק"],["אל תדבר אליו כמו לינוקא, הוא כבר מבוגר.","הינוקא ישן בעגלה."]],["יַעֲרָה",["טבלת דונג שהדבורים בנו בה תאים ומילאו אותה בדבש"],["הדבוראי הוציא את היערות מהכוורת.","יונתן טבל מקל ביערת הדבש."]],["כְּסִיל",["טיפש, שוטה"],["רק כסיל יאמין לשקרים האלה.","הכסיל אינו לומד מטעויותיו."]],["כְּפִיר",["אריה צעיר"],["הכפיר למד לצוד ליד אמו.","הלוחמים הצעירים הסתערו ככפירים."]],["כָּפַן",["רעב"],["המשפחה כפנה בשנות הבצורת.","הם כפנו ללחם בזמן המצור."]],["כָּפַת",["קשר, כבל"],["השודדים כפתו את השומר.","הם כפתו אותו לכיסא."]],["לַאֲשוּרוֹ",["כהלכתו, במדויק"],["צריך לקרוא את החוזה לאשורו לפני שחותמים.","רק אחרי שנים הבנתי את דבריו לאשורם."]],["לָבִיא",["אריה"],["הלביא נח בצל העץ.","השחקן נלחם כלביא על הכדור."]],["לִפְרָקִים",["מדי פעם, מעת לעת"],["לפרקים הוא נזכר בימי ילדותו.","השמיים היו מעוננים, ולפרקים ירד גשם."]],["מַאְפֵּלְיָה",["מקום משכנו של הרשע","חושך מוחלט, אפלה"],["החדר היה שרוי במאפליה.","הם ירדו אל מאפליית המרתף."]],["מִבְדוֹק",["מבנה מיוחד המיועד לתיקון כלי שייט"],["האונייה הועברה למבדוק לתיקון.","במבדוק הנמל עבדו מאות פועלים."]],["מְבוּזָּר",["מפוזר"],["סניפי החברה מבוזרים ברחבי הארץ.","הניהול המבוזר מאפשר לכל מחלקה להחליט בעצמה."]],["מָגוֹר",["פחד, אימה"],["התושבים חיו במגור מתמיד מפני הפיגועים.","מגור מסביב, והוא לא ידע לאן לברוח."]],["מִגֵּר",["הביס את האויב, ניצח","השמיד משהו לחלוטין, חיסל"],["הצבא מיגר את הכוחות המורדים.","העירייה מיגרה את תופעת הוונדליזם בפארק."]],["מְהֻקְצָע",["מלוטש, עבר החלקה בעזרת מקצועה","מסוגנן, אלגנטי"],["הנגר הציג שולחן מהוקצע ומבריק.","הוא דיבר בשפה מהוקצעת ומנומסת."]],["מוּבָאָה",["ציטוט"],["הסופר פתח את הספר במובאה מהתנ״ך.","המאמר מלא מובאות מדברי חכמים."]],["מוֹרַג",["כלי דַּיִשׁ קדום (דיש - הפרדת גרגירי תבואה)"],["השוורים משכו את המורג על הגורן.","במוזיאון מוצג מורג עשוי עץ ואבנים."]],["מָזוֹר",["מרפא, תרופה","חולי, מכאוב"],["הם חיפשו מזור למחלה.","אין מזור לכאבו של אב שכול."]],["מִזְקָקָה",["מקום לזיקוק ולהכנת משקאות חריפים"],["הוויסקי יוצר במזקקה בסקוטלנד.","ביקרנו במזקקה ולמדנו איך מכינים ערק."]],["מַחְבּוֹש",["עונש של כליאה"],["המתפרעים נשלחו למחבוש.","החייל שנעדר נשפט לשבועיים במחבוש."]],["מַחְבֵּצָה",["כלי מיוחד ששימש להכנת מוצרי חלב כמו גבינה או חמאה"],["סבתא הכינה חמאה במחבצה.","במוזיאון הכפר הוצגה מחבצה עשויה עץ."]],["מְחֻטָּט",["מלא בצלקות שנגרמו ממחלת עור כלשהי"],["פניו היו מחוטטות בעקבות מחלה בילדותו.","העור המחוטט שלו לא הפריע לו להיות שחקן."]],["מָךְ",["עני"],["העשיר נתן צדקה לכל מך ונצרך.","האיכר המך לא יכול היה לשלם את המס."]],["מָלֵא תְּכוּנָה",["שוקק חיים, מלא פעילות"],["השוק היה מלא תכונה לקראת החג.","הבית מלא תכונה לפני החתונה."]],["מֵלִיץ",["מי שממליץ על מישהו ומבר בזכותו","מתורגמן"],["עורך הדין שימש מליץ של העבריין הצעיר בפני השופט.","יוסף דיבר עם אחיו דרך מליץ."]],["מַנְפֵּטָה",["מכונה מיוחדת המשמשת להפרדת סיבי הכותנה מהזרעים"],["המנפטה הפרידה את סיבי הכותנה מהזרעים.","העובדים הזינו את הכותנה למנפטה."]],["מְסוֹאָב",["מלוכלך מאוד, מטונף","מושחת מוסרית, מנוון"],["החדר המסואב לא נוקה חודשים.","המנהיג הבטיח לנקות את המערכת המסואבת."]],["מִסּוּך",["שיבוש והחלשת שדות חשמליים","יצירת הפרדה, יצירת חציצה"],["המטוס הפעיל מערכת מיסוך נגד מכ״מים.","מיסוך האוזניות מבודד את המאזין מרעשי הסביבה."]],["מָסַךְ",["מזג, ערבב משקה במשקה"],["המלצר מסך את היין במים.","הברמן מסך שני משקאות לקוקטייל."]],["מַעֲרֶה הַיַּעַר",["אזור נטול עצים ביער, קרחת היער"],["התמקמנו במערה היער ופרשנו שמיכה.","צבאים רעו במערה היער."]],["מַפְסֶלֶת",["כלי עבודה המשמש לסיתות אבן או גילוף עץ, אזמל"],["הפסל גילף את העץ במפסלת.","הסתת הכה במפסלת על האבן."]],["מַק",["ריקבון"],["העצים ביער נרקבו והפכו למק.","הפרי נמק מרוב חום."]],["מַרְזֵחַ",["משתה (בית מרזח - פאב)"],["המלך ערך מרזח לשרים.","בכפר נערך מרזח לכבוד הבציר."]],["מרֶֹך לֵב",["הרגשת פחד וזעזוע, בעתה, אימה"],["מורך לב אחז בו כששמע את הסירנה.","הוא הפגין מורך לב וברח מהקרב."]],["מַרְנִין",["משמח","מהנה ביותר, נעים"],["קיבלנו את הבשורה המרנינה על הולדת התינוק.","זה היה ערב מרנין עם מוזיקה טובה."]],["מִשְׂגָּב",["מקום גבוה שמשמש כמחסה, מצודה"],["המבצר על ההר שימש משגב לתושבים.","אלוהים הוא משגב לי, כתב המשורר."]],["מִשְׁוֶרֶת",["טבעת לרגל בצד האוכף"],["הרוכב שם את רגלו במשוורת ועלה על הסוס.","המשוורת נקרעה, והרוכב נפל."]],["מַשְׂטֵמָה",["איבה, שנאה עזה"],["המשטמה בין שתי המשפחות נמשכה דורות.","הנאום עורר משטמה כלפי הזרים."]],["נֹאד",["שק עור לנוזלים, מימיה"],["הרועה שתה מים מן הנאד.","המטיילים מילאו את הנאדות במעיין."]],["נָאוֹר",["מתורבת, משכיל"],["בחברה נאורה מכבדים את זכויות המיעוטים.","המלך הנאור ייסד בתי ספר בכל הממלכה."]],["נֶאֱלָם",["השתתק, נדם"],["כשראה אותה, נאלם דום.","הקהל נאלם כשהזמרת החלה לשיר."]],["נְאָצָה",["גידוף, דברי בלע"],["המפגינים צעקו נאצות לעבר השר.","במכתב נכתבו נאצות קשות."]],["נֶבֶט",["צמח בראשית צמיחתו"],["הנבטים הירוקים בקעו מהאדמה.","הנבטים של הרעיון נראו כבר בשנה הקודמת."]],["נִבְעָר",["בּוּר, חסר השכלה"],["רק נבער מדעת יכול להאמין בזה.","הם התייחסו אליו כאל נבער."]],["נָבַר",["חיטט, פשפש"],["הכלב נבר באדמה בחיפוש אחר עצם.","העיתונאי נבר במסמכים ישנים."]],["נִגַר",["נזל, זרם"],["מי הגשם ניגרו ברחוב.","דמעות ניגרו מעיניה."]],["נָהָה",["רצה מאוד, השתוקק"],["העם נהה אחרי המנהיג הכריזמטי.","הם נוהים אחרי כל אופנה חדשה."]],["נְהִי",["בכי מר, יללה"],["מבית האבל נשמע נהי.","נהי וקינה נשמעו מן העיר החרבה."]],["נוֹאָל",["טיפשי, אווילי"],["זה היה רעיון נואל לנסוע בסערה.","התנהגותו הנואלת גרמה לתאונה."]],["נוֹקֵד",["מגדל צאן, רועה צאן"],["הנוקד רעה את צאנו בהרים.","הנביא עמוס היה בנוקדים מתקוע."]],["נוֹשֶה",["מלווה"],["הנושים דרשו את כספם בחזרה.","הבנק הוא הנושה העיקרי של החברה."]],["נְחִירָה",["המתת בעלי חיים (בדרך כלל חזיר) על ידי דקירה"],["לפי ההלכה, נחירה אינה כשרה.","בכפר הישן ביצעו נחירה של החזירים לפני החורף."]],["נִיר",["אחו, שדה שנחרש"],["החקלאי חרש את הניר.","בניר הירוק רעו הפרות."]],["נַכְלוּלִי",["רמאי, נוכל, מעורפל בכוונותיו"],["הוא איש נכלולי שאי אפשר לסמוך עליו.","החברה נקטה בשיטות נכלוליות כדי להתחמק מתשלום."]],["נָפָה",["כלי בעל נקבים קטנים לניפוי קמח, מסננת","אזור, אחוז"],["האופה ניפה את הקמח בנפה.","התושבים בנפת השרון יצביעו מחר."]],["נֵצֶר",["בן, צאצא","ענף רך הצומח מהשורש"],["הבן הוא נצר למשפחת רבנים ידועה.","נצר צעיר צמח מגזע העץ הכרות."]],["נָצַר",["שמר, הגן"],["הוא נצר את הסוד בלבו שנים.","נצור לשונך מרע."]],["נָשִׂיא",["ענן נושא גשם"],["נשיאים ורוח וגשם אין.","נשיאים כבדים נאספו מעל ההרים."]],["נֶשֶׁךְ",["ריבית"],["הבנק גבה נשך גבוה על ההלוואה.","התורה אוסרת לתת כסף בנשך."]],["נִשְפֶּה",["חלק ותלול"],["המטפסים נאחזו בצוק הנשפה.","הדרך הנשפה ירדה אל התהום."]],["סַד",["מכשיר עינוי קדום","לוח מיוחד המשמש לקיבוע ותמיכה באיבר פצוע"],["הרופא שם סד על הרגל השבורה.","במוזיאון מוצג סד ששימש לעינוי אסירים בימי הביניים."]],["סַהַר",["ירח, לבנה"],["אור הסהר האיר את השדה.","בליל הסהר יצאנו לטיול."]],["סְחִי",["אשפה, זוהמה, לכלוך"],["הרחובות היו מלאים סחי אחרי השביתה.","הם התייחסו אליו כאל סחי."]],["סֵיפָא",["סוף, החלק האחרון (להיפך: רֵישָא)"],["בסיפא של הסעיף נקבע חריג.","לא הבנתי את הסיפא של המשפט."]],["סְפּוֹרָדי",["בלתי סדיר, אקראי, ללא חוקיות קבועה"],["באזור נרשמו התקפות ספורדיות.","השמש הופיעה רק באופן ספורדי במשך היום."]],["סְפָר",["גבול, קצה, רצועת אדמה החוצצת בין מדינות (ישובי ספר - ישובי גבול)"],["יישובי הספר סבלו מירי.","הם הקימו קיבוץ בספר המדבר."]],["סְתַגְּלָן",["מי שמתאים עצמו בקלות למצבים חדשים, אדפטיבי"],["הוא סתגלן שמסתדר בכל מקום עבודה.","הילדים סתגלנים יותר מהמבוגרים."]],["עָב",["ענן"],["עבים כבדים כיסו את השמיים.","השמש יצאה מבין העבים."]],["עֲבוֹתוֹת",["חבלים עבים"],["הספינה נקשרה לרציף בעבותות.","הם קשרו את המשא בעבותות."]],["עֲזוּבָה",["מצב של הרס והזנחה"],["הבית עמד בעזובה שנים.","העזובה בגן הציבורי הדאיגה את התושבים."]],["עֲלוּמִים",["ימי הנעורים"],["בימי עלומיו טייל בכל העולם.","היא נזכרה בעלומיה בקיבוץ."]],["עֲלָטָה",["חושך, אפלה"],["הגנבים פרצו לחנות בחסות העלטה.","בעלטה לא ראינו דבר."]],["עָשָׂה נְפָשׁוֹת",["גייס תומכים למשהו"],["הפעילים עשו נפשות לקידום החוק.","הוא עשה נפשות למען המועמד."]],["פּוּלְמוּס",["ויכוח, מחלוקת"],["המאמר עורר פולמוס סוער בעיתונות.","הפולמוס בין המדענים נמשך שנים."]],["פּוּר",["מזל, גורל"],["הפור נפל, והוא נבחר לתפקיד.","חג פורים נקרא על שם הפור שהטיל המן."]],["פּוּרְתָּא",["מעט, קצת (נחמה פּוּרְתָּא - נחמה מועטה)"],["נחמה פורתא היא שלפחות הוא לא נפצע.","הוא התעכב פורתא לפני שענה."]],["פִּיד",["אסון, צרה"],["פידו של העם הגיע כשפרצה המלחמה.","השמחה לפידו של אויב אינה מכובדת."]],["פִּיל לָבָן",["כינוי לפרויקט ענק שהושקע בו רבות אך אין בו שימוש"],["האצטדיון הענק הפך לפיל לבן.","התושבים מתחו ביקורת על הפיל הלבן שבנתה העירייה."]],["פִּילֵּל",["ציפה, קיווה"],["לא פיללתי שהוא יצליח כל כך.","היא לא פיללה שתזכה בפרס."]],["פִּיסֵח",["צולע"],["החתול הפיסח הסתובב בחצר.","מאז התאונה הוא פיסח ברגלו."]],["פַּרְגּוֹד",["סוג של מחיצה ניידת"],["הרופא ביקש מהמטופל לעמוד מאחורי הפרגוד.","פרגוד הפריד בין מיטות החולים."]],["פְּרוֹלוֹג",["מבוא, הקדמה (להיפך: אפילוג)"],["בפרולוג של המחזה המקהלה מציגה את הדמויות.","הנאום היה פרולוג לשינויים הגדולים."]],["פִּתְחוֹן פֶּה",["אפשרות לומר דבר מה, הזדמנות לטעון משהו"],["אסור לתת להם פתחון פה להאשים אותנו.","הוא ביקש פתחון פה כדי להסביר את עצמו."]],["צְבִיר",["קבוצה (צביר עננים - קבוצת עננים)"],["צביר כוכבים נראה בטלסקופ.","צביר של עננים כיסה את ההרים."]],["צְדִיָּה",["כוונה רעה, זדון"],["בית המשפט קבע שהמעשה נעשה בצדייה.","לא הייתה בדבריו צדייה, רק טעות."]],["צַדְקָנוּת",["תכונתו של הצדקן, גלגול עיניים"],["הצדקנות שלו מעצבנת את כל חבריו.","נמאס לי מהצדקנות של השכנה."]],["צָמִיג",["סמיך, דביק"],["הדבש הצמיג נזל לאט מהכף.","שמן המנוע נעשה צמיג בקור."]],["צִקְצוּק",["קול הנוצר על ידי הנעת הלשון בין השיניים לחניכיים (לרוב מציין חוסר אישור או שלילה)"],["הוא ציקצק בלשונו כשראה את הציון.","הצקצוק של הסבתא הביע אי שביעות רצון."]],["צָרוּף",["מזוקק, ברור וטהור (
